# Frontend (SPA) + backend API bitta domen ostida — CORS kerak emas.
upstream tryjob_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # file_validator MAX_FILE_SIZE_MB=10 + zaxira
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://tryjob_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI baholash zanjiri (3 provayder x 30s) so'rov ichida ishlaydi.
        proxy_read_timeout 120s;
    }

    # Swagger UI va OpenAPI sxemasi
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://tryjob_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        # add_header emas, expires — aks holda server darajasidagi
        # xavfsizlik headerlari bu location'da yo'qoladi (nginx merosi).
        expires 1y;
        try_files $uri =404;
    }

    # SPA: noma'lum yo'llar index.html'ga (React Router)
    location / {
        expires -1;   # Cache-Control: no-cache
        try_files $uri $uri/ /index.html;
    }
}
