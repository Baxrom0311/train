# TryJob — to'liq stek: postgres, redis, migrate, backend, frontend (nginx).
#
#   cp deploy/.env.example deploy/.env   # va to'ldiring
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Tafsilotlar: deploy/README.md

name: tryjob

# §18.4: log rotatsiya — disk to'lib qolmasin
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER kerak}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@postgres:5432/${POSTGRES_DB:-tryjob_dev}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak (openssl rand -hex 32)}
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_PROVIDERS: ${LLM_PROVIDERS:-deepseek,gemini,openai}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  LLM_PRICES: ${LLM_PRICES:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-TryJob <no-reply@localhost>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  # §22.2: bo'sh — push o'chiq (sayt va email ishlaydi)
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  # §19.2: talaba kodi faqat alohida runner'da bajariladi
  SANDBOX_URL: http://sandbox:8100
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN kerak (openssl rand -hex 32)}
  UPLOAD_DIR: /data/uploads

services:
  postgres:
    # pgvector — §9.4 RAG embedding'lari (alohida vektor DB yo'q, §3)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tryjob_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-tryjob_test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bir martalik: alembic upgrade head (roles/permissions seed ham shu yerda).
  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: tryjob-backend
    environment: *backend-env
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    image: tryjob-backend
    networks: [default, sandbox]
    restart: unless-stopped
    logging: *logging
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # Run chat fayllari (§9.5): konteyner read_only, shuning uchun alohida
    # yoziladigan volume. nginx bu fayllarni to'g'ridan-to'g'ri bermaydi.
    volumes:
      - uploads:/data/uploads
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      # §18.1: DB va Redis — worker holati tashqi monitorda (/api/v1/health)
      test: ["CMD", "python", "/srv/tools/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
    expose:
      - "8000"

  # arq AI-retry worker — Cloud AI zanjiri (DeepSeek/Gemini/OpenAI)
  # muvaffaqiyatsiz bo'lganda navbatga tushgan submission'larni qayta
  # baholaydi (app/ai/worker.py WorkerSettings). Standart profilda ishga
  # tushadi — alohida --profile kerak emas, chunki bu AI mentor
  # funksiyasining ajralmas qismi (navbat ishlamasa, muvaffaqiyatsiz
  # baholashlar abadiy "queued_retry" holatida qolib ketadi).
  worker:
    image: tryjob-backend
    networks: [default, sandbox]
    restart: unless-stopped
    logging: *logging
    environment: *backend-env
    command: ["arq", "app.ai.worker.WorkerSettings"]
    healthcheck:
      # arq health-check kaliti har daqiqa yangilanadi (§18.1)
      test: ["CMD", "arq", "--check", "app.ai.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # Run chat fayllari (§9.5): konteyner read_only, shuning uchun alohida
    # yoziladigan volume. nginx bu fayllarni to'g'ridan-to'g'ri bermaydi.
    volumes:
      - uploads:/data/uploads
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # §18.3: kunlik zaxira — Postgres dump + uploads, deploy/backups/ ga
  backup:
    image: pgvector/pgvector:pg16   # pg_dump versiyasi server bilan bir xil
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tryjob_dev}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Tashkent
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy

  # §19.1: talaba kodi — tarmoqsiz (internal), secretsiz, faqat o'qiladigan
  sandbox:
    build:
      context: ..
      dockerfile: deploy/sandbox.Dockerfile
    image: tryjob-sandbox
    restart: unless-stopped
    logging: *logging
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    expose:
      - "8100"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: tryjob-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  # internet, Postgres va Redis'dan ajratilgan — faqat backend/worker ↔ sandbox
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  uploads:
