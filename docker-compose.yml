version: '3.8'

services:
  # ── 1. PostgreSQL 16 Production Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tryjob_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tryjob_db}
      POSTGRES_USER: ${POSTGRES_USER:-tryjob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongProdPassword2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryjob_user} -d ${POSTGRES_DB:-tryjob_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tryjob_net

  # ── 2. Redis Cache & Broker ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tryjob_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tryjob_net

  # ── 3. FastAPI Backend (Gunicorn + Uvicorn Workers + Alembic) ──────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tryjob_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      USE_POSTGRES: "true"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tryjob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongProdPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-tryjob_db}
      SECRET_KEY: ${SECRET_KEY:-tryjob-super-secret-production-key-2026-uzbekistan-secure-hash-jwt}
      HMAC_CERT_SECRET: ${HMAC_CERT_SECRET:-tryjob-cert-hmac-sha256-signature-key-2026-uzb}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tryjob.uz,https://www.tryjob.uz,http://localhost:3000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GUNICORN_WORKERS: 4
      PORT: 8000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - tryjob_net

  # ── 4. Nginx Reverse Proxy & Load Balancer ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tryjob_nginx
    restart: always
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tryjob_net

volumes:
  postgres_data:
    name: tryjob_postgres_data
  redis_data:
    name: tryjob_redis_data
  uploads_data:
    name: tryjob_uploads_data

networks:
  tryjob_net:
    name: tryjob_network
    driver: bridge
