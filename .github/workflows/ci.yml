# TryJob CI (CONTRACT.md §31): har PR va main'ga push'da backend testlari,
# migratsiyalar, frontend lint/build, E2E (§34) va Docker image'lari tekshiriladi.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Faqat CI uchun soxta qiymatlar — haqiqiy secret emas (AGENTS.md).
env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tryjob_test
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tryjob_test
  REDIS_URL: redis://localhost:6379
  SECRET_KEY: ci-only-not-a-secret

jobs:
  backend-tests:
    name: Backend testlari (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16   # deploy/docker-compose.yml bilan bir xil
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tryjob_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # deploy/backend.Dockerfile bilan bir xil
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -p no:cacheprovider

  migrations:
    name: Alembic migratsiyalari
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16   # deploy/docker-compose.yml bilan bir xil
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tryjob_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Bo'sh bazaga upgrade head
        run: alembic -c alembic/alembic.ini upgrade head
      - name: Modellar va migratsiyalar mosligi (yangi migratsiya kerak emas)
        run: alembic -c alembic/alembic.ini check
      - name: To'liq downgrade va qayta upgrade
        run: |
          alembic -c alembic/alembic.ini downgrade base
          alembic -c alembic/alembic.ini upgrade head
      - name: Ssenariy kontentini nashr qilish (deploy qadami)
        run: python ../tools/import_scenario.py --publish content/scenarios/*.yaml

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"   # deploy/frontend.Dockerfile bilan bir xil
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tryjob_e2e   # tools/e2e/seed.py reset faqat *_e2e bazani tozalaydi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tryjob_e2e
      E2E_REDIS_URL: redis://localhost:6379/5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - name: Soxta soat (libfaketime)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Hisobot, trace va videolar (yiqilganda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker image'lari
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, sandbox]
    steps:
      - uses: actions/checkout@v5
      - name: deploy/${{ matrix.image }}.Dockerfile
        run: docker build -f deploy/${{ matrix.image }}.Dockerfile -t tryjob-${{ matrix.image }}:ci .
