    weight: 1.5
    competencies: [stress_handling, communication]
    rubric:
      - {id: who, description: "5 nomzod: Doniyor, Temur (rad etgan), Jamshid, Ziyoda, Bekmurod (zaxira); oshkor: F.I.Sh., telefon, pasport, izohlar; 24 soat ichida xabar", weight: 2}
      - {id: message, description: "Xabar: nima oshkor bo'ldi, nima qilindi (o'chirish, tekshiruv), aloqa shaxsi; uzr, kichraytirmasdan", weight: 1.5}
      - {id: no_harm, description: "Bekmurodga 'qimmat' izohi so'zma-so'z takrorlanmaydi, baholash izohi borligi aytiladi; kompensatsiya va'da yo'q; boshqa nomzod ma'lumoti yo'q", weight: 1.5}
    hints:
      - "Fayldagi 18 kishidan qaysilari xodim emas? Ro'yxatning oxirgi qatoriga qarang."
    reference_answer: |
      Nomzodlar: Doniyor, Temur, Jamshid, Ziyoda, Bekmurod — F.I.Sh., telefon, pasport seriyasi/raqami; Ziyoda va Bekmurodda izoh ham. Xabar bugun, 24 soat ichida.
      Namuna: "Hurmatli ..., bugun 15:10 da ichki xatolik tufayli sizning F.I.Sh., telefon va pasport ma'lumotlaringiz bor fayl korxonamiz xodimlari
      guruhiga yuborildi. Fayl o'chirildi, tarqatilgan nusxalar o'chirilmoqda, holat ma'lumotlar himoyasi mas'uli bilan tekshirilmoqda. Uzr so'raymiz.
      Savollar: Dilnoza Rahimova, HR boshlig'i." Ziyoda va Bekmurodga: faylda nomzodlik bo'yicha ichki izoh ham bo'lganini aytamiz, mazmunini takrorlamaymiz.
      Kompensatsiya va'da qilinmaydi.

  - id: incident_pay_facts
    type: incident
    role: cb
    day: 1
    at: "15:30"
    from: botir
    brief: |
      Jadvaldagi ish haqi raqamlari Komil akaning xato qoralamasidan — guruhda "tungida 9.3 mln" deb gap tarqaldi.
      Siz raqamlar tomonini olasiz: 1) incident reyestri uchun qisqa yozuv (nechta shaxs, qaysi maydonlar, maxsus
      ma'lumot); 2) tarqalgan raqam qayerda xato va to'g'ri qoida; 3) onboarding jamoadoshingizga xodimlar uchun
      qaysi raqamlarni berasiz va qaysilarini — yo'q.
    attachments: [doc_leak_case, doc_pay_rules, doc_data_policy]
    answer_types: [text]
    due_in_minutes: 30
    weight: 1.5
    competencies: [technical, stress_handling]
    rubric:
      - {id: register, description: "Reyestr: 15:10, 186 a'zoli guruh, 18 shaxs (13 xodim, 5 nomzod), maydonlar: F.I.Sh., telefon, pasport, ish haqi, izoh; tibbiy ma'lumot (Nodira, tashxis) — maxsus; 47 ko'rish, 2 uzatish", weight: 2}
      - {id: correction, description: "Xato: 9 300 000 = 6 000 000 + 50% + mukofot, dekabr pro-rata yo'q; to'g'ri: operator dekabr 6 600 000, to'liq oy 8 400 000 (+40% faqat tungi soatlar uchun)", weight: 1.5}
      - {id: what_to_share, description: "Onboarding'ga: umumiy qoida va lavozim summalari; individual ish haqi, kim qancha olishi muhokama qilinmaydi", weight: 1.5}
    hints:
      - "9 300 000 ni qismlarga ajrating — qaysi qism qoidaga zid?"
    reference_answer: |
      Reyestr: 07.12 15:10, "1-sex umumiy" (186 a'zo), 18 shaxs — 13 xodim va 5 nomzod; F.I.Sh., telefon, pasport, lavozim, oklad, ustama, dekabr jami, izohlar;
      maxsus — Nodiraning tibbiy ma'lumoti (tashxis), baholash izohlari (Abbos, Bekmurod, Ziyoda). 15:28 holatiga 47 ko'rish, 2 uzatish.
      Raqam: 9 300 000 = 6 000 000 + 3 000 000 (50%) + 300 000 — ustama 40% bo'lishi va dekabr 15/20 bo'lishi kerak; to'g'ri dekabr 6 600 000, to'liq oy 8 400 000.
      Tungi ustama faqat 22:00–06:00 soatlar uchun — kunduzgi smenaga nisbatan farq shundan.
      Onboarding'ga: umumiy qoida va lavozim summalari (6.6 / 4.92 / 4.71 mln dekabr). Individual summalar guruhda muhokama qilinmaydi.

  - id: incident_staff_comms
    type: incident
    role: onboarding
    day: 1
    at: "15:30"
    from: dilnoza
    brief: |
      Siz xodimlar tomonini olasiz: 1) guruhga darhol yoziladigan xabar (o'chirish, uzatmaslik, noto'g'ri raqam
      haqida); 2) Nodira va Abbosga shaxsiy xabar; 3) tungi smena xodimlariga bugungi smenadan oldin nima deymiz.
      Raqamlarni C&B jamoadoshingizdan oling.
    attachments: [doc_leak_case, doc_data_policy, doc_team_charter]
    answer_types: [text]
    due_in_minutes: 30
    weight: 1.5
    competencies: [communication, stress_handling]
    rubric:
      - {id: group_post, description: "Guruhga: fayl xato bilan yuborilgan, o'chirish va uzatmaslik iltimosi, uzatilgan nusxalar ham o'chirilsin; raqamlar xato qoralama, to'g'ri qoida HR'dan; adminga murojaat", weight: 2}
      - {id: personal, description: "Nodiraga: tibbiy ma'lumot oshkor bo'lgani, uzr, choralar, aloqa; Abbosga: izoh borligi, qaror hali qabul qilinmagani va aloqa iltimosi — ayblovsiz", weight: 1.5}
      - {id: no_violations, description: "Guruhda tashxis, kimning qancha olishi yoki aybdor (Komil aka) muhokama qilinmaydi; oshirish va'da qilinmaydi", weight: 1.5}
    hints:
      - "Tartibning birinchi qadami va 'taqiqlanadi' qatori — guruh xabarida nima bo'lishi va nima bo'lmasligini belgilaydi."
    reference_answer: |
      Guruhga: "Hurmatli hamkasblar, 15:10 da bu guruhga xato bilan ichki fayl yuborildi. Iltimos, uni o'chiring va hech kimga uzatmang; uzatgan bo'lsangiz,
      o'sha joydan ham o'chiring. Fayldagi raqamlar tasdiqlanmagan qoralama — tungi smena ish haqi qoidasi bo'yicha HR'ga murojaat qiling." Adminga: faylni o'chirish.
      Nodiraga: "Nodira opa, ichki faylda sizning tibbiy ko'rik natijangiz ham bor edi va u xodimlar guruhiga tushdi. Fayl o'chirildi, uzr so'raymiz; ertaga HR bilan
      uchrashib, keyingi qadamlarni gaplashamiz." Abbosga: faylda kelmaganingiz haqida ichki izoh bor edi, uzr; iltimos, bugun HR bilan bog'laning.
      Tungi smenaga 21:00 da: "Bugungi faylda xato raqamlar bor edi; dekabr uchun to'g'ri summalar (C&B'dan): operator 6.6, yordamchi 4.92, qadoqlovchi 4.71 mln."

