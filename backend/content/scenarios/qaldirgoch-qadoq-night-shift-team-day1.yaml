    from: dilnoza
    brief: |
      SHOSHILINCH: 15:10 da "1-sex umumiy" guruhiga tungi smena jadvali (telefon, pasport, ish haqi, izohlar) tushib qoldi.
      Siz nomzodlar tomonini olasiz: xodim bo'lmagan 5 nomzodning ma'lumoti nima, ularga nima va qachon yozamiz —
      bitta namunaviy xabar va har biriga nimani alohida qo'shish kerakligi. Bekmurodning izohi bilan ehtiyot bo'ling.
    attachments: [doc_leak_case, doc_data_policy]
    answer_types: [text]
