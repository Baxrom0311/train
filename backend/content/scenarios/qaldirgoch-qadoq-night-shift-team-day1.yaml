# CONTRACT.md §29 — jamoaviy HR ssenariysi (2–3 talaba). Kompaniya, odamlar, nomzodlar va raqamlar o'ylab topilgan.
# Ishga qabul, ish haqi, tungi ish, mehnat muhofazasi va shaxsiy ma'lumotlar qoidalari — o'quv maqsadidagi
# ichki siyosat, real mehnat qonunchiligi yoki normativ emas.
# Hikoya: 1-sexda birinchi tungi smena ochilish kuni — rekruter ekipajni yig'adi, C&B tungi ish haqini hisoblaydi,
# onboarding birinchi tunni tayyorlaydi; tushdan keyin maxfiy jadval sex chatiga tushib qoladi.
