      - {id: offer, description: "Narx 99 000 so'm, QISH15 — 15% chegirma va 31-oktabr muddati aniq yozilgan; chegirmali narx to'g'ri bo'lsa (84 150 so'm) — qo'shimcha ijobiy", weight: 1.5}
      - {id: format, description: "Formatga mos: Instagram ≤120 so'z, 1 CTA, ≤2 emoji, ≤3 xeshteg va #oydinbarg; Telegram ≤3 xatboshi, havola yoki bot bilan tugaydi", weight: 1.5}
      - {id: voice, description: "Brend ovozi: samimiy, 'siz' murojaati, ortiqcha va'dasiz"}
      - {id: ab_test, description: "Ikki sarlavha bitta o'zgaruvchi bo'yicha farqlanadi (masalan, foyda va narx), har birining gipotezasi aniq"}
    hints:
