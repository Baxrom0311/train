      - "A/B testda ikki sarlavha faqat bitta jihat bilan farq qilsa, natijadan xulosa chiqarish mumkin bo'ladi."
    reference_answer: |
      Instagram: Sovuq kunlarda qo'llaringiz ham parvarish so'raydi 🤍 «Bodom va shi» kremi shi va bodom yog'i bilan teringizni
      namlab, yumshatadi. Ingredientlarning 92% i tabiiy kelib chiqishli, parabensiz. Sinovda 30 kishidan 28 tasida teri qurishi
      14 kunda kamaydi. QISH15 promokodi bilan 99 000 o'rniga 84 150 so'm — 31-oktabrgacha. Buyurtma — profildagi havola orqali.
      #oydinbarg #qishkiparvarish
      Telegram: 1) Qish yaqin — qo'l terisi birinchi bo'lib quriydi. 2) «Bodom va shi» kremi: 75 ml, shi va bodom yog'i, E vitamini,
      92% tabiiy kelib chiqishli tarkib. 3) QISH15 — 15% chegirma, 31-oktabrgacha. Buyurtma: @... bot, /start.
      Sarlavhalar: A "Qishda ham yumshoq qo'llar" (foyda/hissiyot), B "Qo'l kremi 15% arzon — QISH15" (narx/taklif).
      Gipoteza: auditoriya foydaga yoki chegirmaga ko'proq bosadimi — CTR va CPA bilan solishtiriladi.

