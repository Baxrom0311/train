  - id: dashboard_incident
    type: incident
    day: 1
    at: "15:30"
    from: rustam
    brief: |
      Shoshilinch! Dashboard kecha 1.45 mlrd so'm tushum ko'rsatyapti — odatda 480–500 mln. Rekordmi?
      Kengash slaydiga yozaymi? 30 daqiqa ichida ayting: bu raqam to'g'rimi, nega shunday chiqdi va
      menga hamda do'kon direktorlariga nima deb yozamiz.
    attachments: [doc_dashboard_incident]
    answer_types: [text, code]
    due_in_minutes: 30
    weight: 1.5
    competencies: [stress_handling, technical, communication]
    rubric:
      - {id: cause, description: "Sabab gipotezasi: 14:40 da qo'shilgan order_items JOIN har buyurtmani mahsulotlar soniga ko'paytirgan (~3×), SUM buyurtma darajasida qolgan", weight: 2}
      - {id: check_query, description: "Tekshiruv so'rovi: JOIN'dan keyin COUNT(*) vs COUNT(DISTINCT order_id) yoki JOIN'siz SUM ni POS (486.4 mln) bilan solishtirish", weight: 1.5}
      - {id: fix, description: "Tuzatish yo'li: view'ni oldingi versiyaga qaytarish yoki order_items'ni oldin order_id bo'yicha agregatlash; Sherzod bilan kelishib"}
      - {id: stakeholder_msg, description: "Rustam va direktorlarga qisqa xabar: raqam noto'g'ri, rekord emas, to'g'ri qiymat ≈486 mln, dashboard tuzatilguncha ishlatmaslik, tuzatish muddati", weight: 2}
      - {id: calm, description: "Xotirjam, ayblovsiz ohang; kengash slaydiga noto'g'ri raqam tushishining oldi olingan"}
    hints:
      - "Dashboard'dagi buyurtmalar soni va order_items qatorlari sonini solishtiring. View'da bugun nima o'zgargan?"
      - "Xabarda uch narsa bo'lsin: raqam to'g'rimi, hozir nima qilish kerak, qachon tuzatiladi."
    reference_answer: |
      Sabab: 14:40 da view'ga dwh.order_items bilan JOIN qo'shilgan. Har buyurtma mahsulot soniga ko'paygan
      (41 670 qator / 13 890 buyurtma = 3.0), SUM(o.amount_sum) esa buyurtma summasini har mahsulot uchun qayta qo'shgan:
      1 452.7 mln ≈ 3 × 486.4 mln. POS ham 486.4 mln — haqiqiy tushum shu.
      Tekshiruv:
        SELECT COUNT(*) AS rows_after_join, COUNT(DISTINCT o.order_id) AS orders
        FROM dwh.orders o JOIN dwh.order_items i ON i.order_id = o.order_id
        WHERE o.status = 'paid' AND DATE(o.order_ts + INTERVAL '5 hours') = '2026-10-06';
      Tuzatish (Sherzod bilan): view'ni oldingi versiyaga qaytarish yoki kategoriya uchun
      SUM(i.qty * i.price) ishlatish / order_items'ni avval order_id bo'yicha agregatlash.
      Xabar: "Rustam aka, dashboard'dagi 1.45 mlrd noto'g'ri — bugungi view o'zgarishida summa uch marta qo'shilgan.
      Kechagi haqiqiy tushum 486.4 mln (POS bilan mos). Tuzatilguncha (taxminan 1 soat) dashboard raqamlarini
      kengash slaydiga va do'konlarga ishlatmang, tuzatilgach yozaman."

