  - key: doc_metrics
    title: "Metrikalar ta'rifi (ichki standart)"
    content: |
      Hisobot haftasi: dushanba 00:00 dan yakshanba 23:59 gacha, Toshkent vaqti bo'yicha.
      1. Tushum = hafta ichidagi status = 'paid' buyurtmalar amount_sum yig'indisi. Qaytarilganlar kiritilmaydi.
      2. Buyurtmalar soni = noyob order_id soni (faqat to'langanlar).
      3. O'rtacha chek = tushum / buyurtmalar soni, so'mgacha yaxlitlanadi.
      4. Takroriy xaridor ulushi = hafta ichida kamida 2 ta to'langan buyurtmasi bor xaridorlar /
         kamida 1 ta to'langan buyurtmasi bor xaridorlar. Kartasiz (customer_id NULL) xaridorlar
         ikkala qismga ham kiritilmaydi. Foizda, 1 xona aniqlikda.
      5. Har bir hisobotda: davr, filtrlar, chiqarib tashlangan qatorlar soni va sababi yoziladi.

  - key: doc_reporting_policy
    title: "Hisobot va ma'lumotlar halolligi siyosati"
    content: |
      - Rahbariyat va kengash hisobotlarida ma'lumot tanlab olib tashlanmaydi. Biror do'kon yoki davr
        chiqarilsa, bu sahifada ochiq yoziladi va sababi aytiladi.
      - Grafik o'qlari manipulyatsiya qilinmaydi: ustunli grafikda Y o'qi 0 dan boshlanadi.
      - Yomon natija yashirilmaydi — izoh bilan beriladi: sabab (ma'lum bo'lsa), ta'sir, choralar.
      - Kelishmovchilik bo'lsa, analyst o'zi qaror qilmaydi: analitika bo'limi rahbariga yozadi.
      - Mijozlarning shaxsiy ma'lumotlari faqat agregat ko'rinishda; telefon, ism umumiy kanalga chiqarilmaydi.

  - key: doc_ab_test
    title: "A/B test: «Hafta oxiri −10%» push-kuponi"
    content: |
      Maqsad: ilovadagi push-xabar orqali 10% chegirma kuponi xaridni oshiradimi?
      Davr: 21–27 sentyabr. Tasodifiy taqsimot 50/50 rejalashtirilgan. Konversiya = push olgan foydalanuvchi
      7 kun ichida kamida bitta buyurtma qilgan.

      | Guruh          | Segment          | Foydalanuvchilar | Buyurtma qilganlar |
      | A (kuponsiz)   | yangi mijozlar   | 200              | 10                 |
      | A (kuponsiz)   | doimiy mijozlar  | 800              | 160                |
      | B (kupon −10%) | yangi mijozlar   | 800              | 56                 |
      | B (kupon −10%) | doimiy mijozlar  | 200              | 44                 |

      Marketing dashboard'idagi umumiy natija: A — 170 / 1000 = 17%, B — 100 / 1000 = 10%.
      Eslatma: yangi mijozlar odatda doimiylardan ancha kam xarid qiladi.

  - key: doc_dashboard_incident
    title: "«Kunlik tushum» dashboard'i: view va bugungi ko'rsatkichlar"
    content: |
      View (bugun 14:40 da yangilangan versiya):
      ```sql
      CREATE OR REPLACE VIEW mart.daily_revenue AS
      SELECT o.store_id,
             DATE(o.order_ts + INTERVAL '5 hours') AS day,
             SUM(o.amount_sum) AS revenue,
             COUNT(*) AS orders
      FROM dwh.orders o
      JOIN dwh.order_items i ON i.order_id = o.order_id
      WHERE o.status = 'paid'
      GROUP BY 1, 2;
      ```

      Kecha (06.10) tarmoq bo'yicha:
      - Dashboard 14:30 dagi holat: tushum 486.4 mln so'm, buyurtmalar 13 890.
      - Dashboard hozir: tushum 1 452.7 mln so'm, buyurtmalar 41 670.
      - Kassa tizimi (POS) hisoboti 06.10: 486.4 mln so'm.
      - dwh.order_items: 06.10 uchun 41 670 qator.

nodes:
  - id: welcome
    type: message
    day: 1
    at: "09:00"
    from: madina
    brief: |
      Sabzazor analitika bo'limiga xush kelibsiz! Bugun birinchi kuningiz. Onboarding hujjatini o'qing —
      ayniqsa "har raqamning manbasi bo'ladi" va "avval ma'lumot sifati" qoidalarini.

  - id: standup
    type: task
    day: 1
    at: "09:00"
    from: madina
    brief: |
      Ertalabki standup. Onboarding'dagi formatda bugungi rejangizni yozing: qaysi hisobot,
      qachon tayyor bo'ladi, nima to'sib turishi mumkin. 3–5 qator.
    attachments: [doc_onboarding]
    answer_types: [text]
    due_in_minutes: 20
    weight: 0.5
    competencies: [communication, time_management]
    rubric:
      - {id: format, description: "Formatga mos: ish / muddat / to'siqlar"}
      - {id: concrete, description: "Reja aniq: qaysi hisobot yoki so'rov, qanday natija, qachongacha", weight: 2}
      - {id: blockers, description: "To'siq yoki savol ochiq aytilgan (omborga kirish huquqi, metrikalar ta'rifi bilan tanishish)"}
    hints:
      - "Birinchi kunda ham reja bo'ladi: lug'at va metrikalar bilan tanishish, birinchi hisobot, muddat."
    reference_answer: |
      Bugun: ma'lumotlar lug'ati va metrikalar ta'rifi bilan tanishaman, haftalik do'konlar hisobotini (tushum,
      o'rtacha chek, takroriy xaridorlar) SQL bilan chiqaraman. Muddat: tushlikkacha.
      To'siq: dwh sxemasiga kirish huquqim hali yo'q — Sherzoddan so'rayman.

  - id: mentor_intro
    type: message
    day: 1
    at: "09:20"
    from: otabek
    brief: |
      Salom! Men Otabek, mentoringizman. SQL'ni siz uchun yozmayman, lekin qayerdan boshlashni birga topamiz.
      Bitta maslahat: so'rov yozishdan oldin jadvalni 5 daqiqa ko'z bilan ko'ring. Hint so'rasangiz beraman —
      faqat har hint task balini biroz kamaytiradi.

  - id: weekly_report
    type: task
    day: 1
    at: "09:30"
    from: madina
    brief: |
      Birinchi vazifa: 28.09–04.10 haftasi bo'yicha do'konlar hisoboti. Har do'kon (CHL, YUN, SRG) va tarmoq
      bo'yicha: tushum, buyurtmalar soni, o'rtacha chek; tarmoq bo'yicha takroriy xaridor ulushi.
      SQL so'rovini va natija jadvalini yuboring. Lug'atdagi namuna ustida hisoblang va qaysi qatorlarni
      nega chiqarib tashlaganingizni yozing.
    attachments: [doc_data_dictionary, doc_metrics]
    answer_types: [code, text]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    rubric:
      - {id: sql, description: "SQL to'g'ri va o'qiladigan: paid filtri, Toshkent vaqtiga o'tkazish (+5 soat), dublikatni olib tashlash (DISTINCT/ROW_NUMBER), do'kon bo'yicha GROUP BY", weight: 2}
      - {id: data_quality, description: "Uchala muammoni topgan va yozgan: 1005 dublikati, 1006 refunded, 1001 kiritiladi / 1012 chiqariladi (UTC → Toshkent hafta chegarasi); 1007 mehmon takroriy ulushga kirmaydi", weight: 2}
      - {id: store_numbers, description: "Do'konlar: CHL 484 000 / 4 / 121 000; YUN 481 000 / 4 / 120 250; SRG 451 000 / 3 / ≈150 333", weight: 2}
      - {id: total_numbers, description: "Tarmoq: tushum 1 416 000 so'm, 11 buyurtma, o'rtacha chek ≈128 727 so'm", weight: 1.5}
      - {id: repeat_share, description: "Takroriy xaridor ulushi 4/6 = 66.7% (C01, C02, C03, C04 / C01–C04, C06, C08)", weight: 1.5}
      - {id: transparency, description: "Hisobotda davr, filtrlar va chiqarilgan qatorlar soni (3 ta) sababi bilan yozilgan"}
    hints:
      - "Har bir qatorni metrikalar ta'rifiga solishtiring: to'langanmi, takrorlanmaganmi, shu haftagami? Lug'atdagi order_id va order_ts izohlarini qayta o'qing."
      - "Hafta Toshkent vaqti bo'yicha. 27.09 kechqurun va 04.10 kechqurun UTC'da yozilgan buyurtmalar Toshkentda qaysi kunga to'g'ri keladi?"
      - "Takroriy ulushning maxrajida kimlar bo'lishi kerak: barcha qatorlarmi yoki shu haftada to'lov qilgan kartali xaridorlarmi?"
    reference_answer: |
      WITH clean AS (
        SELECT DISTINCT order_id, store_id, customer_id, order_ts, amount_sum
        FROM dwh.orders
        WHERE status = 'paid'
          AND order_ts + INTERVAL '5 hours' >= '2026-09-28'
          AND order_ts + INTERVAL '5 hours' <  '2026-10-05'
      )
      SELECT COALESCE(store_id, 'JAMI') AS store, SUM(amount_sum) AS revenue,
             COUNT(*) AS orders, ROUND(AVG(amount_sum)) AS avg_check
      FROM clean GROUP BY ROLLUP (store_id);

      SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE n >= 2) / COUNT(*), 1) AS repeat_share
      FROM (SELECT customer_id, COUNT(*) AS n FROM clean
            WHERE customer_id IS NOT NULL GROUP BY customer_id) t;

      Natija: CHL 484 000 so'm / 4 / 121 000; YUN 481 000 / 4 / 120 250; SRG 451 000 / 3 / 150 333.
      Tarmoq: 1 416 000 so'm, 11 buyurtma, o'rtacha chek 128 727 so'm. Takroriy xaridorlar: 4 / 6 = 66.7%.
      Chiqarilgan 3 qator: 1005 ikkinchi nusxasi (dublikat, order_id PK emas), 1006 (refunded),
      1012 (04.10 19:40 UTC = 05.10 00:40 Toshkent — keyingi hafta). 1001 (27.09 21:10 UTC = 28.09 02:10) kiritildi.
      1007 tushumga kiradi, lekin kartasiz — takroriy ulushda hisobga olinmaydi.
      Tozalanmagan "hamma qatorlar yig'indisi" 2 064 000 so'm bo'lardi — 46% ga oshirilgan raqam.

  - id: report_ack
    type: message
    after: {node: weekly_report, event: submitted, minutes: 15}
    from: madina
    brief: "Hisobotni oldim. Tushlikdan keyin raqamlarni POS hisoboti bilan solishtirib ko'raman."

  - id: board_chart
    type: decision
    day: 1
    at: "11:30"
    from: rustam
    brief: |
      Salom! Ertaga kengash. Haftalik grafikda Sergeli juda yomon ko'rinyapti — o'tgan haftaga nisbatan −18%.
      Uni grafikdan olib tashlang, Y o'qini ham 400 mln dan boshlang, o'sish kattaroq ko'rinsin.
      Kengashda ortiqcha savol bo'lmasin. Bugun kechgacha slaydni yangilab yuboring.
    competencies: [communication, stress_handling]
    options:
      - key: honest_note
        label: "Hamma do'konlarni va 0 dan boshlanadigan o'qni qoldiraman; Sergeli yoniga pasayish sababi bo'yicha izoh qo'shishni taklif qilaman va Madina opaga xabar beraman"
        grade: correct
      - key: escalate_only
        label: "Rustam akaga javob bermay, so'rovni darhol Madina opaga uzataman"
        grade: acceptable
      - key: hide_store
        label: "Direktor so'radi — Sergelini olib tashlayman va o'qni 400 mln dan boshlayman"
        grade: wrong
        flag: hid_data

  - id: lead_on_hidden_data
    type: message
    day: 1
    at: "12:00"
    when: {flag: hid_data}
    from: madina
    brief: |
      Rustam akaning slaydini ko'rdim — Sergeli yo'q, o'q 400 mln dan boshlangan. Bu bizning hisobot siyosatiga zid:
      kengash noto'g'ri qaror qabul qilishi mumkin, keyin analitikaga ishonch qolmaydi. Slaydni eski holatiga
      qaytaring, Sergeli pasayishiga izoh qo'shamiz (1–3 oktabr muzlatgich nosozligi). Keyingi safar bunday
      so'rov bo'lsa, avval menga yozing.

  - id: mentor_review
    type: message
    day: 1
    at: "14:00"
    when: {any: [{missed: weekly_report}, {score_lt: {node: weekly_report, value: 60}}]}
    from: otabek
    brief: |
      Haftalik hisobotingizni ko'rdim — raqamlar hali ma'lumot sifati tekshiruvidan to'liq o'tmagan ko'rinadi.
      Urinishlar qolgan bo'lsa, qayta ko'rib chiqing: har qatorni "to'langanmi / takrormi / qaysi haftaga tegishli"
      degan uchta savol bilan tekshiring. Qaysi qadamda ikkilansangiz, menga yozing.

  - id: ab_analysis
    type: task
    day: 1
    at: "14:00"
    from: dilnoza
    brief: |
      Salom! Kupon testi natijasi chiqdi: dashboard'da B guruhida konversiya 10%, A'da 17%. Demak kupon savdoni
      buzyapti va kampaniyani to'xtatamizmi? Ertaga ertalab qaror qilishim kerak. Iltimos, natijani tekshirib,
      menga tushunarli tilda tavsiya yozing (statistikani yaxshi bilmayman).
    attachments: [doc_ab_test]
    answer_types: [text, file]
    due_in_minutes: 120
    weight: 1.5
    competencies: [technical, communication]
    rubric:
      - {id: segment_rates, description: "Segment bo'yicha konversiyalar to'g'ri: yangi A 5% / B 7%; doimiy A 20% / B 22%", weight: 2}
      - {id: simpson, description: "Umumiy 17% vs 10% guruhlar tarkibi har xilligidan (B'da 80% yangi, A'da 20%) — Simpson paradoksi; segment ichida B yaxshiroq", weight: 2}
      - {id: randomization, description: "Taqsimot 50/50 segmentlar bo'yicha buzilganini test xatosi sifatida ko'rsatgan, sababini tekshirishni taklif qilgan"}
      - {id: significance, description: "Farq (+2 p.p.; nisbiy +40% yangi, +10% doimiy) kichik tanlovda statistik ishonchli emasligini aytgan (z ≈ 1.0 va 0.6)", weight: 1.5}
      - {id: recommendation, description: "Menejer uchun aniq tavsiya: kampaniyani 'yomon' deb to'xtatmaslik va tarqatmaslik, segment bo'yicha to'g'ri taqsimlangan testni qayta o'tkazish; kupon xarajatini ham hisobga olish", weight: 1.5}
      - {id: plain_language, description: "Texnik bo'lmagan, qisqa tilda yozilgan: 3–6 qator, jargon tushuntirilgan"}
    hints:
      - "Umumiy foizga ishonishdan oldin har guruhdagi yangi va doimiy mijozlar ulushini solishtiring."
      - "Har segment ichida A va B konversiyasini alohida hisoblang. Natija umumiy rasmga mos keladimi?"
      - "Farqni 'ishonchli' deyish uchun qancha foydalanuvchi va qancha buyurtma bor? Yangi mijozlar A guruhida nechta xarid qilgan?"
    reference_answer: |
      Segmentlar: yangi — A 10/200 = 5%, B 56/800 = 7% (+2 p.p., nisbiy +40%); doimiy — A 160/800 = 20%, B 44/200 = 22% (+2 p.p., +10%).
      Umumiy 17% vs 10% chalg'ituvchi: B guruhining 80% i yangi mijozlar (ular kam xarid qiladi), A'da esa 80% doimiy —
      bu Simpson paradoksi. Teng tarkibda (50/50) A ≈ 12.5%, B ≈ 14.5% bo'lardi.
      Taqsimot rejadagidek 50/50 bo'lmagan — push segmentlash sozlamasini tekshirish kerak.
      Farqlar kichik tanlovda ishonchli emas (yangi: z ≈ 1.0; doimiy: z ≈ 0.6; p > 0.05).
      Dilnoza uchun: "Kupon savdoni buzmayapti — dashboard'dagi farq guruhlarga turli mijozlar tushgani uchun.
      Hozircha kupon foyda beradi deb ham aytolmaymiz. Tavsiya: kampaniyani hamma do'konlarga yoymaslik,
      1–2 hafta ichida har segmentda 50/50 taqsimlangan testni qayta o'tkazish va 10% chegirma xarajatini marja bilan solishtirish."

  - id: ab_thanks
    type: message
    after: {node: ab_analysis, event: submitted, minutes: 20}
    from: dilnoza
