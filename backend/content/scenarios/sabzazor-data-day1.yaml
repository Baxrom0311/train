documents:
  - key: doc_onboarding
    title: "Analitika bo'limi: onboarding"
    content: |
      Sabzazor — Toshkentdagi 12 ta do'kondan iborat oziq-ovqat tarmog'i, onlayn buyurtma va yetkazish ham bor.
      Analitika bo'limi: Madina (rahbar), Otabek (katta analyst, yangi xodimlar mentori), 3 analyst.
      Ma'lumotlar ombori va ETL — Sherzod (data engineer). Asosiy buyurtmachilar: operatsiyalar (Rustam), marketing (Dilnoza).

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Har kuni 09:00 da standup:
      bugun qaysi so'rov / hisobot ustida ishlayman / qachon tayyor bo'ladi / nima to'sib turibdi.

      Asosiy qoidalar:
      - Har bir raqamning manbasi bo'ladi: qaysi jadval, qaysi filtr, qaysi davr. So'rov (SQL) hisobotga ilova qilinadi.
      - Raqamni chiqarishdan oldin ma'lumot sifati tekshiriladi: dublikatlar, NULL, qaytarilgan buyurtmalar, vaqt mintaqasi.
      - Rahbariyat uchun xulosa texnik bo'lmagan tilda: 3–5 qator, raqam, xulosa, tavsiya, cheklovlar.
      - Mijozlarning shaxsiy ma'lumotlari (ism, telefon) hisobot va umumiy chatlarga chiqarilmaydi.

  - key: doc_data_dictionary
    title: "Ma'lumotlar lug'ati: orders jadvali (+ namuna)"
    content: |
      Jadval: dwh.orders — har bir buyurtma bitta qator (do'kon kassasi va onlayn).
      | Ustun       | Turi        | Izoh |
      | order_id    | bigint      | Buyurtma raqami. Biznes bo'yicha unikal, lekin jadvalda PRIMARY KEY yo'q (yuklash tarixiy sabablarga ko'ra). |
      | store_id    | text        | Do'kon kodi: CHL — Chilonzor, YUN — Yunusobod, SRG — Sergeli. |
      | customer_id | text NULL   | Sodiqlik kartasi egasi. NULL — kartasiz (mehmon) xaridor. |
      | order_ts    | timestamp   | Buyurtma vaqti, UTC'da saqlanadi (vaqt mintaqasisiz). Toshkent = UTC+5, yozgi vaqt yo'q. |
      | amount_sum  | bigint      | Buyurtma summasi, so'm (chegirmadan keyin). |
      | status      | text        | paid — to'langan; refunded — to'liq qaytarilgan. |

      Bog'liq jadval: dwh.order_items — buyurtmadagi har bir mahsulot bitta qator
      (order_id, product_id, category, qty, price). Bitta buyurtmada o'rtacha 3 ta mahsulot.

      Namuna: 3 do'kon, 2026-yil 28.09–04.10 haftasi atrofidagi yuklama (o'quv uchun qisqartirilgan, 14 qator):
      order_id | store_id | customer_id | order_ts (UTC)    | amount_sum | status
      1001     | CHL      | C01         | 2026-09-27 21:10  | 185000     | paid
      1002     | CHL      | C02         | 2026-09-28 06:45  |  92000     | paid
      1003     | YUN      | C03         | 2026-09-28 09:20  | 240000     | paid
      1004     | CHL      | C01         | 2026-09-29 12:05  |  64000     | paid
      1005     | SRG      | C04         | 2026-09-29 14:30  | 310000     | paid
      1005     | SRG      | C04         | 2026-09-29 14:30  | 310000     | paid
      1006     | YUN      | C05         | 2026-09-30 08:15  | 128000     | refunded
      1007     | YUN      | NULL        | 2026-09-30 10:40  |  76000     | paid
