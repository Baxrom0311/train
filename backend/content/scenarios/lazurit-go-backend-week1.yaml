    competencies: [technical, communication]
    rubric:
      - {id: coverage, description: "Barcha holatlar (new, accepted, cooking, delivering, delivered, cancelled) qamrab olingan", weight: 2}
      - {id: edge, description: "Chegara holatlari: ikki marta bosish, tarmoq qayta yuborishi, begona foydalanuvchi, 201+ belgili sabab, Payments timeout", weight: 2}
