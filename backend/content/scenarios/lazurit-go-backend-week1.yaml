documents:
  - key: doc_onboarding
    title: "Backend jamoasi: onboarding"
    content: |
      Lazurit Go — Toshkentdagi oziq-ovqat yetkazib berish xizmati. Backend jamoasi: Sardor (team lead),
      Nodir (senior, mentor), Malika (QA), Timur (SRE), uchta dasturchi. Mahsulot — Aziza (PM).

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Standup har kuni 09:00 da (yozma ham bo'ladi):
      kecha nima qildim / bugun nima qilaman / nima to'sib turibdi. 3–5 qator.
      Har kuni 17:30 da kun yakuni hisoboti.

      Ustuvorlik: 1) prod incident, 2) relizni to'sib turgan bug, 3) sprint task'lari, 4) yangi so'rovlar.
      Ko'lam (scope) o'zgarishi faqat team lead bilan kelishiladi.
      Relizlar dushanba–payshanba; juma kuni yangi funksiya faqat feature flag ortida, o'chirilgan holda chiqadi.
      "Tayyor" degani: kod + testlar + PR tavsifi (nima, nega, qanday tekshirildi).

  - key: doc_orders_service
    title: "orders-service: holatlar va to'lov"
    content: |
      Buyurtma holatlari (orders.status):
      new → accepted (restoran qabul qildi) → cooking → delivering → delivered.
      Har qanday holatdan → cancelled (hozircha faqat operator panelidan).

      To'lov buyurtma yaratilganda olinadi (payments.charge). Qaytarish — payments.refund (doc: Payments API).
      Holat o'zgarishlari order_events jadvaliga yoziladi (kim, qachon, eski → yangi holat).
      Restoran planshetiga o'zgarishlar order.updated hodisasi orqali boradi.

      Kod tuzilishi: api/orders.py (endpointlar), services/orders.py (biznes mantiq),
      clients/payments.py (Payments API mijozi), tests/.
      Pul — faqat butun so'm (int). DB: PostgreSQL, SQLAlchemy 2.0 async.

  - key: doc_cancel_spec
    title: "Talab: buyurtmani bekor qilish (v1)"
    content: |
      Mijoz ilovada "Bekor qilish" tugmasini bosadi.
      - Holat `new` — mijoz o'zi bekor qila oladi, pul to'liq qaytadi.
      - `accepted` yoki `cooking` — mijoz bekor qila olmaydi, "operator bilan bog'laning" deyiladi.
      - `delivering`, `delivered`, `cancelled` — bekor qilib bo'lmaydi.
      - Sabab ixtiyoriy (ro'yxatdan yoki matn, 200 belgigacha).
      - Pul qaytarish Payments API orqali, mijozga push xabar, restoranga order.updated.
      - Ilova internet uzilib so'rovni qayta yuborsa — ikki marta refund bo'lmasligi kerak.
      - Faqat buyurtma egasi bekor qila oladi.
      Demo: juma, hamkor restoranlar bilan. v2 (keyingi sprint): `accepted` holatda restoran roziligi bilan bekor qilish.

  - key: doc_payments_api
    title: "Payments API: refund"
    content: |
      POST /v1/refunds  {payment_id, amount, reason}
      Sarlavha: Idempotency-Key (ixtiyoriy, 24 soat saqlanadi). Bir xil kalit bilan takroriy so'rov
      birinchi natijani qaytaradi, yangi refund yaratmaydi. Kalitsiz har so'rov — yangi refund.
      Javob: 201 {refund_id, status: pending|succeeded|failed}. Refund odatda 1–3 soniyada succeeded bo'ladi.
      Xatolar: 409 — summa to'langandan ko'p; 5xx yoki timeout — natija noma'lum, xuddi shu kalit bilan qayta urinish xavfsiz.
      Tavsiya etilgan timeout: 5 soniya. Status: GET /v1/refunds/{id}.

  - key: doc_code_review
    title: "Code review qoidalari"
    content: |
      PR tavsifida: muammo, sabab, yechim, qanday tekshirilgan. Review'da tekshiring:
      - to'g'rilik va chegara holatlari; testlar bormi va to'g'ri narsani tekshiradimi;
      - xavfsizlik: avtorizatsiya (kim chaqira oladi), SQL faqat parametr bilan, maxfiy ma'lumot logga tushmaydi;
      - pul: float yo'q, faqat int;
      - poyga holatlari (race condition): bir vaqtda ikki so'rov.
      Izohni hurmat bilan, aniq qator va taklif bilan yozing; "blocker" va "nit"ni ajrating.

  - key: doc_pr_312
    title: "PR #312 (Jahongir): buyurtmalar tarixini filtrlash"
    content: |
      Tavsif: "Mijoz o'z buyurtmalarini status bo'yicha filtrlay oladi. Test qo'shilmadi, kichik o'zgarish."

      ```python
      @router.get("/orders/history")
      async def order_history(status: str, user_id: int, db: AsyncSession = Depends(get_db)):
          query = f"SELECT * FROM orders WHERE user_id = {user_id} AND status = '{status}'"
          rows = (await db.execute(text(query))).all()
          total = sum(float(r.total) for r in rows)
          return {"orders": [dict(r._mapping) for r in rows], "total_spent": total}
      ```

  - key: doc_incident_runbook
    title: "Prod incident runbook"
    content: |
      1. #incidents kanalida e'lon: nima buzildi, qachondan, ta'sir (raqamlarda), SEV darajasi.
         SEV-1 — pul yoki asosiy oqim (buyurtma/to'lov) zarar ko'rmoqda. SEV-2 — qisman, aylanma yo'l bor.
      2. Avval ta'sirni to'xtating: feature flag'ni o'chiring yoki rollback. Sababni keyin qidiring.
      3. Har 30 daqiqada holat yangilanishi.
      4. Pul bilan bog'liq bo'lsa — moliya bo'limiga xabar, ta'sirlangan operatsiyalar ro'yxati.
      5. Postmortem 2 ish kuni ichida (shablon bo'yicha), aybdor qidirilmaydi.
      Taqiqlanadi: prod DB'ga qo'lda o'zgartirish, testsiz "tezkor fix".

  - key: doc_incident_logs_dup
    title: "Monitoring: refund'lar, bugun 09:00–10:00"
    content: |
      Kecha 16:00 da cancel_orders_enabled flag'i 100% mijozga yoqilgan.
      09:12  Moliya: 14 ta buyurtma uchun ikki marta refund (jami 1 960 000 so'm ortiqcha qaytarilgan).
      09:20  Loglar: bir xil order_id uchun 2 ta POST /v1/refunds, oraliq 80–300 ms, Idempotency-Key yo'q.
      09:25  14 holatning 11 tasida mijoz ilovada tugmani ikki marta bosgan, 3 tasida mobil tarmoq qayta yuborgan.
      09:40  Ortiqcha refund'lar davom etmoqda: soatiga ~6 ta.

  - key: doc_incident_logs_timeout
    title: "Monitoring: cancel endpoint, bugun 09:00–10:00"
    content: |
      Kecha 16:00 da cancel_orders_enabled flag'i 100% mijozga yoqilgan.
      09:05  Payments API provayderi status sahifasi: "refund'lar sekinlashgan, tekshirilmoqda".
      09:15  POST /orders/{id}/cancel p95 = 31 s (oldin 1.2 s), 22% so'rov timeout bilan tugayapti.
      09:20  Mijozlar ilovada "bekor qilinmadi" ko'rib, operatorga qo'ng'iroq qilmoqda (soatiga ~40).
      09:30  Refund'larning o'zi oxir-oqibat o'tmoqda (dublikat yo'q). Buyurtma berish oqimi normal.
      Payments mijozida timeout sozlanmagan (default 60 s).

  - key: doc_postmortem_template
    title: "Postmortem shabloni"
    content: |
      1. Qisqacha: nima bo'ldi, qancha davom etdi, ta'sir (mijozlar, pul).
      2. Vaqt chizig'i: aniqlandi → e'lon → ta'sir to'xtatildi → tuzatildi.
      3. Asosiy sabab (5 ta "nega"), aybdor emas — jarayon va tizim.
      4. Nima yaxshi ishladi / nima ishlamadi.
      5. Choralar: har biri — egasi va muddati bilan; oldini olish va tezroq aniqlash.

