  - id: implement_cancel
    type: task
    day: 3
    at: "09:30"
    from: sardor
    brief: |
      Dizayn bo'yicha bekor qilishni yozing: servis funksiyasi, endpoint va testlar (Malika rejasidagi
      asosiy holatlar). Kod yoki PR havolasi + qisqa izoh yuboring.
    attachments: [doc_orders_service, doc_payments_api, doc_code_review]
    answer_types: [code, link, text]
    due_in_minutes: 240
    weight: 3
    competencies: [technical]
    rubric:
      - {id: correctness, description: "Holatlar talabga mos, egasi tekshiriladi, sabab ≤200 belgi", weight: 2}
      - {id: concurrency, description: "Buyurtma qatori qulflanadi (FOR UPDATE yoki shartli UPDATE ... WHERE status='new'), poyga yo'q", weight: 2}
      - {id: idempotency, description: "Refund barqaror Idempotency-Key bilan (order_id asosida), takroriy so'rov ikkinchi refund qilmaydi", weight: 2.5}
      - {id: failure, description: "Payments timeout sozlangan, xatoda refund pending saqlanadi, qayta urinish mumkin", weight: 1.5}
      - {id: tests, description: "Testlar: new, 409 holatlar, takroriy so'rov, begona foydalanuvchi", weight: 1.5}
    hints:
      - "Ikki so'rov bir vaqtda kelsa, ikkalasi ham status='new' ni o'qib qolmasligi uchun nima qilish kerak?"
      - "Idempotency-Key tasodifiy UUID bo'lsa, ikkinchi bosishda nima bo'ladi? Kalit nimaga bog'liq bo'lishi kerak?"
      - "Avval ikki marta chaqiruv testini yozing va refund mijozi necha marta chaqirilganini tekshiring."
    reference_answer: |
      async def cancel_order(db, order_id, user, reason):
          order = await db.scalar(select(Order).where(Order.id == order_id, Order.user_id == user.id).with_for_update())
          if order is None: raise NotFound
          if order.status == "cancelled": return order
          if order.status in ("accepted", "cooking"): raise Conflict("contact_operator")
          if order.status != "new": raise Conflict("not_cancellable")
          order.status = "cancelled"; order.refund_status = "pending"; add order_event; await db.commit()
          await payments.refund(order.payment_id, order.total, idempotency_key=f"cancel:{order.id}", timeout=5)
      Xatoda refund_status pending qoladi va fon job shu kalit bilan qayta urinadi. Testlar: new, 409, ikki chaqiruv → bitta refund, begona → 404.

