      - "Idempotency-Key'ni nimadan yasash kerakki, ikkinchi bosish ham aynan o'sha kalitni bersin?"
    reference_answer: |
      POST /api/v1/orders/{id}/cancel {reason?}. Egasi emas → 404. SELECT ... FOR UPDATE; new → cancelled, order_events,
      refund_status=pending, commit; keyin Payments POST /v1/refunds Idempotency-Key="cancel:{order_id}", timeout 5 s.
      accepted/cooking → 409 contact_operator; boshqalar → 409 not_cancellable; allaqachon cancelled → 200 oldingi natija.
      Timeout/5xx → refund_status=pending qoladi, fon job xuddi shu kalit bilan qayta urinadi; push va order.updated.

