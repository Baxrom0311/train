    hints: ["Talabdagi har jumladan kamida bitta test chiqarib ko'ring; keyin 'nima noto'g'ri ketishi mumkin' deb qo'shing."]
    reference_answer: |
      1) new → 200, cancelled, refund bir marta, push. 2) accepted → 409 contact_operator. 3) cooking → 409. 4) delivering/delivered → 409.
      5) cancelled qayta → 200, ikkinchi refund yo'q. 6) ikki marta tez bosish → bitta refund. 7) begona user → 404.
      8) sabab 201 belgi → 422. 9) Payments timeout → cancelled, refund pending, keyin qayta urinish. 10) restoran bir vaqtda accept → bittasi yutadi.

