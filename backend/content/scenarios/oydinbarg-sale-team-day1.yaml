# o'ylab topilgan. Brendbuk, aksiya shartlari, "eski narx" qoidasi, reklama va inqiroz tartibi — o'quv maqsadidagi
# ichki siyosat, real qonunchilik yoki normativ emas. Reklama kanallari umumiy nomlar bilan yozilgan.
