      kutilgan klik va buyurtma, CAC; jami CAC. Qoidaga to'g'ri kelmaydigan kanal bo'yicha qaror. So'ng sarfni soatlarga
      bo'ling (14:00, 18:00, 21:00 va 24:00 gacha jami qancha) va kabinetga qanday limit qo'yasiz — yozing.
    attachments: [doc_ads_benchmarks, doc_sale_history]
    answer_types: [text, file]
    due_in_minutes: 120
    weight: 2
    competencies: [technical, prioritization]
    rubric:
      - {id: caps, description: "Cheklovlar to'g'ri: retargeting 40 000 × 2 = 80 000 ko'rsatish → 2.0 mln, 2 000 klik, 140 buyurtma; qidiruv 3 000 × 1 000 = 3.0 mln, 120; messenjer 3 × 1.2 = 3.6 mln, 2 400 klik, 84", weight: 2}
      - {id: cac, description: "CAC: retargeting ≈ 14 290, qidiruv 25 000, messenjer ≈ 42 860, qisqa video 1 500 / 2.2% ≈ 68 180 — qoidadan (60 000) yuqori", weight: 2}
      - {id: decision, description: "Qisqa video to'liq 3.4 mln olmaydi: o'chiriladi yoki ≤ 1 mln test; asosiy uch kanal 8.6 mln, 344 buyurtma, CAC 25 000 ≤ 35 000; qolgan pul zaxira", weight: 2}
      - {id: pacing, description: "Soatlik bo'linish buyurtma egri chizig'iga mos: 8.6 mln uchun 14:00 gacha ≈ 3.01, 18:00 — 5.33, 21:00 — 7.31, 24:00 — 8.6 mln (yoki test bilan mutanosib); har kanalga limit", weight: 1.5}
      - {id: setup, description: "Kabinet: optimizatsiya — xarid, promokodli kreativlar ro'yxati, limitlar; kreativ va aksiya shartini kontent bilan kelishish aytilgan"}
    hints:
      - "Retargeting budjeti auditoriya, chastota va CPM'dan chiqadi; messenjer — joylar sonidan."
      - "Har kanal CAC'ini aksiya qoidasidagi chegara bilan solishtiring. Qolgan pul albatta sarflanishi kerakmi?"
      - "Kun bo'yi sarfni buyurtmalarning to'planish ulushlari bilan bo'ling — odamlar kelmaydigan soatda pul sarflamang."
    reference_answer: |
      Retargeting: 40 000 × 2 = 80 000 ko'rsatish × 25 000/1000 = 2.0 mln; 2 000 klik × 7% = 140 buyurtma; CAC ≈ 14 290.
      Qidiruv: 3 000 klik × 1 000 = 3.0 mln; 120 buyurtma; CAC 25 000.
      Messenjer: 3 × 1.2 = 3.6 mln; 2 400 klik × 3.5% = 84; CAC ≈ 42 860.
      Qisqa video: CAC 1 500 / 0.022 ≈ 68 180 > 60 000 — qoidaga zid. Qolgan 3.4 mln bilan ≈ 50 buyurtma, foyda kam va ko'pi baribir kelardi.
      Qaror: qisqa video — 1 mln lik test (≈ 15 buyurtma), 18:00 da CAC qoidadan yuqori bo'lsa o'chadi; 2.4 mln zaxira.
      Jami asosiy: 8.6 mln, 344 buyurtma, CAC 25 000 (test bilan 9.6 mln, ≈ 359, CAC ≈ 26 770).
