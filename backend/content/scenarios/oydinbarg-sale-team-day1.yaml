      - {id: handoff, description: "Jamoa uchun qisqa xulosa: kontentga zaxira raqamlari, performance'ga kech soatlarda qaysi mahsulot reklamasini kamaytirish"}
    hints:
      - "Chegirma ro'yxat narxidan olinadi, o'zgaruvchan xarajat esa ro'yxat narxining 42% i — bitta buyurtmadan foydani shu ikkisidan toping."
      - "Har mahsulot uchun talab = buyurtmalar × har 100 buyurtmadagi dona / 100. Zaxira talabning necha foizi?"
      - "Zaxira foizini kun bo'yi to'planish jadvaliga qo'ying va ikki soat oralig'ida chiziqli bo'ling."
    reference_answer: |
      Buyurtma: 1 400 × 1.15 = 1 610. Savat: 260 000 → 195 000 (−25%). Daromad 1 610 × 195 000 ≈ 313.95 mln.
      Xarajat 260 000 × 42% = 109 200; foyda 85 800/buyurtma; yalpi foyda ≈ 138.14 mln; 12 mln reklamadan keyin ≈ 126.14 mln.
      Oddiy kun: 180 × 230 000 × 58% ≈ 24.01 mln. Aksiya oddiy kundan foydali bo'lishi uchun: (24.01 + 12) / 0.0858 ≈ 420 buyurtma.
      Zaxira: «Qishki qalqon» 1 610 × 0.60 ≈ 966 > 900 (≈ 66 kam) — 900/966 ≈ 93.2% → ≈ 22:40;
      «Anor» balzami 1 610 × 0.30 ≈ 483 > 400 (≈ 83 kam) — 82.8% → 18:00 + (82.8 − 62)/(85 − 62) × 3 soat ≈ 20:40;
      «Bodom va shi» ≈ 1 369 < 2 500 — yetadi.
      Jamoaga: kontent — balzam 20:00–21:00, qalqon 22:00–23:00 atrofida tugashi mumkin, halol ogohlantirish; performance — 20:00 dan
      keyin balzamli kreativlarni o'chirish, qalqon reklamasini 21:00 dan kamaytirish.

