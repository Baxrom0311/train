  - id: incident_impact
    type: incident
    role: analyst
    day: 1
    at: "15:30"
    from: dilnoza
    brief: |
      OYDIN25 xatosi bo'yicha raqamlar kerak: xato bilan qancha buyurtma o'tdi, ortiqcha berilgan chegirma qancha,
      bu buyurtmalar zarardami, kod o'chirilgandan beri qancha savat yo'qotildi. Kun prognoziga ta'sirini ham yozing.
      Raqamlarni jamoadoshlaringizga yuboring — kontent ochiq javob yozadi.
    attachments: [doc_incident_promo, doc_sale_terms]
    answer_types: [text]
    due_in_minutes: 30
    weight: 1.5
    competencies: [technical, stress_handling]
    rubric:
      - {id: leakage, description: "Ortiqcha chegirma: to'plam 148 × 58 600 = 8 672 800; kichik savat 60 × 30 000 = 1 800 000; jami 10 472 800 so'm (±1%)", weight: 2}
      - {id: margin, description: "Zarar emas: to'plam 175 800 − 121 100 = 54 700 foyda, kichik savat 90 000 − 50 400 = 39 600 — boy berilgan foyda; xatoli buyurtmalar 208/610 ≈ 34%", weight: 1.5}
      - {id: abandoned, description: "O'chirilgandan beri 140 savat × 195 000 ≈ 27.3 mln so'm daromad xavf ostida — kodni tez to'g'ri yoqish xatoli chegirmadan muhimroq", weight: 1.5}
      - {id: context, description: "Kun prognoziga ta'sir: ≈ 10.5 mln / 138.1 mln ≈ 7.6% yalpi foyda; berilgan buyurtmalar bajariladi"}
    hints:
      - "Ikki xil xato — ikki xil ortiqcha chegirma. Har birini alohida hisoblang."
      - "Xatoli buyurtma zarar keltiryaptimi? Chegirmali narxni o'zgaruvchan xarajat bilan solishtiring."
    reference_answer: |
      Xatoli buyurtmalar: 148 + 60 = 208 (610 dan ≈ 34%).
      To'plam: 234 400 × 25% = 58 600 ortiqcha; 148 × 58 600 = 8 672 800. Kichik savat: 120 000 × 25% = 30 000; 60 × 30 000 = 1 800 000.
      Jami ortiqcha chegirma ≈ 10 472 800 so'm. Zarar emas: to'plam 175 800 − 121 100 = 54 700, kichik savat 90 000 − 50 400 = 39 600
      foyda — boy berilgan foyda. Kod o'chirilgach: 140 savat × 195 000 ≈ 27.3 mln daromad xavf ostida — kodni to'g'ri qoida bilan
      darhol qaytarish kerak. Kun prognozi yalpi foydasining (≈ 138.1 mln) ≈ 7.6% i. Berilgan buyurtmalar bajariladi (qoida 6).

