documents:
  - key: doc_team_charter
    title: "«Oydinbarg kuni» jamoasi: kim nima qiladi"
    content: |
      «Oydinbarg kuni» — yillik bir kunlik aksiya: bugun 10:00 dan 23:59 gacha saytda va botda OYDIN25 promokodi.
      Jamoa: performance marketolog (reklama budjeti, soatlik limitlar, kreativlar holati), kontent menejer (e'lonlar,
      saytdagi va kanallardagi matnlar, izohlarga javob), marketing analitik (prognoz, zaxira, natija va ta'sir hisobi).
      Aksiya egasi — Dilnoza; promokod va sayt sozlamalari — Bobur (veb-do'kon).

      Kelishuvlar:
      - Standup jamoaga bitta: kim nima qiladi, kim kimdan nima kutadi, nima to'sib turibdi.
      - Raqamlar faqat analitikdan: mijozga yoki rahbarga raqam yozishdan oldin analitik bilan tekshiring.
      - Mijozga ketadigan har qanday matnni kontent menejer yozadi; aksiya sharti va reklama holatini performance tasdiqlaydi.
      - Reklamani to'xtatish/yoqish — performance; promokodni sozlash — Bobur, performance bilan birga tekshiriladi.
      - 16:00 da jamoa qisqa holat yozadi; kun oxirida bitta umumiy hisobot.

  - key: doc_sale_terms
    title: "Aksiya shartlari va assortiment"
    content: |
      OYDIN25 — 25% chegirma, buyurtma summasi (chegirmagacha) ≥ 200 000 so'm bo'lsa. To'plamlar bilan qo'shilmaydi
      (to'plam narxi allaqachon −20%). Muddat: bugun 10:00–23:59. Bir buyurtmaga bitta promokod.
      Mahsulot | Narx, so'm | O'zgaruvchan xarajat, so'm | Ombordagi zaxira, dona
      «Qishki qalqon» yuz kremi 50 ml | 149 000 | 59 600 | 900
      «Bodom va shi» qo'l kremi 75 ml | 99 000 | 49 500 | 2 500
      «Anor» lab balzami | 45 000 | 12 000 | 400
      «Qish to'plami» (3 mahsulot) | 293 000 → to'plam narxi 234 400 | 121 100 | 600
      Bitta mahsulot 200 000 so'mga yetmaydi — OYDIN25 ikki va undan ko'p mahsulotli savatda ishlaydi.
      Saytdagi "eski narx" (chizilgan narx) — oxirgi 30 kundagi haqiqiy sotuv narxi bo'lishi shart (ichki qoida).

  - key: doc_brand_rules
    title: "Brendbuk: aksiya matnlari uchun qisqa qoidalar"
    content: |
      Ovoz: samimiy, xotirjam, "siz" murojaati. Taqiqlangan: "davolaydi", "100%", "mo'jiza", "eng zo'r", "kafolatlangan",
      kasallik nomlari, raqobatchi nomi. Aksiya: chegirma foizi, minimal summa, istisnolar va muddat bitta joyda yoziladi.
      Zaxira haqida faqat haqiqiy raqam yoki halol taxmin ("kechqurungacha tugashi mumkin"); soxta shoshiltirish
      ("faqat 3 ta qoldi" — rost bo'lmasa) va soxta "eski narx" taqiqlanadi.
      Format: lenta posti ≤ 120 so'z, 1 CTA, ≤ 2 emoji, ≤ 3 xeshteg, #oydinbarg; messenjer posti ≤ 3 xatboshi, havola yoki
      bot buyrug'i bilan tugaydi; SMS ≤ 160 belgi, faqat SMS roziligi bor 4 200 mijozga, "STOP" bilan obunadan chiqish.

  - key: doc_sale_history
    title: "O'tgan yilgi «Oydinbarg kuni» va oddiy kun ko'rsatkichlari"
    content: |
      O'tgan yil: 1 400 buyurtma (aksiya 10:00–24:00). Bu yil kutilayotgan o'sish: +15% (obunachilar va bot foydalanuvchilari).
      O'rtacha savat (chegirmagacha): 260 000 so'm. O'zgaruvchan xarajat — o'rtacha savat narxining 42% i (ro'yxat narxidan).
      Oddiy kun: 180 buyurtma, o'rtacha savat 230 000 so'm, chegirmasiz, reklamasiz hisobda.
      Buyurtmalarning kun bo'yi to'planishi (o'tgan yil, jami ulush):
      soat | 14:00 gacha | 18:00 gacha | 21:00 gacha | 24:00 gacha
      ulush | 35% | 62% | 85% | 100%
      Har 100 buyurtmada sotilgan dona (o'tgan oy savati): «Qishki qalqon» 60, «Bodom va shi» 85, «Anor» balzami 30.
      Taxmin: soatlar oralig'ida buyurtmalar bir tekis keladi.

  - key: doc_ads_benchmarks
    title: "Aksiya kuni reklama: benchmark, cheklov va qoidalar"
    content: |
      Kunlik budjet: 12 000 000 so'm. Ichki qoida: aksiya kuni kanal CAC ≤ 60 000 so'm (aksiyada xaridlarning bir qismi
      reklamasiz ham kelardi, shuning uchun qimmat kanal foyda bermaydi); jamoaviy maqsad — umumiy CAC ≤ 35 000.
      Kanal | Narx modeli | CPC / narx | CR (klik → buyurtma) | Cheklov
      Retargeting | CPM 25 000 so'm | CTR 2.5% | 7.0% | auditoriya 40 000, kuniga chastota ≤ 2
      Qidiruv (kontekstli) reklama | klik, 1 000 so'm | — | 4.0% | kuniga ≈ 3 000 klik
      Messenjer kanallarida post | 1 200 000 so'm/post, ≈ 1 500 so'm/klik | — | 3.5% | 3 ta joy bor
      Qisqa video reklama | klik, 1 500 so'm | — | 2.2% | cheklov yo'q
      Kabinetda har kanalga soatlik yoki kunlik limit qo'yiladi; optimizatsiya maqsadi — xarid.
      Promokod ko'rsatilgan kreativlar: retargeting, qisqa video va messenjer postlari.

  - key: doc_crisis_policy
    title: "Ijtimoiy tarmoqlarda xato va inqiroz: tartib"
    content: |
      1. Xato yoki tarqalayotgan salbiy postga 30 daqiqa ichida birinchi ochiq javob.
      2. Xato jim o'chirilmaydi; tuzatish ochiq e'lon qilinadi.
      3. Salbiy izohlar o'chirilmaydi (faqat haqorat, spam yoki shaxsiy ma'lumot yashiriladi).
      4. Ohang: uzr, nima bo'lgani, nima qilinyapti, mijoz uchun keyingi qadam. Ayblovsiz, bahssiz.
      5. Kompensatsiya, narx va muddat bo'yicha qarorni marketing rahbari qabul qiladi; matnda unga zid va'da yo'q.
      6. Allaqachon berilgan buyurtmalar e'lon qilingan shartda bajariladi (xato mijoz foydasiga bo'lsa ham).
      7. Ichki: xatoga oid reklama to'xtatiladi, sotuv va call-markazga xabar, sabab va qayta bo'lmasligi uchun chora.

  - key: doc_incident_promo
    title: "Veb-do'kon: OYDIN25 bo'yicha xabar (15:00–15:25)"
    content: |
      15:00  Bobur: OYDIN25 qoidasida xato topildi — 10:00 dan beri kod to'plamlarga ham ishlayapti va 200 000 minimal
             summa tekshirilmayapti.
      10:00–15:00 OYDIN25 bilan buyurtmalar: 610 ta
               to'g'ri (≥ 200 000, to'plamsiz): 402
               to'plam + OYDIN25: 148 (to'plam narxi 234 400 → 175 800 so'm)
               200 000 dan kam savat: 60 (o'rtacha savat chegirmagacha 120 000 so'm)
      15:10  Bobur "xavfsizlik uchun" OYDIN25 ni butunlay o'chirdi — endi hamma uchun "Promokod yaroqsiz".
      15:10–15:25  OYDIN25 kiritib, xato ko'rib tashlab ketilgan savatlar: 140 (o'rtacha chegirmali summa 195 000 so'm).
      15:25  Mashhur foydalanuvchining posti: "Oydinbarg aldadi: reklama 25% deydi, kod ishlamaydi!" — 2 300 ulashish,
             izohlar ko'paymoqda.
      Reklama: promokodli kreativlar hozir ham ishlayapti (14:00–18:00 rejasi bo'yicha soatiga ≈ 580 000 so'm).
      Dilnoza qarori: berilgan buyurtmalar bajariladi; kod to'g'ri qoida bilan imkon qadar tez qayta yoqiladi;
      uzilish uchun aksiya 00:59 gacha uzaytiriladi.

