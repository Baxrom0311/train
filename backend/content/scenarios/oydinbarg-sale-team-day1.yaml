      Kabinet: maqsad — xarid; har kanalga kunlik limit va 14/18/21 da tekshiruv; promokodli kreativlar: retargeting, messenjer,
      qisqa video — aksiya shartini (min 200 000, to'plamsiz) kontent bilan bir xil yozamiz.

