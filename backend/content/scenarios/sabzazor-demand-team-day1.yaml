documents:
  - key: doc_team_charter
    title: "Buyurtma kuni jamoasi: kim nima qiladi"
    content: |
      Sabzazor — Toshkentdagi 12 ta do'kondan iborat oziq-ovqat tarmog'i. Har payshanba do'konlar keyingi hafta uchun
      tez buziladigan mahsulotlarni markaziy omborga buyurtma qiladi; ombor buyurtmani 17:00 gacha qabul qiladi,
      yetkazish dushanba ertalab. Bugun (08.10) pilot: Chilonzor (CHL), Yunusobod (YUN), Sergeli (SRG) uchun
      "Sut 2.5% 1 L" (SKU 40112) buyurtmasi birinchi marta prognoz asosida, yangi "Buyurtma tavsiyasi" dashboard'i orqali beriladi.

      Jamoa:
      - Data engineer — POS savdo oqimi (raw.pos_lines → mart.daily_sales), tozalash va yuklash. Texnik egasi — Sherzod.
      - Data analyst — prognoz va buyurtma miqdori; incident'da ta'sir hisobi.
      - BI analitik — dashboard, prognoz aniqligi, do'kon rahbarlariga xabarlar.
      Buyurtmachi — Gulnora (ta'minot). Bo'lim rahbari — Madina.

      Kelishuvlar:
      - Ertalabki standup jamoaga bitta: kim nima qiladi, kim kimni kutadi, nima to'sib turibdi.
      - Raqamlar (prognoz, quti soni, ta'sir) — faqat analystdan; boshqa rol raqam yozishdan oldin analyst bilan tekshiradi.
      - Ma'lumot tozaligi va yuklash — engineer; "bu qator dublikatmi?" degan savolga u javob beradi.
      - Do'konlarga matn — BI yozadi, raqamlarini analyst tasdiqlaydi.
      - Kun oxirida jamoa bitta umumiy hisobot yozadi.

  - key: doc_pos_feed
    title: "POS savdo oqimi: raw.pos_lines tavsifi"
    content: |
      Har chek qatori bitta yozuv. Ustunlar:
      ustun | turi | izoh
      store_id | text | Do'kon kodi (CHL, YUN, SRG, ...).
      receipt_id | text | Chek raqami — faqat do'kon ichida unikal (boshqa do'konda xuddi shu raqam bo'lishi mumkin).
      line_no | int | Chekdagi qator raqami.
      sku | text | Mahsulot kodi. Bo'sh bo'lsa — buzilgan qator.
      qty | int | Dona, doim musbat. 0 yoki manfiy — kassa test qatori, hisobga olinmaydi.
      ts_utc | text | "YYYY-MM-DD HH:MM", UTC. Hisobot kuni — Toshkent sanasi (UTC + 5 soat).
      kind | text | sale — sotuv; return — qaytarish (qty musbat, sotuvdan ayiriladi).

      Muhim: aloqa uzilsa, kassa butun paketni qayta yuboradi — bir xil (store_id, receipt_id, line_no) qatorlari
      ikki-uch marta keladi. Bunday qator bir marta hisoblanadi.
      Mart: mart.daily_sales (store_id, day, sku) → sof sotuv (sotuv − qaytarish), dona.

  - key: doc_loader_code
    title: "Hozirgi loader: daily_sales (DE-57 ticket)"
    content: |
      DE-57: "SRG sut sotuvi 28.09–04.10 haftasida ikki baravar ko'p, YUN'da kechqurungi savdo ertangi kunga o'tmayapti."

      ```python
      def daily_sales(rows):
          out = {}
          for r in rows:
              day = r["ts_utc"][:10]
              k = (r["store_id"], day, r["sku"])
              out[k] = out.get(k, 0) + r["qty"]
          return out
      ```

      Testlar yo'q. Yangi funksiya nomi: clean_sales(rows) -> dict[(store_id, "YYYY-MM-DD", sku), int].

  - key: doc_sales_history
    title: "Sut 2.5% 1 L (SKU 40112): haftalik sof sotuv va qoldiq"
    content: |
      Hafta sotuvi, dona (mart.daily_sales, Toshkent sanasi bo'yicha):
      do'kon | 07–13.09 | 14–20.09 | 21–27.09 (aksiya −20%) | 28.09–04.10
      CHL | 840 | 860 | 1 150 | 830
      YUN | 610 | 590 | 820 | 620
      SRG | 450 | 470 | 610 | 880 ⚠

      ⚠ SRG 28.09–04.10: POS paketlari qayta yuborilgan (DE-57). Sherzod qo'lda tekshirdi: dublikatsiz sof sotuv — 440 dona.

      Dushanba (12.10) ertalabga kutilgan qoldiq (dashboard, 14:30 holati): CHL 96, YUN 60, SRG 30 dona.
      Keyingi hafta (12–18.10) aksiya rejada yo'q.

  - key: doc_forecast_policy
    title: "Tez buziladigan mahsulotlar: prognoz va buyurtma qoidasi (ichki qoida)"
    content: |
      1. Prognoz = oxirgi 4 ta to'liq haftaning o'rtachasi; aksiya haftalari chiqariladi (qolganlari o'rtachasi).
         Keyingi haftada aksiya bo'lsa — marketing koeffitsienti alohida beriladi.
      2. Xavfsizlik zaxirasi = prognozning 15% i (sut, saqlash muddati 7 kun).
      3. Buyurtma = prognoz + zaxira − dushanba kutilgan qoldiq; yuqoriga, butun qutiga yaxlitlanadi (1 quti = 12 dona).
      4. Tannarx: 9 800 so'm/dona. Muddati o'tgan sut hisobdan chiqariladi (to'liq zarar).
      5. Qoidadan chetga chiqish (qo'lda ko'paytirish/kamaytirish) — faqat sababi yozilgan holda, ta'minot va analitika
         rahbari roziligi bilan; dashboard'da "qo'lda o'zgartirilgan" belgisi bilan.

  - key: doc_forecast_accuracy
    title: "O'tgan hafta prognozi va dashboard talablari"
    content: |
      Sut 2.5% 1 L, 28.09–04.10 haftasi uchun tajriba prognozi va haqiqiy sotuv, dona:
      do'kon | prognoz | haqiqiy (mart.daily_sales)
      CHL | 850 | 830
      YUN | 640 | 620
      SRG | 455 | 880 ⚠ (tozalangani 440)

      Aniqlik metrikasi (ichki standart): WAPE = Σ|haqiqiy − prognoz| / Σ haqiqiy, foizda, 1 xona aniqlikda.
      Maqsad: WAPE ≤ 10%.

      Gulnora va do'kon rahbarlarining talablari:
      - Har do'kon rahbari faqat o'z do'konini ko'radi; tarmoq bo'yicha — ta'minot va analitika.
      - Asosiy raqam: "nechta quti buyurtma qilish kerak", yonida prognoz, zaxira, kutilgan qoldiq.
      - Ma'lumot qachon yangilangani ko'rinsin (ETL har kuni 06:00 da; kechiksa — ogohlantirish).
      - Telefon orqali ochiladi; buyurtmani qo'lda o'zgartirsa — sababi yoziladi.

  - key: doc_data_runbook
    title: "Ma'lumot incident'i runbook'i"
    content: |
      1. Noto'g'ri raqam qarorga ketayotgan bo'lsa — avval tarqalishini to'xtating: dashboard'ga banner, eksportni pauza.
      2. Ta'sir doirasi: qaysi jadval, do'kon, sana, qaysi hisobot va qarorlar ta'sirlangan — raqamlarda.
      3. Tuzatish: qo'lda UPDATE emas — qayta ishga tushirsa bir xil natija beradigan (idempotent) jarayon orqali.
      4. Foydalanuvchilarga xabar BI orqali: nima bo'ldi, nima qilish kerak, qachon tuzatiladi.
      5. Postmortem 2 ish kuni ichida, aybdor qidirilmaydi.

  - key: doc_incident_dup
    title: "Monitoring: 08.10, 14:50–15:25"
    content: |
      14:50  reload_pos_day --date 2026-10-07 --stores CHL,YUN (kechikib kelgan fayllar uchun qayta yuklash, load_day.sql)
      15:05  raw.pos_lines, 07.10: CHL 18 420 qator (kutilgan 9 210), YUN 14 060 (kutilgan 7 030), SRG 6 100 (normal)
      15:10  mart.daily_sales va "Buyurtma tavsiyasi" yangilandi (load_day clean_sales'ni chetlab o'tadi)
      15:20  Sut 2.5% 1 L, 07.10 sotuvi: CHL 248 (odatda ~124), YUN 176 (~88)
             Dushanba kutilgan qoldiq: CHL 0 (14:30 da 96), YUN 0 (14:30 da 60) — qoldiq = kirim − sotuv
             Tavsiya: CHL 81 quti (14:30 da 73), YUN 59 quti (14:30 da 54). SRG o'zgarmagan.
      15:25  Ikki do'kon rahbari buyurtmani dashboard'dan omborga yuborishni so'ramoqda. Ombor muddati — 17:00.
      Boshqa tez buziladigan SKU'lar (qatiq, kefir, non) ham CHL va YUN'da xuddi shunday ta'sirlangan.

