  - id: incident_pipeline
    type: incident
    role: engineer
    day: 1
    at: "15:30"
    from: sherzod
    brief: |
      SHOSHILINCH: 14:50 dagi qayta yuklashdan keyin CHL va YUN 07.10 qatorlari ikki baravar. Loglar ilovada.
      Yozing: 1) hozir nima qilasiz (17:00 gacha), 2) dublikatlarni qanday aniqlaysiz va tozalaysiz (SQL),
      3) qayta yuklash bundan keyin xavfsiz bo'lishi uchun doimiy tuzatish.
    attachments: [doc_incident_dup, doc_data_runbook, doc_pos_feed]
    answer_types: [text, code]
    due_in_minutes: 30
    weight: 1.5
    competencies: [stress_handling, technical]
    rubric:
      - {id: contain, description: "Avval tarqalishni to'xtatish: buyurtma eksporti/dashboard pauza yoki banner, BI va analyst'ga xabar", weight: 2}
      - {id: detect, description: "Aniqlash: GROUP BY store_id, receipt_id, line_no HAVING COUNT(*) > 1; 07.10 CHL 9 210 + YUN 7 030 = 16 240 ortiqcha qator", weight: 1.5}
      - {id: fix, description: "Tozalash qo'lda UPDATE emas: 07.10 CHL/YUN qatorlarini tranzaksiyada o'chirib bir marta qayta yuklash yoki ROW_NUMBER bilan dublikatlarni o'chirish, keyin mart qayta hisoblanadi", weight: 1.5}
      - {id: permanent, description: "Doimiy: UNIQUE (store_id, receipt_id, line_no) + ON CONFLICT DO NOTHING yoki DELETE+INSERT; load_day ham clean_sales orqali; qator soni tekshiruvi"}
    hints:
      - "Runbook'ning 1-bandi: ombor muddatigacha birinchi navbatda nimani to'xtatish kerak?"
      - "Qayta yuklashni ikki marta ishga tushirsangiz ham natija bir xil bo'lishi uchun nima kerak?"
    reference_answer: |
      1) Darhol: "Buyurtma tavsiyasi"da CHL va YUN uchun banner va omborga eksportni pauza; BI va analyst'ga jamoa chatida xabar.
      2) Aniqlash:
         SELECT store_id, receipt_id, line_no, COUNT(*) FROM raw.pos_lines
         WHERE (ts_utc::timestamp + INTERVAL '5 hours')::date = '2026-10-07' AND store_id IN ('CHL','YUN')
         GROUP BY 1, 2, 3 HAVING COUNT(*) > 1;
         Ortiqcha: CHL 18 420 − 9 210 = 9 210, YUN 14 060 − 7 030 = 7 030, jami 16 240 qator.
      Tozalash: bitta tranzaksiyada 07.10 CHL/YUN qatorlarini o'chirib, fayldan bir marta qayta yuklash (yoki ROW_NUMBER() > 1 larini
      o'chirish), keyin mart.daily_sales va tavsiyani qayta hisoblash; 07.10 qator sonlari 9 210 / 7 030 ekanini tekshirish.
      3) Doimiy: UNIQUE (store_id, receipt_id, line_no) + INSERT ... ON CONFLICT DO NOTHING; load_day ham clean_sales'dan o'tadi;
      yuklashdan keyin kunlik qator soni 7 kunlik o'rtachadan 1.5× oshsa — mart yangilanmaydi. Postmortem 2 kun ichida.

  - id: incident_impact
    type: incident
    role: analyst
    day: 1
    at: "15:30"
    from: gulnora
    brief: |
      Dashboard'da CHL va YUN buyurtmasi to'satdan oshdi, do'konlar yuborishni so'rayapti! Sut bo'yicha ayting:
      qaysi raqam to'g'ri, dublikat qancha ortiqcha buyurtmaga olib kelardi (quti, dona, so'm) va nega. Raqamlarni
      jamoadoshlaringizga ham yuboring — BI do'konlarga yozadi.
    attachments: [doc_incident_dup, doc_forecast_policy]
    answer_types: [text]
    due_in_minutes: 30
    weight: 1.5
    competencies: [technical, stress_handling]
    rubric:
      - {id: mechanism, description: "Mexanizm: 07.10 sotuvi ikki baravar (CHL +124, YUN +88) → qoldiq = kirim − sotuv kamaygan, 0 ga tushgan → buyurtma oshgan", weight: 1.5}
      - {id: numbers, description: "To'g'ri: CHL 73 quti, YUN 54 quti; dublikat bilan 81 va 59 — ortiqcha 8 + 5 = 13 quti = 156 dona", weight: 2}
      - {id: money, description: "Ortiqcha summa: 156 × 9 800 = 1 528 800 so'm; SRG o'zgarmagan (41 quti); boshqa tez buziladigan SKU'lar ham tekshiriladi", weight: 1.5}
    hints:
      - "Prognoz o'tgan haftalardan hisoblanadi — u o'zgardimi? Unda formulaning qaysi qismi o'zgargan?"
      - "Qoldiq 0 bo'lganda CHL uchun 'kerak' miqdorini qayta hisoblang va qutiga yaxlitlang."
    reference_answer: |
      Prognoz o'zgarmagan (to'liq haftalar asosida), o'zgargan qism — dushanba kutilgan qoldiq: qoldiq = kirim − sotuv, 07.10 sotuvi
      ikki baravar (CHL 248 vs 124, YUN 176 vs 88), shuning uchun qoldiq CHL 96 − 124 → 0, YUN 60 − 88 → 0.
      Dublikat bilan: CHL 843.3 + 126.5 − 0 = 969.8 → 81 quti (972); YUN 606.7 + 91.0 − 0 = 697.7 → 59 quti (708).
      To'g'ri: CHL 73 quti (876), YUN 54 quti (648), SRG 41 (o'zgarmagan). Ortiqcha: 8 + 5 = 13 quti = 156 dona ≈ 1 528 800 so'm,
      7 kunlik sut — asosan hisobdan chiqarilardi. Qatiq, kefir, non uchun ham CHL/YUN tavsiyalari tozalanguncha ishlatilmasin.

