  - id: clean_sales_fix
    type: task
    role: engineer
    day: 1
    at: "09:30"
    from: sherzod
    brief: |
      DE-57: hozirgi loader dublikat paketlarni ikki marta qo'shadi, qaytarishlarni sotuvga qo'shadi va sanani UTC bo'yicha oladi.
      Feed tavsifiga mos clean_sales(rows) yozing (faqat stdlib): natija {(store_id, "YYYY-MM-DD", sku): sof dona},
      faqat kamida bitta yaroqli qatori bor kalitlar. Javobda: kod (funksiya + testlar) va qisqa izoh — nima noto'g'ri edi
      va SRG raqamiga qanday ta'sir qilgan. Kod maydonidagi clean_sales avtomatik testlardan ham o'tkaziladi.
    attachments: [doc_loader_code, doc_pos_feed]
    answer_types: [code, text]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    checks:
      module: solution
      weight: 0.5
      tests: |
        from solution import clean_sales

        def _r(store, receipt, line, qty, ts="2026-10-07 08:00", sku="40112", kind="sale"):
            return {"store_id": store, "receipt_id": receipt, "line_no": line, "sku": sku, "qty": qty, "ts_utc": ts, "kind": kind}

        def test_sums_by_store_day_sku():
            rows = [_r("CHL", "R1", 1, 2), _r("CHL", "R2", 1, 3), _r("YUN", "R1", 1, 1)]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 5, ("YUN", "2026-10-07", "40112"): 1}

        def test_resent_line_counted_once():
            rows = [_r("CHL", "R1", 1, 2), _r("CHL", "R1", 1, 2), _r("CHL", "R1", 1, 2)]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 2}

        def test_same_receipt_other_line_is_not_duplicate():
            rows = [_r("CHL", "R1", 1, 2), _r("CHL", "R1", 2, 1)]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 3}

        def test_same_receipt_id_in_other_store_is_not_duplicate():
            rows = [_r("CHL", "R1", 1, 2), _r("SRG", "R1", 1, 2)]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 2, ("SRG", "2026-10-07", "40112"): 2}

        def test_return_subtracts():
            rows = [_r("CHL", "R1", 1, 4), _r("CHL", "V1", 1, 1, kind="return")]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 3}

        def test_day_is_tashkent_date():
            rows = [_r("CHL", "R1", 1, 2, ts="2026-10-07 19:30"), _r("CHL", "R2", 1, 1, ts="2026-10-07 18:59")]
            assert clean_sales(rows) == {("CHL", "2026-10-08", "40112"): 2, ("CHL", "2026-10-07", "40112"): 1}

        def test_broken_rows_skipped():
            rows = [_r("CHL", "R1", 1, 0), _r("CHL", "R2", 1, -3), _r("CHL", "R3", 1, 2, sku=""), _r("CHL", "R4", 1, 1)]
            assert clean_sales(rows) == {("CHL", "2026-10-07", "40112"): 1}

        def test_empty_feed():
            assert clean_sales([]) == {}
    rubric:
      - {id: root_cause, description: "Uchala xato topilgan: dublikat paketlar ikki marta, qaytarish qo'shiladi, sana UTC; SRG 880 ≈ 2 × 440", weight: 2}
      - {id: fix_correct, description: "Dublikat kaliti (store_id, receipt_id, line_no) — do'kon kalitda; return ayiriladi; Toshkent sanasi (+5 soat); qty ≤ 0 va bo'sh sku tashlanadi", weight: 2}
      - {id: tests, description: "Chegara holatlari uchun testlar: qayta yuborish, boshqa line_no, boshqa do'kondagi bir xil receipt_id, 19:00 UTC dan keyin, qaytarish", weight: 1.5}
      - {id: explanation, description: "Izoh qisqa: nima noto'g'ri edi va analyst/BI raqamlariga ta'siri (SRG o'tgan haftasi 440, 880 emas)"}
    hints:
      - "Bitta chek qatorini 'bir xil' deyish uchun qaysi ustunlar birga kerak? receipt_id yolg'iz yetadimi?"
      - "Kassa 18:30 UTC da urgan chek Toshkentda qaysi kunga tegishli?"
      - "Avval testlarni feed tavsifidagi har bir jumladan yozing, keyin funksiyani."
    reference_answer: |
      Xatolar: 1) qayta yuborilgan paketlar ikki-uch marta qo'shiladi (SRG 28.09–04.10: 880 ≈ 2 × 440); 2) return sotuvga qo'shiladi;
      3) sana UTC'dan olinadi — 19:00 UTC dan keyingi savdo oldingi kunda qoladi; 4) qty ≤ 0 va bo'sh sku qatorlari kiradi.
      ```python
      from datetime import datetime, timedelta

      def clean_sales(rows):
          seen, out = set(), {}
          for r in rows:
              if not r.get("sku") or r.get("qty", 0) <= 0:
                  continue
              key = (r["store_id"], r["receipt_id"], r["line_no"])
              if key in seen:
                  continue
              seen.add(key)
              day = (datetime.strptime(r["ts_utc"], "%Y-%m-%d %H:%M") + timedelta(hours=5)).strftime("%Y-%m-%d")
              k = (r["store_id"], day, r["sku"])
              out[k] = out.get(k, 0) + (-r["qty"] if r["kind"] == "return" else r["qty"])
          return out
      ```
      Testlar: qayta yuborish → bir marta; boshqa line_no va boshqa do'kon — dublikat emas; return ayiriladi; 19:30 UTC → ertangi sana.
      Analyst va BI'ga: SRG o'tgan haftasi 440 dona, 880 emas.

