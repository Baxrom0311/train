# CONTRACT.md §29 — jamoaviy Data ssenariysi (2–3 talaba). Kompaniya, odamlar, tizimlar, jadvallar va raqamlar o'ylab topilgan.
# Prognoz usuli, zaxira qoidasi va ma'lumotlar siyosati — o'quv maqsadidagi ichki qoidalar, real normativ emas.
# Hikoya: payshanba — haftalik buyurtma kuni. Data engineer POS oqimini tozalaydi, analyst sut uchun talab prognozi
