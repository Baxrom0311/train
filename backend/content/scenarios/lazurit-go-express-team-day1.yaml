documents:
  - key: doc_team_charter
    title: "Express jamoasi: kim nima qiladi"
    content: |
      Lazurit Go — Toshkentdagi oziq-ovqat yetkazib berish xizmati. "Express" — 45 daqiqada yetkazish,
      ikki hafta pilot (Chilonzor va Yunusobod). Bugun pilot natijasi bo'yicha qaror va kichik reliz kuni.

      Jamoa: backend dasturchi (narx va buyurtma xizmati), data analitik (metrikalar, ta'sir hisobi),
      mijozlar bilan ishlovchi mutaxassis (shikoyatlar, mijozga xabarlar). Mahsulot egasi — Aziza (PM),
      texnik qarorlar — Sardor (Engineering Lead), mijozlar xizmati — Dilfuza.

      Kelishuvlar:
      - Ertalabki standup jamoaga bitta: kim nima qiladi, kim kimni kutadi, nima to'sib turibdi.
      - Raqamlar faqat analitikdan: mijozga yoki rahbarga raqam yozishdan oldin analitik bilan tekshiring.
      - Mijozga ketadigan matnni support yozadi, texnik tafsilotni backend tasdiqlaydi.
      - Relizlar har kuni 15:00 da. Reliz bloklovchi bug ustuvor.
      - Kun oxirida jamoa bitta umumiy hisobot yozadi.

  - key: doc_express_spec
    title: "Express yetkazish: mahsulot talablari"
    content: |
      1. Standart yetkazish — 12 000 so'm. Mahsulotlar summasi (subtotal) 150 000 so'm va undan ko'p bo'lsa — bepul.
      2. Express — standart narx + 9 000 so'm qo'shimcha. Qo'shimcha bepul yetkazish chegarasidan qat'i
         nazar olinadi (150 000 dan yuqori buyurtmada express narxi 9 000 so'm).
      3. Express faqat pilot hududlarida: Chilonzor, Yunusobod. Hudud nomi katta-kichik harfdan qat'i nazar
         solishtiriladi. Boshqa hududda express so'ralsa — xato (ilova "Hududingizda hali yo'q" deydi).
      4. Pullar butun so'mda.
      5. Kengaytirish sharti: pilotda 45 daqiqada yetkazish ulushi ≥ 85% va bekor qilish ≤ 5%.

  - key: doc_delivery_code
    title: "orders-service: delivery.py"
    content: |
      LZ-301 ticket'i: express narxi ba'zan noto'g'ri, pilotdan tashqari hududlardan ham express buyurtmalar kelyapti.

      ```python
      STANDARD_FEE = 12_000
      FREE_FROM = 150_000
      EXPRESS_SURCHARGE = 9_000
      PILOT_DISTRICTS = {"Chilonzor", "Yunusobod"}

      class ExpressUnavailable(Exception):
          pass

      def delivery_fee(subtotal: int, express: bool, district: str) -> int:
          fee = STANDARD_FEE
          if express:
              fee += EXPRESS_SURCHARGE
          if subtotal >= FREE_FROM:
              fee = 0
          return fee
      ```

      Testlar: tests/test_delivery.py (pytest) — hozircha faqat standart yetkazish tekshiriladi.

  - key: doc_pilot_data
    title: "Express pilot: 1-hafta (Chilonzor + Yunusobod)"
    content: |
      kun | express buyurtmalar | 45 daqiqada yetkazilgan | subtotal ≥ 150 000 | bekor qilingan
      Dushanba | 120 | 102 | 30 | 6
      Seshanba | 140 | 115 | 38 | 9
      Chorshanba | 160 | 128 | 41 | 12
      Payshanba | 150 | 126 | 36 | 7
      Juma | 180 | 135 | 55 | 16

      Izoh: jadvalda faqat pilot hududlari. Kod xatosi tufayli pilotdan tashqari hududlardan yana 34 ta
      express buyurtma kelgan (shundan 45 daqiqada yetkazilgani — 9 ta), ular jadvalga kirmagan.
      "subtotal ≥ 150 000" buyurtmalarda express qo'shimchasi xato tufayli olinmagan.

  - key: doc_support_policy
    title: "Mijozlar xizmati: kompensatsiya va ohang"
    content: |
      Javob vaqti: shikoyatga 2 soat ichida birinchi javob.
      Ohang: mijozni ismi bilan, aybni tan olib, bahonasiz; texnik jargon yo'q; nima qilinishi va qachonligi aniq.

      Kompensatsiya:
      - Express 45 daqiqadan 15 daqiqadan ko'proq kechiksa — express qo'shimchasi (9 000 so'm) qaytariladi.
      - Xizmat ko'rsatilmaydigan hududda express sotilgan bo'lsa — qo'shimcha qaytariladi va uzr so'raladi.
      - Ortiqcha yechilgan pul — to'liq qaytariladi, 3 bank kuni ichida kartaga.
      - Kuryer xulqi — kuryerlar bo'limiga eskalatsiya, pul kompensatsiyasi yo'q.
      - Kodda xato bo'lsa (mijoz foydasiga bo'lsa ham) — backend'ga ticket; mijozga kelajak uchun va'da berilmaydi.
      Promo-kod savollari — umumiy navbatga (express jamoasiga tegishli emas).

  - key: doc_complaints
    title: "Bugungi shikoyatlar (Express)"
    content: |
      1. Kamola, Chilonzor: "Express uchun 21 000 so'm to'ladim, buyurtma 1 soat 20 daqiqada keldi."
      2. Jasur, Sergeli: "Express tanladim, 2 soat kutdim! Pulimni qaytaring."
      3. Nilufar, Yunusobod: "Kuryer qo'pol gapirdi, zinapoyaga ham chiqmadi."
      4. Bekzod, Chilonzor: "200 000 so'mlik buyurtmada express bepul bo'ldi, rahmat! Doim shunday bo'ladimi?"
      5. Shahzoda, Yashnobod: "SALE20 promo-kodi ishlamadi."
      6. Otabek, Yunusobod: "Ilovada express tugmasi umuman ko'rinmayapti (Android 14)."

  - key: doc_incident_runbook
    title: "Prod incident runbook"
    content: |
      1. #incidents kanalida e'lon: nima buzildi, qachondan, ta'sir (qancha mijoz, qancha pul), SEV darajasi.
         Pul noto'g'ri yechilsa — har doim SEV-1.
      2. Muammo relizdan keyin boshlangan bo'lsa — avval ta'sirni to'xtating (feature flag yoki rollback),
         sababni keyin qidiring.
      3. Mijozlarga xabar — support yozadi, analitik raqamlarini tasdiqlaydi.
      4. Har 30 daqiqada holat yangilanishi. Barqarorlashgach — postmortem 2 ish kuni ichida.
      Taqiqlanadi: prod DB'ga qo'lda o'zgartirish, testlarsiz "tezkor fix".

  - key: doc_incident_logs
    title: "Monitoring: payments, bugun 15:00–15:30"
    content: |
      15:00  deploy orders-service v2.15.0 (LZ-301 tuzatishi, to'lov so'rovida retry qo'shilgan)
      15:02  payments: express buyurtmalarda yetkazish to'lovi ikki marta yechilmoqda (charge + retry charge)
      15:24  ikki marta yechilgan buyurtmalar: 64 ta express
               subtotal < 150 000: 41 ta (har birida ortiqcha 21 000 so'm)
               subtotal ≥ 150 000: 23 ta (har birida ortiqcha 9 000 so'm)
      Standart yetkazishda muammo yo'q. To'lov xizmati javoblari: 200 va timeout'dan keyin qayta 200.

