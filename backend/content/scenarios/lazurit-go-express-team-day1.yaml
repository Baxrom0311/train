  - id: fix_express
    type: task
    role: backend
    day: 1
    at: "09:30"
    from: sardor
    brief: |
      LZ-301: express narxi va hudud tekshiruvi. Spec'ga mos qilib delivery_fee'ni tuzating va
      regress testlar yozing. Javobda: kod (funksiya + testlar) va qisqa izoh — nima noto'g'ri edi.
      Kod maydonidagi delivery_fee CI'dagi avtomatik testlardan ham o'tkaziladi.
    attachments: [doc_delivery_code, doc_express_spec]
    answer_types: [code, text]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    checks:
      module: solution
      weight: 0.5
      tests: |
        import pytest
        from solution import ExpressUnavailable, delivery_fee

        def test_standard_fee():
            assert delivery_fee(50_000, False, "Sergeli") == 12_000

        def test_standard_free_from_threshold():
            assert delivery_fee(150_000, False, "Chilonzor") == 0

        def test_express_regular():
            assert delivery_fee(50_000, True, "Chilonzor") == 21_000

        def test_express_surcharge_kept_above_threshold():
            assert delivery_fee(200_000, True, "Yunusobod") == 9_000

        def test_district_case_insensitive():
            assert delivery_fee(50_000, True, "yunusobod") == 21_000

        def test_express_outside_pilot_rejected():
            with pytest.raises(ExpressUnavailable):
                delivery_fee(50_000, True, "Sergeli")
    rubric:
      - {id: root_cause, description: "Ikkala xatoni topgan: bepul chegara express qo'shimchasini ham nolga tushiradi; hudud tekshirilmaydi", weight: 2}
      - {id: fix_correct, description: "Tuzatish spec'ning 1–4 bandlariga mos: qo'shimcha har doim, hudud katta-kichik harfsiz, xato — ExpressUnavailable", weight: 2}
      - {id: tests, description: "Chegara holatlari uchun testlar: 150 000 aynan, express + chegara, pilotdan tashqari hudud, harf registri", weight: 1.5}
      - {id: explanation, description: "Izoh qisqa: nima noto'g'ri edi va mijozga ta'siri (yo'qotilgan qo'shimcha, pilotdan tashqari buyurtmalar)"}
    hints:
      - "200 000 so'mlik express buyurtmani qo'lda hisoblang: kod nima qaytaradi, spec nima deydi?"
      - "Bepul yetkazish faqat standart qismga tegishli. Standart qism va express qo'shimchasini alohida o'zgaruvchida hisoblang."
      - "Hudud nomini solishtirishdan oldin bir xil ko'rinishga keltiring (masalan, .lower())."
    reference_answer: |
      Sabab: subtotal >= FREE_FROM bo'lsa fee butunlay 0 — express qo'shimchasi ham yo'qoladi; hudud umuman tekshirilmaydi.
      PILOT_DISTRICTS = {"chilonzor", "yunusobod"}
      def delivery_fee(subtotal, express, district):
          base = 0 if subtotal >= FREE_FROM else STANDARD_FEE
          if not express:
              return base
          if district.strip().lower() not in PILOT_DISTRICTS:
              raise ExpressUnavailable(district)
          return base + EXPRESS_SURCHARGE
      Testlar: 150 000 standart → 0; 200 000 express → 9 000; 50 000 express → 21 000; "yunusobod" → ishlaydi; Sergeli express → xato.

