        def test_duplicate_phone_is_one_person():
            members = [_m("A", "h1", "2026-06-03 10:00"), _m("A2", "h1", "2026-07-05 11:00"), _m("B", "h2", "2026-06-04 10:00")]
            orders = [_o(1, "A2", "2026-07-06 10:00")]
            assert cohort_retention(members, orders, months=2) == {"2026-06": [0.0, 50.0]}


        def test_empty_phone_is_separate_person():
            members = [_m("A", None, "2026-06-03 10:00"), _m("B", None, "2026-06-04 10:00")]
            orders = [_o(1, "A", "2026-06-05 10:00")]
