      - {id: timezone, description: "Signup va xarid oyi Toshkent vaqtida (+5 soat): M03 iyul kogortasi, O06 avgust", weight: 1.5}
      - {id: denominator, description: "Maxraj — butun kogorta, M0 xaridorlari emas; k oralig'i va noma'lum member_id ishlangan", weight: 1.5}
      - {id: sample_table, description: "Namuna natijasi: 2026-06 (3 a'zo: M01, M02, M09) — 66.7 / 33.3 / 66.7 / 33.3; 2026-07 (4 a'zo: M03, M07, M08, M10) — 75.0 / 50.0 / 25.0 / 0.0", weight: 2}
      - {id: draft_bugs, description: "Qoralama xatolari: UTC oylar, refunded va test/xodim kartalari hisobda, takroriy telefonlar birlashtirilmagan, maxraj — M0 xaridorlari (M0 doim 100%)", weight: 1.5}
    hints:
      - "Avval 'odam' xaritasini quring: member_id → asosiy karta. Keyin har xaridni shu odamga bog'lang."
      - "M03 qaysi kunda karta olgan — Toshkent soatida? O06 xaridi-chi? Ikkalasini qo'lda o'tkazib ko'ring."
      - "Qoralamada M0 ustuni har doim 100% chiqadi. Bu nima haqida signal beradi?"
    reference_answer: |
      ```python
      from datetime import datetime, timedelta

      def _month(ts):
          t = datetime.strptime(ts, "%Y-%m-%d %H:%M") + timedelta(hours=5)
          return t.year, t.month

      def cohort_retention(members, orders, months=4):
          ok = [m for m in members if not m["is_test"] and not m["is_employee"]]
          first = {}
          for m in sorted(ok, key=lambda m: (m["signup_utc"], m["member_id"])):
              first.setdefault(m["phone_hash"] or ("id", m["member_id"]), m)
          owner = {m["member_id"]: first[m["phone_hash"] or ("id", m["member_id"])]["member_id"] for m in ok}
          cohort = {p["member_id"]: _month(p["signup_utc"]) for p in first.values()}
          active = set()
          for o in orders:
              pid = owner.get(o["member_id"])
              if pid is None or o["status"] != "paid":
                  continue
              (y, mo), (cy, cm) = _month(o["ts_utc"]), cohort[pid]
              k = (y - cy) * 12 + (mo - cm)
              if 0 <= k < months:
                  active.add((pid, k))
          groups = {}
          for pid, (y, mo) in cohort.items():
              groups.setdefault(f"{y:04d}-{mo:02d}", []).append(pid)
          return {c: [round(100 * sum((p, k) in active for p in ids) / len(ids), 1) for k in range(months)]
                  for c, ids in sorted(groups.items())}
      ```
      Namuna: M04 (xodim), M05 (test) chiqadi; M06 = M01 (h01); M03 signup 30.06 20:30 UTC = 01.07 01:30 — iyul kogortasi.
      2026-06 (M01, M02, M09): M0 — M01, M09 (M02 faqat refunded) 66.7; M1 — M01 (O04) 33.3; M2 — M01 (O05 M06 orqali),
      M02 (O06: 31.07 19:10 UTC = 01.08 00:10) 66.7; M3 — M09 (O16) 33.3.
      2026-07 (M03, M07, M08, M10): M0 — M03, M07, M08 75.0; M1 — M03, M10 (M08 refunded) 50.0; M2 — M07 25.0; M3 — 0.0.
      Qoralama xatolari: UTC oylar (M03 iyunga, O06 iyulga tushadi), refunded, test va xodim kartalari hisobda, M06 alohida
      karta, maxraj faqat M0 xaridorlari (M0 doim 100%, retention oshib ko'rinadi), noma'lum member_id'da KeyError.

