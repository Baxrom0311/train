  - id: retention_code
    type: task
    day: 3
    at: "09:30"
    from: madina
    brief: |
      Kengash materiallari uchun Jasurning qoralama skripti o'rniga tasdiqlangan funksiya kerak. Python'da (faqat stdlib) yozing:
      cohort_retention(members, orders, months=4) -> dict[str, list[float]]
      - members: {member_id, phone_hash, signup_utc, is_test, is_employee}; orders: {order_id, member_id, ts_utc, amount, status};
        vaqtlar "YYYY-MM-DD HH:MM", UTC.
      - Natija: {"YYYY-MM": [M0, M1, ..., M(months−1)]} — kogortalar o'sish tartibida, foizlar round(..., 1).
      - Qoidalar — v1.0: test/xodim kartalari xaridlari bilan chiqadi, bir phone_hash — bitta odam (asosiy — eng erta karta),
        phone_hash None — alohida odam, faqat paid, Toshkent vaqti, maxraj — butun kogorta; k < 0 yoki k ≥ months va
        noma'lum member_id e'tiborsiz.
      Javobda: kod, namunadagi natija jadvali va qoralama skriptdagi xatolar ro'yxati.
      Kod maydonidagi cohort_retention avtomatik testlardan ham o'tkaziladi.
    attachments: [doc_metric_spec, doc_retention_draft, doc_cohort_sample]
    answer_types: [code, text]
    due_in_minutes: 240
    weight: 3
    competencies: [technical]
    checks:
      module: solution
      weight: 0.5
      tests: |
        from solution import cohort_retention


        def _m(mid, phone, signup, test=False, emp=False):
            return {"member_id": mid, "phone_hash": phone, "signup_utc": signup, "is_test": test, "is_employee": emp}


        def _o(oid, mid, ts, status="paid", amount=50_000):
            return {"order_id": oid, "member_id": mid, "ts_utc": ts, "amount": amount, "status": status}


        def test_basic_cohort_and_denominator():
            members = [_m("A", "h1", "2026-06-02 10:00"), _m("B", "h2", "2026-06-05 10:00")]
            orders = [_o(1, "A", "2026-06-03 10:00"), _o(2, "A", "2026-07-03 10:00")]
            assert cohort_retention(members, orders, months=3) == {"2026-06": [50.0, 50.0, 0.0]}


        def test_refunded_not_counted():
