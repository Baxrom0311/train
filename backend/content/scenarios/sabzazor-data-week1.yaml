  - key: doc_incident_retention
    title: "Kengash pre-read'i: retention raqami (payshanba 09:40)"
    content: |
      Chorshanba kechqurun marketing jamoasi Rustam akaga va kengash a'zolariga pre-read yubordi:
      "Sabzazor+ iyun kogortasi: 2-oy retention 71.4% — har 10 a'zodan 7 tasi qaytib keladi.
      Tavsiya: 12 do'konga yoyish. 60 000 karta buyurtmasi, shartnoma payshanba 12:00 da imzolanadi."
      Hisob manbai: Jasurning qoralama skripti (retention_draft) — tasdiqlangan funksiya hali tayyor emas edi.

      Iyun kogortasi, M1 (iyul) — Sherzod dwh'dan ajratib berdi:
      qism | qoralama skript | v1.0 qoidasi
      maxraj | 1 638 karta — iyunda kamida bitta xarid qilganlar (shundan 12 test, 64 xodim, 22 takroriy 2-karta) | 2 000 mos a'zo — butun iyun kogortasi
      surat | 1 170 karta — iyunda ham, iyulda ham xarid qilganlar (qaytarilganlar ham hisobda) | 920 a'zo — iyulda kamida bitta to'langan xarid
      natija | 71.4% | 46.0%

      Iyun kogortasidagi 2 000 mos a'zoning 460 tasi iyunda umuman xarid qilmagan — qoralama ularni ko'rmaydi.

