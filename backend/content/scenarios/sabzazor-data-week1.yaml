  - id: cohort_sql
    type: task
    day: 2
    at: "09:30"
    from: madina
    brief: |
      Tasdiqlangan v1.0 ta'riflari bo'yicha kogorta jadvalini beradigan SQL yozing (PostgreSQL): kogorta oyi,
      kogorta hajmi, M0–M3 faol a'zolar soni va retention foizi. Har bir CTE nima uchunligini 1 qatorda izohlang
      va qaysi qadam qaysi v1.0 bandini bajarishini ko'rsating.
    attachments: [doc_metric_spec, doc_loyalty_tables]
    answer_types: [code, text]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    rubric:
      - {id: members, description: "Mos a'zolar: is_test/is_employee chiqarilgan; phone_hash bo'yicha ROW_NUMBER (signup_ts, member_id) — asosiy karta; NULL phone_hash alohida", weight: 2}
      - {id: mapping, description: "Takroriy kartalar xaridlari asosiy kartaga bog'langan (member_id → person_id xaritasi)", weight: 1.5}
      - {id: orders, description: "Xaridlar: status='paid', order_id dublikati DISTINCT, Toshkent vaqti (+5 soat) bilan oy", weight: 2}
      - {id: denominator, description: "Maxraj — kogortadagi barcha mos a'zolar; LEFT JOIN yoki alohida kogorta hajmi; month_index = oylar farqi", weight: 2}
      - {id: explain, description: "Har CTE izohlangan va v1.0 bandlariga bog'langan"}
    hints:
      - "Avval 'odam' jadvalini yasang: har phone_hash uchun bitta asosiy karta. Telefonsiz kartalar bilan nima qilasiz?"
      - "Oylar farqini sanadan qanday chiqarasiz? (yil × 12 + oy) ayirmasi yordam beradi."
      - "Maxrajni xaridlar jadvalidan olsangiz, xarid qilmagan a'zolar qayerda qoladi?"
    reference_answer: |
      ```sql
      WITH m AS (               -- v1.0 §1: mos kartalar, Toshkent vaqti
        SELECT member_id, COALESCE(phone_hash, 'id:' || member_id) AS person_key,
               signup_ts + INTERVAL '5 hours' AS signup_local
        FROM dwh.loyalty_members WHERE NOT is_test AND NOT is_employee),
      ranked AS (               -- §1: bir telefon — bitta odam, asosiy karta eng erta
        SELECT *, FIRST_VALUE(member_id) OVER (PARTITION BY person_key ORDER BY signup_local, member_id) AS person_id
        FROM m),
      people AS (               -- §4: kogorta = asosiy kartaning signup oyi
        SELECT DISTINCT person_id, DATE_TRUNC('month', FIRST_VALUE(signup_local) OVER (PARTITION BY person_key
               ORDER BY signup_local, member_id)) AS cohort FROM ranked),
      buys AS (                 -- §2–3: paid, dublikatsiz, Toshkent oyi, asosiy kartaga bog'langan
        SELECT DISTINCT r.person_id, DATE_TRUNC('month', o.order_ts + INTERVAL '5 hours') AS month
        FROM (SELECT DISTINCT order_id, customer_id, order_ts, status FROM dwh.orders) o
        JOIN ranked r ON r.member_id = o.customer_id WHERE o.status = 'paid'),
      act AS (                  -- §5: k-oy
        SELECT p.cohort, (EXTRACT(YEAR FROM b.month) * 12 + EXTRACT(MONTH FROM b.month))
                       - (EXTRACT(YEAR FROM p.cohort) * 12 + EXTRACT(MONTH FROM p.cohort)) AS k, b.person_id
        FROM people p JOIN buys b ON b.person_id = p.person_id),
      size AS (SELECT cohort, COUNT(*) AS n FROM people GROUP BY cohort)
      SELECT s.cohort, s.n, a.k, COUNT(DISTINCT a.person_id) AS active,
             ROUND(100.0 * COUNT(DISTINCT a.person_id) / s.n, 1) AS retention
      FROM size s LEFT JOIN act a ON a.cohort = s.cohort AND a.k BETWEEN 0 AND 3
      GROUP BY s.cohort, s.n, a.k ORDER BY 1, 3;
      ```
      Maxraj size'dan — xarid qilmaganlar ham kogortada; refunded va test/xodim kartalari xaridlari kirmaydi.

