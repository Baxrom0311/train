  - id: sql_review
    type: task
    day: 2
    at: "14:30"
    from: jasur
    brief: |
      Salom! Kengash slaydi uchun "karta egalari vs kartasizlar o'rtacha cheki" so'rovini yozdim, ilovada.
      Review qilib bera olasizmi? Har izoh: qaysi qator, muammo, taklif, blocker yoki nit.
    attachments: [doc_jasur_sql, doc_metric_spec]
    answer_types: [text]
    due_in_minutes: 120
    competencies: [technical, communication]
    rubric:
      - {id: left_join, description: "Blocker: WHERE m.is_test = false LEFT JOIN'ni INNER'ga aylantiradi — kartasiz qatorlar yo'qoladi (shuning uchun natija chiqmagan); shartni ON'ga yoki COALESCE", weight: 2}
      - {id: fanout, description: "Blocker: order_items JOIN qatorlarni ko'paytiradi — AVG mahsulot soniga og'irlangan, COUNT(*) oshgan; JOIN olib tashlansin", weight: 2}
      - {id: filters, description: "status='paid' yo'q; BETWEEN '2026-08-31' 31-avgustni kesadi va UTC; xodim kartalari, order_id dublikati", weight: 1.5}
      - {id: method, description: "Metodologiya: karta egalari vs kartasizlar farqi — tanlov xatosi, dastur ta'siri sifatida kengashga berilmasin; eski 115 000 ni boshqa manbadan olmaslik", weight: 1.5}
      - {id: tone, description: "Hurmatli, aniq qator va taklif bilan, blocker/nit ajratilgan"}
    hints:
      - "LEFT JOIN'dan keyin o'ng jadval ustuniga WHERE'da shart qo'yilsa, m NULL bo'lgan qatorlar bilan nima bo'ladi?"
      - "Bitta buyurtmada 3 ta mahsulot bo'lsa, order_items JOIN'dan keyin u buyurtma necha qator bo'ladi?"
    reference_answer: |
      Blocker 1: `AND m.is_test = false` — m NULL bo'lgan (kartasiz) qatorlar tushib qoladi, LEFT JOIN amalda INNER; shuning uchun
      "kartasiz" chiqmagan. Shartni ON'ga: `LEFT JOIN ... ON m.member_id = o.customer_id AND NOT m.is_test AND NOT m.is_employee`.
      Blocker 2: order_items JOIN — har buyurtma mahsulot soniga ko'payadi; AVG ko'p mahsulotli cheklarga og'adi, COUNT(*) ~3×. JOIN kerak emas.
      Major: status='paid' yo'q (refunded kirgan); BETWEEN '2026-06-01' AND '2026-08-31' — 31.08 00:00 dan keyingilar chiqadi va UTC;
      to'g'risi `order_ts + INTERVAL '5 hours' >= '2026-06-01' AND < '2026-09-01'`; order_id dublikati — DISTINCT.
      Metodologiya: karta oladiganlar baribir katta savatli xaridorlar — farq dastur ta'siri emas (tanlov xatosi).
      Eski 115 000 ni boshqa hisobotdan olib qo'ymang. Nit: COUNT(DISTINCT o.order_id), segment nomlari.

