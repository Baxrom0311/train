documents:
  - key: doc_onboarding
    title: "Analitika bo'limi: onboarding va hafta rejasi"
    content: |
      Sabzazor — Toshkentdagi 12 ta do'kondan iborat oziq-ovqat tarmog'i, onlayn buyurtma va yetkazish ham bor.
      Analitika bo'limi: Madina (rahbar), Otabek (katta analyst, mentor), Jasur va yana 2 analyst.
      Ombor va ETL — Sherzod (data engineer). Buyurtmachilar: operatsiyalar (Rustam), marketing (Dilnoza).

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Har kuni 09:00 da yozma standup:
      kecha nima qildim / bugun nima qilaman va qachon tayyor / nima to'sib turibdi. 3–5 qator. 17:30 da kun yakuni.

      Asosiy qoidalar:
      - Har raqamning manbasi bo'ladi: jadval, filtr, davr. So'rov yoki kod hisobotga ilova qilinadi.
      - Raqamni chiqarishdan oldin sifat tekshiruvi: dublikat, NULL, qaytarilganlar, test yozuvlar, vaqt mintaqasi.
      - Rahbariyatga xulosa texnik bo'lmagan tilda: raqam, xulosa, tavsiya, cheklovlar.
      - Tasdiqlanmagan (review'dan o'tmagan) skript natijasi rahbariyat hujjatiga kirmaydi.

      Bu hafta (05.10–09.10): juma kuni kengash "Sabzazor+" sodiqlik kartasini 12 do'konga yoyish-yoymaslikni hal qiladi.
      Dushanba — reja va ta'riflar, seshanba — SQL va review, chorshanba — kogorta funksiyasi va ta'sir tahlili,
      payshanba — kengash oldi materiallari, juma — taqdimot va retro.

  - key: doc_program_brief
    title: "Sabzazor+ sodiqlik kartasi: pilot tavsifi"
    content: |
      Dastur: xaridor kassada telefon raqami bilan bepul karta oladi, har to'langan xariddan 3% cashback ballari
      yig'iladi (keyingi xaridda 1 ball = 1 so'm). Karta Sabzazor ilovasida ham bor.
      Pilot: 01.06.2026 dan Chilonzor (CHL) va Yunusobod (YUN) do'konlarida.
      Nazorat do'konlari: Sergeli (SRG) va Olmazor (OLM) — kartasiz, joylashuvi va hajmi pilotga o'xshash.
      Pilotdan oldingi davr: mart–may; pilot davri: iyun–avgust (sentyabr ma'lumotlari hali to'liq tekshirilmagan).

      Kengash savoli (juma, 09.10): dasturni barcha 12 do'konga yoyamizmi?
      Rustam: "Tushum o'syapti, tezroq yoyish kerak." Dilnoza: "Karta egalari 41% ko'p xarid qiladi."
      Moliya: "Cashback va karta xarajatlari qoplanyaptimi — shuni ko'rmoqchimiz."

  - key: doc_loyalty_tables
    title: "Ma'lumotlar lug'ati: sodiqlik jadvallari"
    content: |
      dwh.loyalty_members — har karta bitta qator.
      ustun | turi | izoh
      member_id | text | Karta raqami (PK).
      phone_hash | text NULL | Telefon raqamining xeshi. Bir odam yo'qotgan kartasi o'rniga yangisini olsa — bir xil xesh, ikki karta. NULL — telefonsiz berilgan karta.
      store_id | text | Karta berilgan do'kon: CHL, YUN.
      signup_ts | timestamp | Karta berilgan vaqt, UTC (Toshkent = UTC+5, yozgi vaqt yo'q).
      is_test | bool | Kassirlar tekshiruvi uchun test kartalar.
      is_employee | bool | Xodimlar kartasi (xodimlar har kuni xarid qiladi, cashback'i boshqa).
      sms_consent | bool | Reklama SMS'iga yozma rozilik bergan.

      dwh.orders — har buyurtma bitta qator: order_id (PRIMARY KEY yo'q — POS qayta yuborsa dublikat bo'ladi),
      store_id, customer_id (= member_id; NULL — kartasiz xarid), order_ts (UTC), amount_sum (so'm), status (paid | refunded).
      dwh.order_items — buyurtmadagi har mahsulot bitta qator (order_id, product_id, category, qty, price).

      crm.members_raw — ism va ochiq telefon raqami. Kirish faqat CRM jamoasi va xizmat zarurati bilan;
      analitikada faqat phone_hash ishlatiladi.

  - key: doc_members_summary
    title: "loyalty_members: profil (30.09 holati) va marketing dashboard'i"
    content: |
      Berilgan kartalar oylar bo'yicha (Toshkent vaqti bo'yicha):
      oy | kartalar | test | xodim | takroriy (shu telefonning 2-kartasi)
      iyun | 2 140 | 12 | 68 | 60
      iyul | 1 530 | 4 | 26 | 50
      avgust | 1 180 | 2 | 18 | 40
      sentyabr | 880 | 2 | 14 | 34

      Sentyabrda kamida bitta xarid qilgan kartalar — 3 120. Shulardan:
      test kartalar — 18; xodim kartalari — 110; takroriy 2-kartalar (egasi asosiy kartasi bilan ham xarid qilgan) — 95;
      sentyabrdagi yagona xaridi qaytarilgan (refunded) kartalar — 37.

      Marketing dashboard'i (Dilnoza): "Sabzazor+ a'zolari: 5 730. Sentyabrda faol: 3 120 (54.5%)."

  - key: doc_metric_requests
    title: "Chat: «faol a'zo» nima? (yozishmadan parcha)"
    content: |
      Dilnoza: Faol a'zo — karta olgan har kim. Kartani olgan bo'lsa, demak dasturda.
      Rustam: Yo'q, faol — oyda kamida bitta xarid qilgan. Qaytarib bergan xaridi ham xarid-ku.
      Moliya (Kamola): Bizga to'langan summa muhim. Xodim kartalari umuman alohida hisoblanadi.
      Jasur: Retention'ni men birinchi oyda xarid qilganlardan hisoblayman — qolganlari baribir "o'lik" kartalar.
      Madina: Yangi hamkasbimiz dushanba kuni bitta yozma ta'riflar hujjatini taklif qiladi, keyin tasdiqlaymiz.

  - key: doc_metric_spec
    title: "Sodiqlik metrikalari: tasdiqlangan ta'riflar v1.0 (ichki standart)"
    content: |
      1. Mos a'zo: is_test = false va is_employee = false. Bir xil phone_hash'li kartalar — bitta odam:
         asosiy karta eng erta signup_ts'li (teng bo'lsa — kichik member_id), qolgan kartalarning xaridlari asosiy kartaga
         qo'shiladi. phone_hash NULL bo'lsa — karta alohida odam. Test va xodim kartalari xaridlari bilan birga chiqariladi.
      2. Hisobga olinadigan xarid: status = 'paid'. Bir xil order_id qatorlari bitta xarid.
      3. Vaqt: barcha sanalar Toshkent vaqtida (UTC + 5 soat).
      4. Kogorta: mos a'zoning signup oyi (YYYY-MM). Kogorta hajmi — shu oydagi barcha mos a'zolar (xarid qilmaganlar ham).
      5. Retention M_k = kogortadan k-oyda (signup oyi — M0) kamida bitta hisobga olinadigan xarid qilganlar / kogorta hajmi,
         foizda, 1 xona aniqlikda.
      6. Faol a'zo (oy) — shu oyda kamida bitta hisobga olinadigan xaridi bor mos a'zo. Faollik ulushi = faol / barcha mos a'zolar.
      7. Har hisobotda: davr, filtrlar, chiqarilgan yozuvlar soni va sababi.

  - key: doc_data_policy
    title: "Ma'lumotlar va hisobot siyosati (ichki qoida)"
    content: |
      Shaxsiy ma'lumot:
      - Ochiq telefon raqami va ism faqat crm.members_raw'da; eksport qilinmaydi, email/chat orqali yuborilmaydi.
      - Reklama SMS'i faqat sms_consent = true a'zolarga va faqat kompaniyaning CRM SMS moduli orqali yuboriladi.
      - Tashqi tashkilotga shaxsiy ma'lumot berish — faqat imzolangan ma'lumotlarni qayta ishlash kelishuvi va
        ma'lumotlar himoyasi mas'ulining yozma ruxsati bilan. Analitik bunday qarorni o'zi qabul qilmaydi.
      Hisobot halolligi:
      - Tahlil davri tahlildan OLDIN belgilanadi va o'zgartirilmaydi; natijasi "chiroyli" davrni tanlab olish taqiqlanadi.
      - Natijaga boshqa omil (aksiya, bayram, nosozlik) ta'sir qilgan bo'lsa — u ochiq yoziladi, yashirilmaydi.
      - Noqulay natija ham to'liq beriladi: raqam, ishonch oralig'i yoki diapazon, cheklovlar.
      - Kelishmovchilikda analitik o'zi qaror qilmaydi — bo'lim rahbariga yozadi.

  - key: doc_jasur_sql
    title: "Jasurning so'rovi: karta egalari va kartasizlarning o'rtacha cheki"
    content: |
      Tavsif: "Pilot do'konlarda karta egalarining o'rtacha cheki kartasizlarnikidan qancha yuqori — kengash slaydi uchun."

      ```sql
      SELECT CASE WHEN m.member_id IS NULL THEN 'kartasiz' ELSE 'karta' END AS segment,
             AVG(o.amount_sum) AS avg_check,
             COUNT(*)          AS orders
      FROM dwh.orders o
      LEFT JOIN dwh.loyalty_members m ON m.member_id = o.customer_id
      LEFT JOIN dwh.order_items i     ON i.order_id = o.order_id
      WHERE o.order_ts BETWEEN '2026-06-01' AND '2026-08-31'
        AND o.store_id IN ('CHL', 'YUN')
        AND m.is_test = false
      GROUP BY 1;
      ```

      Natija: karta — 162 000 so'm; kartasiz — qator chiqmadi ("kartasizlar ma'lumoti yo'q shekilli, eski hisobotdagi 115 000 ni olaman").

  - key: doc_retention_draft
    title: "Jasurning qoralama retention skripti (review'dan o'tmagan)"
    content: |
      ```python
      def retention_draft(members, orders, months=4):
          cohort = {m["member_id"]: m["signup_utc"][:7] for m in members}
          buyers = {}
          for o in orders:
              month = o["ts_utc"][:7]
              buyers.setdefault((cohort[o["member_id"]], month), set()).add(o["member_id"])
          result = {}
          for c in sorted(set(cohort.values())):
              base = buyers.get((c, c), set())          # M0 da xarid qilgan kartalar
              row = []
              for k in range(months):
                  y, m = int(c[:4]), int(c[5:]) + k
                  y, m = y + (m - 1) // 12, (m - 1) % 12 + 1
                  got = buyers.get((c, f"{y:04d}-{m:02d}"), set()) & base
                  row.append(round(100 * len(got) / len(base), 1) if base else 0.0)
              result[c] = row
          return result
      ```
      Kirish: members — {member_id, phone_hash, signup_utc, is_test, is_employee}; orders — {order_id, member_id, ts_utc, amount, status}.
      Vaqtlar "YYYY-MM-DD HH:MM" ko'rinishida, UTC.

