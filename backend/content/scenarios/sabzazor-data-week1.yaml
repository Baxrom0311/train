  - key: doc_finance
    title: "Moliya: dastur xarajatlari va farazlar (ichki o'quv faraz)"
    content: |
      - Yalpi marja (tushumdan): 22%.
      - Cashback: karta bilan to'langan summaning 3%.
      - Doimiy xarajatlar (ilova moduli, SMS, karta chop etish, qo'llab-quvvatlash): pilot do'konlar uchun 7.5 mln so'm/oy.
      - 12 do'konga yoyish uchun yangi kartalar: 60 000 dona × 1 600 so'm.
      Dastur o'zini oqlaydi, agar qo'shimcha (inkremental) tushumdan yalpi foyda ≥ cashback + doimiy xarajatlar.

