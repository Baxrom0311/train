  - id: leave_calc
    type: task
    day: 1
    at: "14:00"
    from: botir
    brief: |
      Ulug'bek Sobirov 19-oktabrdan 14 kunlik ta'til so'radi. Buyruq loyihasidan oldin HR tasdiqlashi kerak:
      1) 19-oktabr holatiga nechta ta'til kuni bor va 14 kun berish mumkinmi; 2) ta'til tugash sanasi va ishga
      chiqish kuni; 3) ta'til puli summasi; 4) pul kechi bilan qachon to'lanishi kerak. Hisobni ko'rsating.
    attachments: [doc_leave_policy, doc_employee_leave]
    answer_types: [text, file]
    due_in_minutes: 90
    weight: 1.5
    competencies: [technical, time_management]
    rubric:
      - {id: entitlement, description: "1-ish yili huquqi 21 + 4 = 25 kun; staj qo'shimchasi yo'q (korxonadagi staj 1 yil, boshqa korxonalar hisobga olinmaydi)", weight: 2}
      - {id: balance, description: "Qoldiq 25 − 7 = 18 kun; yangi ish yilida (01.10 dan) to'liq oy yo'q — 0 kun; 14 kun berish mumkin, keyin 4 kun qoladi", weight: 1.5}
      - {id: dates, description: "Ta'til 19.10–01.11.2026, ishga chiqish 02.11.2026 (dushanba)"}
      - {id: average_pay, description: "Daromad 48 270 000 + 2 400 000 + 1 200 000 = 51 870 000; ta'til puli, mukofot, moddiy yordam chiqarilgan; maxraj 12 × 29.4 − 7 = 345.8; kunlik 150 000 so'm", weight: 2}
      - {id: vacation_pay, description: "Ta'til puli 150 000 × 14 = 2 100 000 so'm (soliqlargacha)", weight: 1.5}
      - {id: pay_deadline, description: "To'lov kechi bilan 14.10.2026 (19.10 dan oldingi 3-ish kuni); ariza 12 kun oldin berilgan — muddat bajarilgan"}
    hints:
      - "Avval kunlar: 1-ish yili huquqi qancha, undan qancha ishlatilgan? Qaysi qo'shimchalar Ulug'bekka tegishli?"
      - "Daromad ko'chirmasidagi har qatorni tartibning 3-bandidagi 'kiradi / kirmaydi' ro'yxati bilan solishtiring. Maxrajda may oyi nima uchun kerak?"
      - "3-ish kunini sanayotganda 19-oktabr qaysi kun ekaniga va dam olish kunlariga qarang."
    reference_answer: |
      Kunlar: 1-ish yili (01.10.2025–30.09.2026) huquqi 21 + 4 (3 smenali sex) = 25 kun; staj +2 yo'q — korxonada 1 yil.
      Ishlatilgan 7 → qoldiq 18. 2-ish yili 01.10.2026 dan, 19.10 gacha to'liq oy yo'q → 0. Jami 18 ≥ 14 — beriladi, 4 kun qoladi.
      Sanalar: 19.10.2026 (dushanba) – 01.11.2026 (yakshanba), ishga 02.11.2026.
      Daromad: 48 270 000 + 2 400 000 + 1 200 000 = 51 870 000 (ta'til puli 1 015 000, mukofot 1 000 000, moddiy yordam 800 000 kirmaydi).
      Maxraj: 12 × 29.4 − 7 = 345.8. Kunlik: 51 870 000 / 345.8 = 150 000 so'm. Ta'til puli: 150 000 × 14 = 2 100 000 so'm (soliqlargacha).
      To'lov: 19.10 dan oldingi ish kunlari 16.10, 15.10, 14.10 → kechi bilan 14.10.2026 (chorshanba). Ariza 07.10 — 12 kun oldin, talab bajarilgan.

