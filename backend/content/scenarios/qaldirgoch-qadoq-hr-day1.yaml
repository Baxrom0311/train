  - id: leak_incident
    type: incident
    day: 1
    at: "15:30"
    from: dilnoza
    brief: |
      Shoshilinch: Madina Xo'jayevaning taklif xati (manzil, pasport seriyasi, oylik) Laylo Karimovaga ketib qolgan,
      Laylo esa "nega unga 5.8 mln, menga 5.2 mln?" deb yozdi. Men direktordaman — 30 daqiqa ichida tayyorlang:
      1) Laylo uchun javob, 2) Madina uchun xabar, 3) ichki qadamlar ro'yxati.
    attachments: [doc_data_policy, doc_leak_details]
    answer_types: [text]
    due_in_minutes: 30
    weight: 1.5
    competencies: [stress_handling, communication, initiative]
    rubric:
      - {id: laylo_reply, description: "Laylo'ga: uzr, xatni o'chirish va hech kimga yubormaganini yozma tasdiqlash so'rovi; o'z taklifi bo'yicha alohida suhbat taklifi", weight: 2}
      - {id: no_disclosure, description: "Madinaning oyligi yoki boshqa ma'lumoti muhokama qilinmagan va tasdiqlanmagan; maosh oshirish yoki kompensatsiya va'da qilinmagan; aybni aniq xodimga yuklamagan", weight: 2}
      - {id: madina_notice, description: "Madinaga: nima oshkor bo'lgan (manzil, pasport seriyasi, oylik), bitta nomzodga, qanday choralar ko'rildi, aloqa uchun shaxs; hodisa kichraytirilmagan", weight: 1.5}
      - {id: internal_steps, description: "Ichki: 1 soat ichida HR boshlig'i va ma'lumotlar himoyasi mas'uliga, incident reyestri, 3 ish kunida sabab tahlili va yuborishdan oldin ikkinchi tekshiruv"}
      - {id: tone, description: "Xotirjam, hurmatli, qisqa; Laylo'ning savoliga himoyaviy yoki bahsli ohang yo'q"}
    hints:
      - "Sizib chiqish tartibidagi 4 qadamni sanab chiqing va har biriga kim mas'ulligini yozing."
      - "Laylo'ning maosh haqidagi savoliga nima deyish mumkin, nima mumkin emas — tartibning oxirgi bandini o'qing."
    reference_answer: |
      Laylo'ga: Laylo opa, xatimiz xato bilan sizga yuborilgani uchun uzr so'raymiz. Iltimos, uni va ilovalarini o'chirib,
      hech kimga yubormaganingizni javob xatida tasdiqlang. Boshqa nomzod shartlarini muhokama qila olmaymiz; taklifingiz
      ombor hisobchisi lavozimi bo'yicha — savollaringiz bo'lsa, ertaga qulay vaqtda alohida gaplashamiz.
      Madinaga: Madina opa, bugun 15:05 da sizga tayyorlangan taklif xati (F.I.Sh., telefon, manzil, pasport seriyasi, oylik)
      xato bilan bitta boshqa nomzodga yuborildi. Qabul qiluvchidan o'chirish va tasdiqlashni so'radik, holatni ma'lumotlar
      himoyasi mas'uli bilan tekshiryapmiz. Uzr so'raymiz; savollar uchun — Dilnoza Rahimova, HR boshlig'i.
      Ichki: 16:05 gacha Dilnoza opa va IT xavfsizlikka, incident reyestri; Laylo tasdig'ini kuzatish; 3 ish kunida
      sabab tahlili, ommaviy yuborishdan oldin ikkinchi tekshiruv. Aytilmaydi: Madinaning oyligi, kim aybdor, kompensatsiya.

