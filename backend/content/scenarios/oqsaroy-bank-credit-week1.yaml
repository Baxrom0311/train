      8 — faqat tijorat taklifi, shartnoma/hisob-faktura kerak; 9 — taqiq reestri ko'chirmasi, yuk mashinasi bahosi;
      10 — Malika Tojiboyevaning notarial roziligi (uy umumiy mulk); 11 — Anvar (70%) va Malika (30%) shaxsiy kafillik loyihasi
      (faqat «Bodomzor Savdo» taklif qilingan).
      Eski: balans 30.06.2026 — 101 kun (> 90), 30.09 holatiga kerak; soliq ma'lumotnomasi 14.08 — 56 kun (> 30);
      uy bahosi 15.12.2025 — 6 oydan eski. Ziddiyat: arizada faqat lizing, byuroda Kumush Vodiy Bank krediti 392 mln (24 mln/oy) ham bor;
      2025-noyabrda 9 kun kechikish (siyosat chegarasidan past, lekin izoh so'raladi).
      Xat: "Hurmatli Anvar aka, arizangizni ko'rib chiqish uchun quyidagi hujjatlar kerak: ... Iltimos, 14.10 gacha yuboring.
      Hujjatlar to'liq bo'lgach tahlil davom etadi; qaror kredit qo'mitasida qabul qilinadi."

