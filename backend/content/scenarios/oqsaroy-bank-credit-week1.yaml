      2) bog'liq shaxslar va kompaniyalar ro'yxati — har biri nega bog'liq; 3) kredit jarayoniga ta'sir qiladigan
      xavflar (manfaatlar to'qnashuvi, guruh ichidagi kafillik) va siyosatning qaysi bandi qo'llanadi.
    attachments: [doc_kyc, doc_credit_policy]
    answer_types: [text]
    due_in_minutes: 150
    competencies: [technical, communication]
    rubric:
      - {id: ubo, description: "Benefitsiar egalar: Anvar Tojiboyev (70%) va Malika Tojiboyeva (30%) — ikkalasi ≥ 25%"}
      - {id: group, description: "«Bodomzor Savdo» — umumiy ta'sischi (Anvar 100%), asosiy sotuvchi (~40% savdo) — guruh sifatida tahlil qilish kerakligi aytilgan", weight: 2}
      - {id: related_employee, description: "Sherzod Tojiboyev — bank xodimining ukasi: ariza bog'liq shaxs (9-band), faqat qo'mitada, Sherzod jarayondan chetda va ma'lumot olmaydi", weight: 2}
