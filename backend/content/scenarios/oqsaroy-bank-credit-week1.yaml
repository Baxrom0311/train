  - key: doc_committee_questions
    title: "Kredit qo'mitasi: «Bodomzor Mebel» bo'yicha a'zolarning oldindan savollari"
    content: |
      1. (Risk direktori) DSCR siyosatdan past bo'lsa, nega ijobiy (yoki shartli) tavsiya? Raqam bilan.
      2. (Risk direktori) «Bodomzor Savdo» debitorligi va 7-band kafilligi — biz qanday himoyalanamiz?
      3. (Garov bo'limi) Nega ishlab chiqarish binosi ta'minotga kiritilmagan? Uskuna yetkazilguncha ta'minot qancha?
      4. (Raisning o'rinbosari) Bugun ertalab mijoz bo'yicha kelgan signal qarorga qanday ta'sir qiladi?
      5. (Compliance) Bog'liq shaxs masalasi — jarayon qanday himoyalangan?
      6. (Monitoring) Kredit berilsa, qaysi kovenantlar va ogohlantiruvchi signallar kuzatiladi, qanchalik tez-tez?

  - key: doc_savdo_default
    title: "Shoshilinch: qo'mita oldidan yangilangan byuro ko'chirmasi va Kumush Vodiy Bank xati"
    content: |
      Byuro (bugun 09:40, kafillar bo'yicha yangi bo'lim):
      «Bodomzor Mebel» — «Bodomzor Savdo» kreditiga kafil. Kreditor: Kumush Vodiy Bank.
      Asosiy qarz qoldig'i: 748 mln so'm. Muddati o'tgan: 72.5 mln so'm (2 oylik to'lov), kechikish 47 kun.

      Kumush Vodiy Bank'ning «Bodomzor Mebel»ga xati (nusxasi mijozdan, 09:55):
      "Asosiy qarzdor «Bodomzor Savdo» MChJ to'lovlarni 47 kun kechiktirdi. Kafillik shartnomasining 4.2-bandiga
      ko'ra 10 bank kuni ichida muddati o'tgan 72.5 mln so'm va peni to'lanishini talab qilamiz. To'lanmasa,
      butun qoldiqni muddatidan oldin undirish huquqimiz saqlanadi."

      Kredit qo'mitasi bugun 15:00 da. Memo kotibda.

  - key: doc_tax_alert
    title: "Monitoring signali: «Bodomzor Mebel» hisobidan soliq inkassosi"
    content: |
      Bugun 09:35: «Bodomzor Mebel»ning Oqsaroy Bank'dagi hisobidan soliq organining inkasso topshirig'i
      bo'yicha 46 mln so'm (QQS qarzi va peni, 2026-iyul davri) so'zsiz yechildi.
      Hisob qoldig'i: 264 mln so'm (oldin 310 mln).
      Mijozning izohi (telefon): "Xaridorning hisob-fakturasi noto'g'ri tasdiqlangan, akt-sverka qilyapmiz,
      pul qaytadi." Hujjat hali berilmagan.
      Eslatma: arizadagi soliq qarzi yo'qligi ma'lumotnomasi 14.08.2026 sanali.
      Kredit qo'mitasi bugun 15:00 da. Memo kotibda.

  - key: doc_monitoring_policy
    title: "Kredit monitoringi va zaxiralar (ichki, o'quv versiyasi)"
    content: |
      Zaxira (provision) sinflari — kechikish kunlari bo'yicha, qarz qoldig'idan:
      sinf | kechikish | zaxira stavkasi
      1 | 0 kun | 1%
      2 | 1–30 kun | 5%
      3 | 31–90 kun | 25%
      4 | 91+ kun | 50%
      Ogohlantiruvchi signal bo'lsa (kechikish bo'lmasa ham) qarz oluvchi kuzatuv ro'yxatiga (watchlist)
      olinadi va bir sinf yuqoriroq zaxira qo'llanadi (4-sinfdan yuqori yo'q).
      Ogohlantiruvchi signallar: hisob aylanmasining 3 oy ketma-ket ≥ 30% pasayishi; soliq inkassosi yoki
      hisobga to'siq; direktor yoki asosiy ta'sischi almashuvi; kovenant buzilishi (shu jumladan hisobotning
      30+ kun kechikishi); sud da'vosi; bog'liq shaxs yoki kafolatlangan qarzdor bo'yicha kechikish.
