      Mebel savdosining ~40% i) — guruh; Sherzod Tojiboyev — Anvarning ukasi, Oqsaroy Bank Zangiota filiali kredit menejeri.
      Xavflar: 1) bog'liq shaxs (9-band) — faqat kredit qo'mitasi, imtiyozsiz, Sherzod jarayonda qatnashmaydi va ma'lumot olmaydi;
      2) Savdo kafilligi guruh ichida — 7-band bo'yicha mustaqil himoya emas, Anvar va Malikaning shaxsiy kafilligi talab qilinadi;
      3) guruh ichidagi savdo va qarzlar — Savdo hisobotini ham so'rash, Mebel bilan o'zaro qarz/kafilliklarni tekshirish. PEP va sanksiya — yo'q.

