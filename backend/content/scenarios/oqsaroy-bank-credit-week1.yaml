documents:
  - key: doc_onboarding
    title: "Kichik va o'rta biznes kreditlash bo'limi: onboarding"
    content: |
      Oqsaroy Bank — Toshkentdagi xususiy tijorat banki. Bo'lim kichik va o'rta biznesga kredit beradi.
      Jamoa: Gulnora Azimova (bo'lim boshlig'i), Feruza Saidova (katta tahlilchi, mentor), 4 tahlilchi.
      KYC, AML va manfaatlar to'qnashuvi savollari — Compliance (Jasur Ergashev).
      Departament direktori — Rustam Nazarov.

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Har kuni 09:00 da standup (yozma):
      kecha nima qildim / bugun nima qilaman / nima to'sib turibdi. 3–5 qator. 17:30 da kun yakuni.

      Asosiy qoidalar:
      - Tahlilchi kreditni tasdiqlamaydi va mijozga va'da bermaydi. Qarorni limit bo'yicha bo'lim boshlig'i
        (500 mln so'mgacha) yoki kredit qo'mitasi (500 mln dan yuqori) qabul qiladi.
      - Tahlil raqamlari o'zgartirilmaydi. Siyosatdan chetlashish faqat ochiq "istisno so'rovi" sifatida,
        sabab va himoya choralari bilan, qo'mita orqali.
      - Mijoz ma'lumoti va tahlil qoralamalari faqat bank ichki tizimlarida; shaxsiy messenjerga yuborilmaydi,
        arizaga aloqasi yo'q xodimlarga ko'rsatilmaydi.
      - Mijozdan sovg'a, mehmondorchilik yoki xizmat qabul qilish taqiqlanadi. Mijoz bilan tanishlik yoki
        qarindoshlik bo'lsa — darhol rahbarga yoziladi (manfaatlar to'qnashuvi).
      - Har xulosa: raqamlar + qaysi siyosat bandiga asoslangani + tavsiya va shartlar.

  - key: doc_credit_policy
    title: "O'rta biznes investitsion kredit siyosati (ichki, o'quv versiyasi)"
    content: |
      1. Mahsulot: asbob-uskuna sotib olish uchun investitsion kredit. Stavka yillik 24%, annuitet.
         Muddat 48 oygacha. Annuitet: to'lov = S × r / (1 − (1 + r)^−n), r = yillik / 12, n — oylar soni.
      2. O'z ulushi: loyiha qiymatining kamida 20% i, kredit berilishidan OLDIN to'lanadi, manbasi tasdiqlanadi.
      3. DSCR = qarzga xizmat ko'rsatish uchun pul oqimi (CFADS) / qarz to'lovlari. Talab: DSCR ≥ 1.25.
         CFADS = EBITDA − to'langan foyda solig'i. EBITDA = yalpi foyda − operatsion xarajatlar
         (amortizatsiyasiz). Bir martalik (takrorlanmaydigan) daromad va xarajatlar EBITDA'ga kirmaydi.
         Foiz xarajatlari CFADS'dan ayrilmaydi — ular qarz to'lovlari tarkibida (maxrajda).
         Qarz to'lovlari = ariza sanasidagi barcha mavjud oylik to'lovlar (qolgan muddatidan qat'i nazar)
         + yangi kredit annuiteti. Hisob oylik yoki yillik — bir xil asosda.
      4. Joriy likvidlik = joriy aktivlar / joriy majburiyatlar ≥ 1.2. Bog'liq shaxslarning muddati
         90 kundan ortiq o'tgan debitorligi joriy aktivlardan chiqariladi.
      5. Shartli majburiyatlar: qarz oluvchi uchinchi shaxs (ayniqsa bog'liq shaxs) krediti uchun kafil bo'lsa,
         stress-DSCR hisoblanadi — kafolatlangan kreditning oylik to'lovi maxrajga qo'shiladi. Stress-DSCR < 1.0
         bo'lsa, memo'da alohida xavf sifatida ko'rsatiladi va qo'mita kovenant yoki qo'shimcha himoya talab qiladi.
      6. Ta'minot: tan olinadigan qiymat = bozor bahosi × diskont: ko'chmas mulk 0.7, yangi uskuna 0.6,
         ishlatilgan uskuna 0.4, transport 0.5. Ta'minot koeffitsienti = tan olinadigan qiymat / kredit ≥ 1.2.
         Boshqa bankda garovda turgan mulk (ikkinchi navbat) hisobga olinmaydi. Oilaviy mulk garovi uchun
         turmush o'rtog'ining notarial roziligi shart. Sotib olinadigan uskuna garovi yetkazilgandan keyin
         30 kun ichida rasmiylashtiriladi.
      7. Kafillik: ulushi ≥ 25% bo'lgan har bir ta'sischining shaxsiy kafilligi majburiy. Bog'liq kompaniya
         kafilligi mustaqil himoya hisoblanmaydi.
      8. Kredit tarixi: oxirgi 12 oyda 30 kundan ortiq kechikish — standart tasdiqlash yo'q.
      9. Bog'liq shaxs: bank xodimi yoki uning yaqin qarindoshi (ota-ona, aka-uka, opa-singil, turmush o'rtog'i,
         farzand) bilan bog'liq mijoz. Ariza faqat kredit qo'mitasida, imtiyozli shartlarsiz; bog'liq xodim
         jarayonda qatnashmaydi va ariza ma'lumotini olmaydi.
      10. Biror talab bajarilmasa tahlilchi rad etishni yoki shartlarni (summa, muddat, garov, kovenant)
          tavsiya qiladi va ularni raqam bilan asoslaydi.

  - key: doc_required_docs
    title: "O'rta biznes investitsion krediti: majburiy hujjatlar ro'yxati"
    content: |
      1. Ariza (direktor imzosi, barcha mavjud kreditlar va kafilliklar ko'rsatilgan).
      2. Ustav va davlat ro'yxatidan o'tganlik guvohnomasi.
      3. Ta'sischilarning kredit va garov olish haqidagi qarori (bayonnoma).
      4. Oxirgi 2 yillik moliyaviy hisobot (oxirgi yil — auditorlik xulosasi bilan), izohlari bilan.
      5. Oxirgi chorak balansi va moliyaviy natijalar hisoboti — ariza sanasida 90 kundan eski emas.
      6. Barcha banklardagi hisob raqamlari bo'yicha 12 oylik aylanma ko'chirmasi.
      7. Soliq qarzi yo'qligi haqida ma'lumotnoma — 30 kundan eski emas.
      8. Loyiha hujjatlari: yetkazib beruvchi bilan shartnoma yoki hisob-faktura (tijorat taklifi yetarli emas).
      9. Garov: mulk huquqi hujjati, mustaqil baholash hisoboti (6 oydan eski emas), taqiq reestri ko'chirmasi.
      10. Oilaviy mulk garovi — turmush o'rtog'ining notarial roziligi.
      11. Ulushi ≥ 25% ta'sischilar: pasport nusxasi va shaxsiy kafillik shartnomasi loyihasi.
      12. Kredit byurosi ma'lumotini olishga rozilik.

  - key: doc_application_package
    title: "«Bodomzor Mebel» MChJ: ariza va taqdim etilgan hujjatlar (09.10.2026)"
    content: |
      Mijoz: «Bodomzor Mebel» MChJ, korpus mebel ishlab chiqarish, Toshkent viloyati Zangiota tumani,
      9 yil faoliyat, 86 xodim. Ta'sischilar: Anvar Tojiboyev (70%), Malika Tojiboyeva (30%).
      So'ralgan kredit: 1 800 000 000 so'm, 36 oy. Maqsad: CNC ishlov berish liniyasi (loyiha qiymati
      2 250 mln so'm, yetkazib beruvchi «Texnomash Servis» MChJ). O'z ulushi: 450 mln so'm.
      Arizada "mavjud kreditlar": «Yashil Lizing» MChJ, lizing, 18 mln so'm/oy. Boshqa kreditlar va kafilliklar
      ko'rsatilmagan. Taklif qilingan kafil: «Bodomzor Savdo» MChJ.

      Taqdim etilgan hujjatlar:
      № | hujjat | sana / holat
      1 | Ariza | 09.10.2026, imzolangan
      2 | Ustav, guvohnoma | bor
      3 | Ta'sischilar qarori | yo'q
      4 | 2024 va 2025 yillik hisobot | 2025 — «Ishonch Audit» MChJ xulosasi bilan, izohlarsiz
      5 | Choraklik balans | 30.06.2026 holatiga
      6 | Hisob ko'chirmasi | faqat Oqsaroy Bank, 12 oy
      7 | Soliq qarzi yo'qligi ma'lumotnomasi | 14.08.2026
      8 | CNC liniya | «Texnomash Servis» tijorat taklifi, 2 250 mln, amal qiladi 31.10.2026 gacha
      9a | Garov: ishlab chiqarish binosi | kadastr ko'chirmasi; baholash 20.05.2026 — 1 400 mln
      9b | Garov: direktorning uyi (Anvar va Malika umumiy mulki) | kadastr; baholash 15.12.2025 — 950 mln
      9c | Garov: yuk mashinasi (2021) | texpasport; baholash yo'q
      9d | Taqiq reestri ko'chirmasi | yo'q
      10 | Turmush o'rtog'i roziligi | yo'q
      11 | Pasportlar | Anvar, Malika — bor; kafillik loyihasi — faqat «Bodomzor Savdo» nomidan
      12 | Byuro roziligi | bor

  - key: doc_bureau
    title: "Kredit byurosi ko'chirmasi: «Bodomzor Mebel» MChJ (10.10.2026)"
    content: |
      Joriy majburiyatlar:
      kreditor | turi | qoldiq | oylik to'lov | qolgan muddat | holat
      Kumush Vodiy Bank | aylanma kredit | 392 mln | 24 mln | 20 oy | joriy
      Yashil Lizing MChJ | lizing | 85 mln | 18 mln | 5 oy | joriy
      Kechikishlar (oxirgi 24 oy): 2025-noyabr — 9 kun (Kumush Vodiy Bank), to'liq to'langan.
      Byuro reytingi: A− (yaxshi). Kafil sifatidagi majburiyatlar byuroga hali uzatilmaydi.

  - key: doc_kyc
    title: "KYC anketasi: «Bodomzor Mebel» va bog'liq shaxslar"
    content: |
      A) Anvar Tojiboyev. «Bodomzor Mebel» direktori va ta'sischisi
        Ulush: 70%
        Boshqa biznes: «Bodomzor Savdo» MChJ — 100% ta'sischi va direktor
        PEP: yo'q. Sanksiya ro'yxatlari: mos kelish yo'q
        Telefon orqali ma'lum qilgan: "Savdo — alohida firma, mebelni do'konlarda sotadi"
      B) Malika Tojiboyeva. «Bodomzor Mebel» ta'sischisi, Anvar Tojiboyevning turmush o'rtog'i
        Ulush: 30%
        Lavozim: bosh hisobchi
        PEP: yo'q. Sanksiya ro'yxatlari: mos kelish yo'q
      C) «Bodomzor Savdo» MChJ. Mebel chakana savdosi, 4 ta do'kon
        Ta'sischi: Anvar Tojiboyev (100%)
        Hisob raqami: Kumush Vodiy Bank
        «Bodomzor Mebel» mahsulotining asosiy sotuvchisi (Mebel savdosining ~40% i)
        Arizada kafil sifatida taklif qilingan
      D) Sherzod Tojiboyev. Anvar Tojiboyevning ukasi
        Ish joyi: Oqsaroy Bank, Zangiota filiali, kredit menejeri
        Bodomzor arizasiga rasmiy aloqasi yo'q

