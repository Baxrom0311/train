  - id: cashflow_dscr
    type: task
    day: 2
    at: "09:30"
    from: gulnora
    brief: |
      Bodomzor bo'yicha asosiy tahlil. Siyosat bo'yicha hisoblang va ko'rsating: 1) CFADS (yillik va oylik) —
      nima kirdi, nima kirmadi va nega; 2) yangi kredit to'lovi (1 800 mln, 36 oy) va DSCR; 3) joriy likvidlik —
      nominal va siyosat bo'yicha tuzatilgan; 4) hisobot izohlaridagi xavflar va stress-DSCR; 5) siyosatga mos
      keladigan struktura (summa yoki muddat) va xulosa. Jadval yoki Excel fayl bo'lishi mumkin.
    attachments: [doc_credit_policy, doc_financials, doc_bureau]
    answer_types: [text, file]
    due_in_minutes: 240
    weight: 3
    competencies: [technical]
    rubric:
      - {id: cfads, description: "CFADS to'g'ri: EBITDA 4 200 − 2 310 = 1 890; bir martalik 540 kiritilmagan; − soliq 302 = 1 588 mln/yil ≈ 132.3 mln/oy. Sof foyda + amortizatsiya (2 008) yoki 540 bilan EBITDA ishlatilmagan", weight: 2.5}
      - {id: dscr, description: "To'lov ≈ 70.6 mln/oy (±1%); maxraj 24 + 18 + 70.6 ≈ 112.6; DSCR ≈ 1.18 < 1.25 — bajarilmaydi (lizing qolgan muddatidan qat'i nazar kiritilgan)", weight: 2.5}
      - {id: liquidity, description: "Joriy likvidlik nominal 4 200 / 2 600 ≈ 1.62; Savdo debitorligi 1 180 (140 kun) chiqarilsa 3 020 / 2 600 ≈ 1.16 < 1.2 — bajarilmaydi", weight: 2}
      - {id: contingent, description: "7-band kafillik (≈36.3 mln/oy) topilgan: stress-DSCR ≈ 0.89 < 1.0; Savdo debitorligi va kafillik bitta guruh xavfi sifatida bog'langan", weight: 2}
      - {id: structure, description: "Struktura raqam bilan: 48 oy → to'lov ≈ 58.7, DSCR ≈ 1.31; yoki 36 oyda summa ≈ 1 628 mln gacha; likvidlik uchun Savdo'dan ≥ 100 mln undirish sharti", weight: 2}
      - {id: conclusion, description: "Xulosa aniq: so'ralgan shartlarda siyosat bajarilmaydi; qaysi shartlar bilan qo'mitaga chiqarish mumkinligi va qaysi xavf ochiq qolishi"}
    hints:
      - "Avval EBITDA'ni siyosat ta'rifi bo'yicha toping. Hisobotdagi qaysi qator 'takrorlanmaydi'? Foiz xarajati qayerda hisobga olinadi?"
      - "Maxrajga byurodagi ikkala mavjud to'lovni ham qo'shing — arizada ko'rsatilmagani ham. Lizing 5 oyda tugashi siyosat bo'yicha ahamiyatga egami?"
      - "Balansdagi debitorlikning tarkibiga va izohlarning 5- va 7-bandlariga qarang: ular bir-biriga qanday bog'liq?"
    reference_answer: |
      CFADS: yalpi foyda 4 200 − operatsion xarajatlar 2 310 = EBITDA 1 890 (omborni sotishdan 540 — bir martalik, kirmaydi;
      amortizatsiya xarajatlar ichida emas). − to'langan soliq 302 = 1 588 mln/yil ≈ 132.3 mln/oy.
      Yangi to'lov: 1 800 × 0.02 / (1 − 1.02^−36) ≈ 70.6 mln/oy. Qarz to'lovlari: Kumush Vodiy 24 + lizing 18 + 70.6 = 112.6.
      DSCR ≈ 132.3 / 112.6 ≈ 1.18 < 1.25 — bajarilmaydi. (Xato yo'llar: sof foyda + amortizatsiya → 1.49; 540 bilan → 1.57.)
      Likvidlik: 4 200 / 2 600 ≈ 1.62; Savdo debitorligi 1 180 (140 kun) chiqarilsa 3 020 / 2 600 ≈ 1.16 < 1.2 — bajarilmaydi;
      1.2 uchun Savdo'dan kamida 100 mln undirilishi kerak.
      7-band: Mebel Savdo'ning 900 mln kreditiga kafil (≈36.3 mln/oy). Stress-DSCR = 132.3 / (112.6 + 36.3) ≈ 0.89 < 1.0.
      Savdo Mebel'ga 1 180 mln qarz va o'zi Mebel kafilligida — bitta guruh xavfi; arizada kafillik ham, Kumush krediti ham yashirilgan.
      Struktura: 48 oy — to'lov ≈ 58.7, DSCR ≈ 132.3 / 100.7 ≈ 1.31 (stress ≈ 0.97); yoki 36 oyda maksimal summa ≈ 1 628 mln.
      Xulosa: so'ralgan shartlarda tasdiqlab bo'lmaydi. Qo'mitaga 48 oy bilan, shartlar: Savdo'dan ≥ 100 mln undirish (likvidlik),
      Savdo hisobotlari va to'lov intizomi tekshiruvi, yangi kafillik bermaslik kovenanti. Guruh xavfi memo'da alohida.

