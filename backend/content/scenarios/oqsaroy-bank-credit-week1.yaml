    hints: ["Memo muddatidan orqaga sanab, garov tahlilini qachon tugatish kerakligini yozing."]
    reference_answer: "Kecha: CFADS 1 588, DSCR 1.18, likvidlik 1.16, stress-DSCR 0.89. Bugun: garov va kafillik 12:00 gacha, memo 17:15 gacha. To'siq: Malika roziligi va taqiq reestri."

  - id: collateral_analysis
    type: task
    day: 3
    at: "09:30"
    from: gulnora
    brief: |
      Garov va kafillik tahlili. Yangilangan garov paketi bo'yicha: 1) har garovning tan olinadigan qiymati va
      ta'minot koeffitsienti; 2) qaysi garov hisobga olinmaydi va nega; 3) uskuna yetkazilgunga qadar (6–8 hafta)
      ta'minot qancha va bu oraliq xavfni qanday yopish mumkin; 4) kafillar — kim talab qilinadi, kim himoya bermaydi.
    attachments: [doc_collateral, doc_credit_policy]
    answer_types: [text, file]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    rubric:
      - {id: values, description: "Tan olinadigan qiymatlar: CNC 2 250 × 0.6 = 1 350; uy 1 000 × 0.7 = 700; yuk mashinasi 260 × 0.5 = 130; jami 2 180", weight: 2}
      - {id: building, description: "Bino Kumush Vodiy Bank'da birinchi navbatli garovda — hisobga olinmaydi (bino bilan 1.76 — noto'g'ri)", weight: 2}
      - {id: ratio, description: "Ta'minot 2 180 / 1 800 ≈ 1.21 ≥ 1.2 — bajariladi, lekin zaxirasi juda kichik; uy uchun Malika roziligi sharti", weight: 1.5}
      - {id: interim, description: "Oraliq davr: uskunasiz 830 / 1 800 ≈ 0.46 — to'lov to'g'ridan-to'g'ri yetkazib beruvchiga, uskuna garovi 30 kun ichida, yoki bosqichma-bosqich berish", weight: 1.5}
      - {id: guarantors, description: "Savdo kafilligi guruh ichida va o'zi Mebel'ga 1 180 qarzdor — himoya emas; Anvar (70%) va Malika (30%) shaxsiy kafilligi majburiy"}
    hints:
      - "Har garovni jadvalga yozing: bozor bahosi → diskont → tan olinadigan qiymat → hisobga olinadimi."
      - "Taqiq reestri ustunini o'qing: boshqa bank birinchi navbatda bo'lsa, siyosat nima deydi?"
      - "Uskuna hali yo'q paytda bankning qo'lida qaysi garovlar qoladi?"
    reference_answer: |
      CNC liniya: 2 250 × 0.6 = 1 350 (yetkazilgach rasmiylashtiriladi). Uy: 1 000 × 0.7 = 700 (yangi baho, Malikaning notarial roziligi shart).
      Yuk mashinasi: 260 × 0.5 = 130. Bino (1 400 → 980) — 03.12.2025 dan Kumush Vodiy Bank'da birinchi navbatda, hisobga olinmaydi.
      Jami 2 180 / 1 800 ≈ 1.21 ≥ 1.2 — bajariladi, zaxira ~20 mln. Bino qo'shilsa 1.76 bo'lardi — bu xato.
