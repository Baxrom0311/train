  - key: doc_funnel_history
    title: "Yollash voronkasi: tarixiy konversiyalar (2025–2026)"
    content: |
      bosqich | operator | qadoqlovchi
      Ariza → telefon saralashidan o'tdi (intervyuga taklif) | 50% | 70%
      Taklif qilingan → intervyuga keldi | 80% | 80%
      Intervyu → ish taklifi | 40% | 60%
      Ish taklifi → qabul qildi | 75% | 85%
      Qabul qildi → 1-kuni ishga chiqdi | 90% | 90%

      Rejalash qoidasi: kerakli son oxirgi bosqichdan orqaga hisoblanadi, HAR BOSQICHDA yuqoriga yaxlitlanadi
      (odam butun bo'ladi).
      Eslatma: 2024-yil mavsumiy yollashda (faqat qadoqlovchilar) ariza → ishga chiqish umumiy konversiyasi 15% bo'lgan.

  - key: doc_channels
    title: "Jalb qilish kanallari, byudjet va intervyu sig'imi (2026-10-20 – 2026-10-31)"
    content: |
      Kanal | narx (2 hafta) | operator arizalari | qadoqlovchi arizalari
      Ishbozor sayti, oddiy e'lon | 1 400 000 | 48 | 10
      Ishbozor sayti, TOP e'lon (oddiy o'rniga) | 2 600 000 | 72 | 14
      "Vodiy Ish" Telegram kanali (2 post) | 700 000 | 32 | 12
      Tuman bandlik markazi yarmarkasi (24.10) | 0 | 18 | 6
      Zavod darvozasidagi banner | 250 000 | 8 | 6
      Ishbozor CV bazasida faol qidiruv | 900 000 | 10 | 2

      Arizalar soni — o'tgan kampaniyalar bo'yicha kutilma. Oddiy va TOP e'lon birga olinmaydi.
      Jalb qilish byudjeti: 3 500 000 so'm (direktor tasdiqlagan, oshirilmaydi).
      Tavsiya dasturi (xodim tavsiyasi) — HR rag'batlantirish fondidan, bu byudjetga kirmaydi; oqimi rejada
      hisobga olinmaydi (zaxira).

      Intervyu sig'imi: asosiy panel (Rustam aka + HR) — kuniga 6 ta intervyu, 26.10–04.11.
      Ikkinchi panel (2-sex smena ustasi + HR mutaxassisi) — kuniga 4 ta, faqat 29.10–04.11 da, so'ralsa.
      Kelmagan nomzod slotni band qilmaydi — sig'im o'tkaziladigan intervyular soniga solishtiriladi.

  - key: doc_referral_rules
    title: "Xodim tavsiyasi dasturi: qoidalar (ichki, o'quv versiyasi)"
    content: |
      1. Bonus: 500 000 so'm har tavsiya qilingan va ishga qabul qilingan nomzod uchun, nomzod sinov muddatidan
         (2 oy) o'tgach, sinov tugagan oyning ish haqi bilan to'lanadi.
      2. Bir xodimga chorakda ko'pi bilan 3 ta bonus.
      3. Qatnasha olmaydi: HR xodimlari va shu vakansiya bo'yicha nomzodni baholaydigan rahbarlar.
      4. Tavsiya qiluvchi nomzodning telefonini faqat nomzodning roziligi bilan beradi; tanlov jarayoniga aralashmaydi.
         Tavsiya — ishga qabul kafolati emas: nomzod umumiy tartibda, profil bo'yicha ko'riladi.
      5. Tavsiya HR'ning korporativ shakli orqali (hr@ pochta yoki HR xonasidagi qog'oz shakl).

  - key: doc_data_policy
    title: "Nomzod va xodim ma'lumotlari (ichki, o'quv versiyasi)"
    content: |
      1. Nomzod ma'lumotlari (F.I.Sh., telefon, CV, intervyu baholari va izohlari) faqat shu vakansiya va, nomzod
         roziligi bilan, zaxira bazasi uchun ishlatiladi.
      2. Uchinchi shaxsga (boshqa korxona, agentlik, tanish rahbar) nomzod ma'lumotini berish — faqat nomzodning
         aniq yozma roziligi bilan. "O'zaro almashinuv" kelishuvlari bunga asos bo'lmaydi.
      3. Ruxsat etilgan muqobil: rad etilgan nomzodga boshqa korxona vakansiyasi haqida xabar berish — nomzod o'zi
         murojaat qiladi.
      4. Qoidaga zid so'rov kelsa — muloyim rad va HR boshlig'iga xabar.

  - key: doc_scorecard
    title: "Intervyu scorecard: Gofroliniya operatori — tasdiqlangan"
    content: |
      Mezon | og'irlik
      K1 Texnik bilim (liniya, sozlash, rejim) | 30%
      K2 Xavfsizlik madaniyati | 25%
      K3 Sifat va diqqat (brakni ko'rish) | 20%
      K4 Jamoada ishlash va smena topshirish | 15%
      K5 Ishonchlilik (intizom, grafikka rioya) | 10%

      Har mezon 1–5 ball, ikki intervyuer alohida baholaydi. Mezon balli = ikki baholovchining o'rtachasi.
      Umumiy ball = Σ og'irlik × mezon balli.
      O'tish: umumiy ≥ 3.5 VA hech bir mezon < 2.5. Stop-mezon: K2 < 3.0 bo'lsa — umumiy balldan qat'i nazar rad.
      Har baho nomzod javobidagi dalil bilan yoziladi. Dalilsiz yoki siyosatning 1–2-bandiga zid asosdagi baho
      hisobga olinmaydi: shu mezon bo'yicha ikkinchi baholovchining bahosi olinadi va HR boshlig'iga xabar beriladi.
      Tavsiya qilingan nomzodga qo'shimcha ball berilmaydi.

