  - key: doc_offer_brief
    title: "Takliflar uchun ma'lumot (2026-10-22)"
    content: |
      Dilnoza opa tasdiqladi: erta to'lqin bo'yicha takliflar scorecard natijasiga ko'ra yuboriladi.
      Ishga chiqish: 2026-11-09 (dushanba). Taklif bugun, 2026-10-22 (payshanba) yuboriladi.
      Tajriba (razryad uchun): Bobur — gofroliniya operatori 2022-09 dan; Zarina — plyonka liniyasi operatori 2025-06 dan;
      Alisher — poligrafiya liniyasi yordamchisi 2024-03 dan.
      Rustam akaning xabari (bugun 09:10): "Zarinaga telefonda qo'lingizga 6.5 mln tegadi dedim, xatni shunga moslab yozing.
      Bobur ham tez kelsin, unga ham 7 mln deb qo'yaylik."

  - key: doc_funnel_status
    title: "Yollash holati va tezkor imkoniyatlar (2026-10-22, 10:00)"
    content: |
      Joriy reja bo'yicha ishga tushgan kanallar: Ishbozor oddiy e'lon (1 400 000) va "Vodiy Ish" 2 post (700 000).
      Ikkinchi panel so'ralmagan. Intervyu kalendari: 26.10–04.11, kuniga 6 slot.

      kanal | 3 kunda kelgan operator arizalari | 31.10 gacha prognoz
      Ishbozor oddiy | 14 | 48
      "Vodiy Ish" | 9 | 32
      Bandlik yarmarkasi (24.10) | — | 18
      Jami | 23 | 98

      Qolgan byudjet: 3 500 000 − 2 100 000 = 1 400 000 so'm.
      Tezkor imkoniyatlar (31.10 gacha qo'shimcha operator arizalari):
      imkoniyat | narx | + arizalar
      Ishbozor e'lonini TOP'ga o'tkazish | 900 000 | 16
      "Vodiy Ish" 3-post | 350 000 | 14
      Ishbozor CV bazasida faol qidiruv | 900 000 | 8
      Darvoza banneri | 250 000 | 5
      "Ishchi Qo'l" yollash agentligi | 1 600 000 har ishga chiqqan operatorga | 5 ish kunida 2 nomzod
      Rustam aka taklifi: GL-2 operatorlarini GL-3 ishga tushganda ketma-ket 2 smena (24 soat) qoldirish.
      Ichki qoida: smena ≤ 12 soat, smenalar orasida ≥ 12 soat dam; agentlik — direktor yozma ruxsati bilan.

  - key: doc_safety_policy
    title: "Yangi xodimni ishga qo'yish: mehnat muhofazasi tartibi (ichki, o'quv versiyasi)"
    content: |
      1. Kirish yo'riqnomasi (2 soat, mehnat muhofazasi muhandisi) — birinchi smenadan OLDIN, jurnalda xodim imzosi bilan.
         Muhandis bo'lmasa — xodim ishga qo'yilmaydi, yo'riqnoma ko'chiriladi yoki zaxira muhandis chaqiriladi.
      2. Ish joyidagi yo'riqnoma (smena ustasi) va 2 smena murabbiy bilan stajirovka.
      3. SHHV (kesilishga chidamli qo'lqop, poyabzal, quloqchin) berilmagan xodim ishga qo'yilmaydi.
      4. Baxtsiz hodisa: birinchi yordam; 1 soat ichida muhandis va sex boshlig'iga; 24 soat ichida HB-1 dalolatnomasi;
         3 ish kuni ichida sabab tahlili va choralar.
      5. HR har yangi xodim uchun "ishga qo'yish varaqasi"ni yuritadi: yo'riqnoma, SHHV, murabbiy — uchala belgi
         bo'lmaguncha xodim smena jadvaliga kiritilmaydi.

  - key: doc_safety_case
    title: "Hodisa va audit: mavsumiy qadoqlovchilar, GL-2 (2026-10-22)"
    content: |
      19.10 da GL-2 ga 5 nafar mavsumiy qadoqlovchi ishga chiqqan (yollashni boshqa HR mutaxassisi qilgan).
      Bugun 09:40 da Sevara Ismoilova taxlash stolida tiqilib qolgan kartonni olayotib karton pichog'i bilan qo'lini kesdi.
      Birinchi yordam ko'rsatildi, tikish kerak bo'lmadi, xodim uyiga yuborildi.

      xodim | kirish yo'riqnomasi imzosi | qo'lqop berilgan | holat
      Sevara Ismoilova | yo'q | yo'q | jarohat, uyda
      Diyor Ergashev | yo'q | ha | 21.10 da "ish menga to'g'ri kelmaydi" deb ketdi
      Muxlisa Karimova | ha | yo'q | ishlayapti
      Nodirbek Salimov | ha | ha | ishlayapti
      Kamola Yo'ldosheva | ha | ha | ishlayapti

      19.10 ertalab muhandis kasal bo'lgan; HR "yo'riqnomani keyin o'tkazamiz" deb 2 xodimni smenaga yuborgan.
      Omborda kesilishga chidamli qo'lqop 2 juft yetmagan. Diyor ketishda: "Ish shunchalik og'ir va issiq
      bo'lishini hech kim aytmagan edi."

  - key: doc_training_reqs
    title: "GL-3 yangi xodimlar o'qitish dasturi: talablar (09.11–13.11)"
    content: |
      Jami 40 soat (har kuni 8 soat, 08:00–17:00, tushlik 12:00–13:00). Yangi xodimlar — 16 kishi.
      modul | soat | qoida
      Kirish yo'riqnomasi | 2 | 1-kun, eng birinchi; o'quv xonasida (12 o'rin)
      SHHV berish va sex bilan tanishuv | 2 | 1-kun; SHHVsiz sexga kirilmaydi
      Mehnat muhofazasi va yong'in xavfsizligi | 6 | yig'ilish zalida (40 o'rin)
      Mehnat muhofazasi imtihoni | 1 | o'quv xonasida; liniyadagi stajirovkadan OLDIN
      Sex tartibi, smena topshirish, 1C smena hisoboti | 2 |
      Sifat va brak | 3 | yig'ilish zalida
      GL-3 nazariyasi (uskuna yetkazib beruvchi muhandisi) | 8 | faqat 11.11 (chorshanba)
      Liniyada stajirovka murabbiy bilan | 15 | faqat 12.11–13.11 (liniya sinov rejimida)
      1-hafta yakuniy suhbat | 1 | 13.11
      Murabbiy (buddy): bir murabbiyga ko'pi bilan 3 yangi xodim, faqat o'z lavozimidagi yangi xodimlarga (operatorga —
      GL-2 operatori, qadoqlovchiga — qadoqlovchi); korxonada ≥ 1 yil; smena ustasi murabbiy bo'lmaydi. Murabbiylikka tavsiya qilinganlar:
      murabbiy | lavozim | korxonada staj
      Ilhom Rasulov | GL-2 operatori | 4 yil
      Dilshod Karimov | GL-2 operatori | 2 yil
      Oybek Saidov | GL-2 operatori | 3 yil
      Akmal Tursunov | 2-sex smena ustasi | 7 yil
      Lola Nurmatova | qadoqlovchi (GL-2) | 2 yil
      Mohinur Qosimova | qadoqlovchi (GL-2) | 3 yil
      Sherali Bozorov | GL-2 operatori | 8 oy
      Nigora Aliyeva | GL-2 operatori | 5 yil
      Jasur Holiqov | GL-2 operatori | 1 yil 6 oy
      Nazorat suhbatlari: 1-kun, 1-hafta oxiri, 30-kun, sinov tugashidan oldin.

  - key: doc_hr_metrics
    title: "HR metrikalari: ma'lumotlar (2-sex, 2026-yil III chorak va shu hafta)"
    content: |
      2-sex shtati: 01.07.2026 — 118 kishi, 30.09.2026 — 124 kishi.
      III chorakda ishdan ketganlar: 9 kishi; shundan o'z xohishi bilan 7, shundan 4 tasi ishga kirganidan keyin 90 kun ichida.
      II chorakda (aprel–iyun) ishga olinganlar: 20 kishi; ulardan 90 kun ichida ketganlar: 6 kishi.
      Erta to'lqin takliflari (22.10): 3 ta; javoblar (23.10, 09:00): Bobur — qabul, Alisher — qabul,
      Zarina — rad ("telefonda boshqa summa aytilgan edi").
      Mavsumiy qadoqlovchilar (19.10 dan, 5 kishi): 1 kishi birinchi haftada ketdi; kirish yo'riqnomasi 3 tasida, qo'lqop 3 tasida.

      Formulalar va maqsadlar (korxona KPI):
      metrika | formula | maqsad
      Kadrlar qo'nimsizligi (chorak) | ketganlar / o'rtacha shtat ((boshi + oxiri) / 2) | yillik hisobda ≤ 20%
      90 kunlik saqlanish | 90 kundan keyin qolganlar / ishga olinganlar | ≥ 85%
      Taklif qabul qilish ulushi | qabul qilinganlar / yuborilgan takliflar | ≥ 80%
      Kirish yo'riqnomasi qamrovi | yo'riqnoma imzolangan / yangi xodimlar | 100%

nodes:
  # ── 1-kun: profil va vakansiya matni ──────────────────────────────
  - id: welcome
    type: message
    day: 1
    at: "09:00"
    from: dilnoza
    brief: |
      Xush kelibsiz! Bu hafta butun bo'lim GL-3 liniyasi bilan yashaydi: 16-noyabrga 16 kishi kerak.
      Bugun — vakansiya matni va zaxira bazasi, ertaga — yollash rejasi, chorshanba — intervyu,
      payshanba — takliflar, juma — onboarding va hisobot.

  - id: standup_d1
    type: task
    day: 1
    at: "09:00"
    from: dilnoza
    brief: "Standup: bugungi rejangizni onboarding formatida yozing (3–5 qator)."
    attachments: [doc_onboarding]
    answer_types: [text]
    due_in_minutes: 20
    weight: 0.5
    competencies: [communication, time_management]
    rubric:
      - {id: format, description: "Formatga mos: reja (muddat bilan) / to'siqlar, 3–5 qator"}
      - {id: concrete, description: "Reja aniq: GL-3 shtati, vakansiya matni, zaxira bazasini saralash", weight: 2}
    hints: ["Birinchi kunda 'kecha' o'rniga nima bilan tanishishingizni yozing va har ishga muddat qo'ying."]
    reference_answer: "Bugun: GL-3 loyihasi va operator profili bilan tanishaman, vakansiya matnini tushlikkacha, zaxira bazasi saralashini 16:00 gacha tayyorlayman. To'siq: HR tizimiga kirish — Shahlo opadan so'rayman."

  - id: mentor_intro
    type: message
    day: 1
    at: "09:15"
    from: shahlo
    brief: |
      Salom! Men Shahlo, shu hafta mentoringizman. Matn yoki hisobni siz uchun yozmayman, lekin qaysi qoidaga
      qarash kerakligini birga topamiz. Hint so'rasangiz bo'ladi — har hint task balini biroz kamaytiradi.

  - id: job_ad
    type: task
    day: 1
    at: "09:30"
    from: rustam
    brief: |
      Salom, HR! E'lon qoralamasini yozib qo'ydim, ertaga saytga chiqsin. Dilnoza opa "HR ko'rib chiqsin" dedi.
      Topshiriq: 1) qoralamadagi siyosatga zid yoki noto'g'ri joylarni sanab, har biriga sabab yozing;
      2) tasdiqlangan profil va ish haqi siyosati asosida Ishbozor uchun to'liq e'lon matnini yozing.
    attachments: [doc_draft_ad, doc_operator_profile, doc_hiring_policy, doc_comp_policy, doc_gl3_project]
    answer_types: [text, file]
    due_in_minutes: 150
    weight: 1.5
    competencies: [communication, technical]
    rubric:
      - {id: bias_found, description: "Kamsituvchi talablar topilgan va olib tashlangan: jins (faqat yigitlar), yosh 20–35, harbiy xizmat, oilaviy holat, propiska, tashqi ko'rinish, 'kasalmand bo'lmasin' (sog'liq) — kamida 6 tasi, siyosat bandi bilan", weight: 2}
      - {id: facts_fixed, description: "Noto'g'ri faktlar tuzatilgan: '8 mln gacha' o'rniga grid bo'yicha 5 400 000–6 000 000 + 15% ustama (6 210 000–6 900 000 gross); 'tajriba shart emas' o'rniga M1 (6 oy liniya yoki texnik ma'lumot); shaxsiy telefon va Telegram/rasm o'rniga korporativ kanal", weight: 2}
      - {id: complete, description: "E'lon to'liq: vazifalar, M1–M2, ish sharoiti (shovqin, issiq, 20 kg, tungi smena), grafik 2/2 12 soat, tibbiy ko'rik qabulda, ishga chiqish 09.11 va o'qitish, ariza muddati 31.10 gacha", weight: 1.5}
      - {id: tone, description: "Ochiq, hurmatli, barcha nomzodlarga qaratilgan til; undov va KATTA harflar suiiste'molisiz"}
    hints:
      - "Qoralamani qator-qator tanlov siyosatining 1–3-bandlari bilan solishtiring: har talab ishning o'ziga kerakmi?"
      - "Ish haqi oralig'ini ish haqi siyosatidan hisoblang: eng past va eng yuqori razryad, ustama bilan."
      - "Ish sharoitini halol yozish — nomzodning keyin ketib qolmasligi uchun ham muhim."
    reference_answer: |
      Muammolar: "faqat yigitlar" (jins), "20–35 yosh" (yosh), "harbiy xizmatni o'tagan" (lavozimga aloqasiz), "uylanmagan" (oilaviy holat),
      "propiska shart" (yashash joyi), "ko'rinishi tartibli" (tashqi ko'rinish), "kasalmand bo'lmasin" (sog'liq — faqat tibbiy ko'rik) — siyosat 1–2.
      "8 mln gacha" — grid'ga zid; "tajriba shart emas" — M1'ga zid; shaxsiy telefon, Telegram'ga rasm — siyosat 3.
      E'lon: Qaldirg'och Qadoq yangi GL-3 gofroliniyasiga 12 gofroliniya operatori qabul qiladi. Vazifalar: agregatni ishga tushirish,
      format almashtirish, rejim va sifat nazorati, smena hisoboti. Talablar: liniyada (operator/yordamchi) ≥6 oy tajriba yoki texnik
      kasb-hunar ma'lumoti; aralash smenaga tayyorlik. Sharoit: 2 kun ish / 2 kun dam, 12 soatlik kunduzgi va tungi smena, shovqin,
      issiq zona, 20 kg gacha yuk; qabulda tibbiy ko'rik. Ish haqi: oklad 5 400 000–6 000 000 + 15% smena ustamasi
      (6 210 000–6 900 000 so'm, soliqlargacha), sinovdan keyin 1 000 000 mukofot. 09.11 dan 5 kunlik pullik o'qitish, murabbiy.
      Ariza: 31.10 gacha hr@ pochta yoki HR telefoni orqali. Barcha nomzodlar profil mezonlari bo'yicha teng ko'riladi.

  - id: lead_ack_ad
    type: message
    after: {node: job_ad, event: submitted, minutes: 15}
    from: dilnoza
    brief: "E'lonni oldim. Rustam akaga qoralamadagi muammolarni o'zim tushuntiraman — siz zaxira bazasiga o'ting."

  - id: reserve_screening
    type: task
    day: 1
    at: "14:00"
    from: shahlo
    brief: |
      Zaxira bazasida 6 ta nomzod bor — erta to'lqin uchun telefon saralashiga kimni chaqiramiz?
      Har nomzod uchun: M1, M2, ball (kim uchun qo'llanadi), qaror va asos. Oxirida saralashga chaqiriladiganlar
      ball bo'yicha tartibda va rad etilganlarga keyingi qadam.
    attachments: [doc_reserve_cards, doc_operator_profile, doc_hiring_policy]
    answer_types: [text, file]
    due_in_minutes: 150
    weight: 2
    competencies: [technical, prioritization]
    rubric:
      - {id: must_haves, description: "Majburiy talab: Gulnora (E) — M2 ✗ (faqat kunduzgi); Farrux (F) — M1 ✗ (ombor, haydovchi, yuklovchi liniya emas, ma'lumot texnik emas); Sanjar (C) — M1 ✓ texnik diplom orqali (amaliyot 4 oy < 6 oy)", weight: 2}
      - {id: scores, description: "Ball to'g'ri: Bobur 7 (3+2+1+1, liniyada 5 yil 7 oy), Ravshan 6 (3+2+0+1, 10 yil 11 oy), Zarina 4 (1+2+1+0, 1 yil 4 oy), Sanjar 1 (0+0+1+0); ±0", weight: 2}
      - {id: shortlist, description: "Telefon saralashiga: Bobur 7, Ravshan 6, Zarina 4; Sanjar 1 < 3 — chaqirilmaydi", weight: 1.5}
      - {id: fairness, description: "Yosh (19, 44), oilaviy holat va farzand, Ravshanning 2021 dan taksida ishlagani rad sababi qilinmagan; Farruxning '5 yil ishlab chiqarish' xulosasi nomuvofiqlik deb qayd etilgan", weight: 1.5}
      - {id: next_steps, description: "Rad etilganlarga keyingi qadam: Gulnora — kunduzgi vakansiya uchun zaxira; Farrux va Sanjar — qadoqlovchi vakansiyasiga taklif yoki zaxira; 3 ish kuni ichida javob"}
    hints:
      - "Avval faqat M1 va M2. M1'da 'YOKI' bor — tajriba yetmasa, ma'lumotga qarang."
      - "Liniyadagi tajribani sanalardan hisoblang va qaysi ish 'liniya' hisoblanishini profildan tekshiring."
      - "Qadoq liniyasi plastik bo'lsa ham qadoq liniyasimi? Profil so'zlariga e'tibor bering."
    reference_answer: |
      A Bobur: M1 ✓, M2 ✓. Liniya 2021-03 – 2026-10 = 5 yil 7 oy → 3; gofro → 2; poligrafiya kolleji → 1; sozlash misoli → 1. Jami 7.
      B Zarina: M1 ✓ (operator 1 yil 4 oy), M2 ✓. 1 + 2 (plastik qadoq liniyasi) + 1 (kimyo texnologiyasi) + 0 = 4. Oilaviy holat e'tiborga olinmaydi.
      C Sanjar: M1 ✓ (amaliyot 4 oy < 6 oy, lekin mexatronika diplomi), M2 ✓. 0 + 0 + 1 + 0 = 1 < 3 → chaqirilmaydi; qadoqlovchiga taklif/zaxira.
      D Ravshan: M1 ✓, M2 ✓. 2010-01 – 2020-12 = 10 yil 11 oy → 3; poligrafiya → 2; ma'lumot umumiy → 0; sozlash → 1. Jami 6.
         2021 dan taksi — rad sababi emas, intervyuda neytral savol.
      E Gulnora: M2 ✗ (faqat kunduzgi) → chaqirilmaydi, ball qo'llanmaydi; kunduzgi vakansiya uchun zaxira.
      F Farrux: M1 ✗ — omborchi, haydovchi, pogruzchik liniya tajribasi emas, ma'lumot texnik emas; "5 yil ishlab chiqarish" — nomuvofiqlik.
         Qadoqlovchi vakansiyasiga taklif qilish mumkin.
      Saralashga: 1) Bobur 7, 2) Ravshan 6, 3) Zarina 4. Qolganlarga 3 ish kuni ichida javob.

  - id: day1_end
    type: day_end
    day: 1
    at: "17:30"
    brief: "1-kun yakuni Dilnoza opaga: nima tayyor, nima ochiq qoldi, ertangi reja (yollash rejasi)."
    competencies: [communication]
    rubric:
      - {id: done, description: "E'lon va zaxira saralashi natijasi aniq (kim saralashga)", weight: 1.5}
      - {id: plan, description: "Ertangi reja: voronka, kanallar, byudjet, intervyu sig'imi"}

  # ── 2-kun: yollash rejasi (kalit) ─────────────────────────────────
  - id: standup_d2
    type: task
    day: 2
    at: "09:00"
    from: dilnoza
    brief: "Standup (2-kun). Shahlo opa kecha kechqurun saralashdagi 3 nomzodga qo'ng'iroq qildi — ertaga intervyu."
    attachments: [doc_onboarding]
    answer_types: [text]
    due_in_minutes: 20
    weight: 0.5
    competencies: [communication, time_management]
    rubric:
      - {id: format, description: "Kecha / bugun / to'siqlar"}
      - {id: concrete, description: "Bugungi reja aniq: yollash rejasi (voronka, kanallar, byudjet, sig'im) muddati bilan", weight: 2}
    hints: ["Rejani qaysi hujjatlar asosida va qachongacha qilasiz?"]
    reference_answer: "Kecha: e'lon matni, zaxira saralashi (Bobur, Ravshan, Zarina). Bugun: yollash rejasi — voronka, kanallar, byudjet, intervyu sig'imi, 12:30 gacha. To'siq: kanal narxlari dolzarbligini Dilnoza opa bilan tekshiraman."

  - id: hiring_plan
    type: task
    day: 2
    at: "09:30"
    from: dilnoza
    brief: |
      GL-3 yollash rejasini tuzing — direktorga shu bilan boraman. Kerak:
      1) har lavozim uchun voronka: nechta ariza, intervyuga taklif, intervyu, ish taklifi, qabul kerak (hisob bilan);
      2) kanallar to'plami: arizalar yetadimi, narxi, byudjetga sig'adimi, nima uchun aynan shu to'plam;
      3) intervyu sig'imi va muddatlar: rejadagi sanalarga sig'amizmi, sig'masa — yechim;
      4) bitta yollash xarajati (cost per hire) va asosiy xavflar.
    attachments: [doc_gl3_project, doc_funnel_history, doc_channels]
    answer_types: [text, file]
    due_in_minutes: 210
    weight: 3
    competencies: [technical, prioritization, time_management]
    rubric:
      - {id: funnel_ops, description: "Operator voronkasi orqaga, har bosqichda yuqoriga: 12 ← 14 qabul ← 19 taklif ← 48 intervyu ← 60 taklif qilingan ← 120 ariza (12/0.108 ≈ 112 — qoidaga zid, qisman)", weight: 2.5}
      - {id: funnel_pack, description: "Qadoqlovchi: 4 ← 5 ← 6 ← 10 intervyu ← 13 ← 19 ariza; 2024-yilgi 15% umumiy konversiya ishlatilmagan", weight: 1.5}
      - {id: channels, description: "TOP'siz barcha kanallar 116 < 120 — yetmaydi; yagona mos to'plam TOP + Telegram + yarmarka: 122 operator, 32 qadoqlovchi arizasi, 3 300 000 so'm ≤ 3 500 000; banner yoki CV bazasi qo'shilsa byudjetdan oshadi (3 550 000 / 4 200 000)", weight: 2.5}
      - {id: capacity, description: "Intervyular 48 + 10 = 58 > asosiy panel sig'imi 8 × 6 = 48; yechim: ikkinchi panel (+5 × 4 = 20 → 68) yoki muddatni oldinga surish", weight: 2}
      - {id: cost_risks, description: "Cost per hire 3 300 000 / 16 = 206 250 so'm; xavf: operator arizalari zaxirasi atigi 2 ta — tavsiya dasturi zaxira sifatida, haftalik nazorat nuqtasi", weight: 1.5}
    hints:
      - "Oxirgi bosqichdan boshlang: 12 kishi ishga chiqishi uchun nechta odam taklifni qabul qilishi kerak? Har bosqichda yuqoriga yaxlitlang."
      - "Avval TOP'siz eng ko'p arizani hisoblang. Yetmasa — TOP bilan qaysi to'plamlar byudjetga sig'adi?"
      - "Sig'imni intervyuga taklif qilinganlar emas, kelganlar soni bilan solishtiring; panel kunlarini sanab chiqing."
    reference_answer: |
      Operator: 12 ishga chiqish / 0.9 = 13.3 → 14 qabul; 14 / 0.75 = 18.7 → 19 taklif; 19 / 0.4 = 47.5 → 48 intervyu; 48 / 0.8 = 60 taklif qilingan;
      60 / 0.5 = 120 ariza. Qadoqlovchi: 4 / 0.9 → 5; 5 / 0.85 → 6; 6 / 0.6 = 10 intervyu; 10 / 0.8 → 13; 13 / 0.7 → 19 ariza.
      Kanallar: oddiy + Telegram + yarmarka + banner + CV bazasi = 116 < 120 — TOP shart. TOP + Telegram + yarmarka = 122 operator / 32 qadoqlovchi,
      2 600 000 + 700 000 + 0 = 3 300 000 so'm (byudjet 3 500 000). Banner qo'shilsa 3 550 000, CV bazasi — 4 200 000: byudjetdan oshadi.
      Sig'im: 58 intervyu, asosiy panel 8 kun × 6 = 48 → 10 ta yetmaydi. Ikkinchi panelni 29.10–04.11 ga so'raymiz (+20, jami 68) — qadoqlovchilar va
      operatorlarning bir qismi. Muddatlar: arizalar 31.10 gacha, intervyular 04.11 gacha, takliflar 06.11 gacha, ishga chiqish 09.11.
      Cost per hire: 3 300 000 / 16 = 206 250 so'm. Xavflar: zaxira atigi 2 ariza — tavsiya dasturini zaxira sifatida ishga tushiramiz,
      23.10 va 28.10 da arizalar soni prognoz bilan solishtiriladi; no-show yuqori bo'lsa — yarmarkada joyida saralash.

