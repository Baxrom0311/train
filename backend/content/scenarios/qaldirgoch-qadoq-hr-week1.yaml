  - id: lead_on_bias
    type: message
    day: 3
    at: "14:00"
    when: {flag: biased_questions}
    from: dilnoza
    brief: |
      Intervyu to'plamida farzand rejasi va kasallik haqida "ixtiyoriy" savollarni ko'rdim. Ixtiyoriy bo'lsa ham bu
      saralash vositasi: javob bermagan nomzod ham shubha ostida qoladi. Siyosatning 1–2-bandi — bunday savol umuman yo'q.
      Savollarni olib tashlaymiz; Rustam aka bilan o'zim gaplashaman.

  - id: interview_scoring
    type: task
    day: 3
    at: "14:30"
    from: shahlo
    brief: |
      Ertalabki 4 intervyu baholari tayyor. Scorecard qoidasi bo'yicha har nomzodning mezon ballari va umumiy
      ballini hisoblang, qoida bo'yicha hisobga olinmaydigan baholarni ajrating va qaror chiqaring: kimga taklif,
      kimga rad (sababi bilan). Dilnoza opaga nimani xabar qilish kerakligini ham yozing.
    attachments: [doc_scorecard, doc_interview_notes, doc_hiring_policy]
    answer_types: [text, file]
    due_in_minutes: 150
    weight: 2
    competencies: [technical, prioritization]
    rubric:
      - {id: invalid_ratings, description: "Zarinaning K1 (R 2 — 'ayol kishi') va K5 (R 2 — 'yosh bolasi bor') baholari dalilsiz/kamsituvchi — hisobga olinmaydi, S bahosi (4) olinadi; Dilnoza opaga xabar", weight: 2.5}
      - {id: totals, description: "Ballar: Bobur 4.25; Zarina 3.825 (noto'g'ri hisobda 3.425); Ravshan 3.925; Alisher 3.5; ±0.01", weight: 2}
      - {id: stop_rule, description: "Ravshan: K2 o'rtachasi 2.5 < 3.0 — stop-mezon, umumiy 3.925 bo'lsa ham rad", weight: 1.5}
      - {id: decision, description: "Taklif: Bobur, Zarina, Alisher (3.5 — chegarada o'tadi, tavsiya qo'shimcha ball bermaydi); rad: Ravshan — xavfsizlik mezoni", weight: 1.5}
    hints:
      - "Avval har mezonda ikki baho o'rtachasini toping, keyin og'irlikka ko'paytiring."
      - "Scorecard'ning oxirgi xatboshisi qaysi baholar hisobga olinmasligini aytadi — izohlarni o'qing."
      - "O'tish shartlari uchta: umumiy ball, eng past mezon va stop-mezon. Har nomzodda uchalasini tekshiring."
    reference_answer: |
      Bobur: 5, 4, 3.5, 4, 4.5 → 0.3·5 + 0.25·4 + 0.2·3.5 + 0.15·4 + 0.1·4.5 = 4.25 → taklif.
      Zarina: R'ning K1 "ayol kishi eplamaydi" va K5 "yosh bolasi bor" — siyosat 1-bandiga zid, dalilsiz → S bahosi: K1 4, K5 4.
      Mezonlar 4, 4, 3.5, 3.5, 4 → 1.2 + 1.0 + 0.7 + 0.525 + 0.4 = 3.825 → taklif (R baholari bilan 3.425 bo'lib, noto'g'ri rad bo'lardi).
      Ravshan: 5, 2.5, 4, 4, 4 → 3.925, lekin K2 2.5 < 3.0 (SHHVni rad etadi, LOTO'ni bilmaydi) → stop-mezon, rad.
      Alisher: 3, 4, 3.5, 4, 3 → 0.9 + 1.0 + 0.7 + 0.6 + 0.3 = 3.5 → chegara, o'tadi; tavsiya ball qo'shmaydi.
      Taklif: Bobur, Zarina, Alisher. Rad: Ravshan (xavfsizlik madaniyati), 3 ish kuni ichida. Dilnoza opaga: Rustam akaning Zarina bo'yicha 2 bahosi
      siyosatga zid — panel uchun qisqa trening va scorecard'da "dalil" ustunini majburiy qilish.

