  - id: interview_kit
    type: task
    day: 3
    at: "09:30"
    from: shahlo
    brief: |
      26.10 dan ommaviy intervyular boshlanadi — hamma panel bir xil savol bersin. Tasdiqlangan scorecard bo'yicha
      intervyu to'plamini tuzing: har mezonga (K1–K5) 2 ta savol (xulq-atvor yoki vaziyat), 1/3/5 ball uchun
      tavsif (nimani eshitsak qaysi ball), 45 daqiqalik intervyu tartibi (vaqt taqsimoti) va taqiqlangan
      savollar ro'yxati — ularning o'rniga nima so'rash mumkinligi bilan.
    attachments: [doc_scorecard, doc_operator_profile, doc_hiring_policy]
    answer_types: [text, file]
    due_in_minutes: 150
    weight: 2
    competencies: [technical, communication]
    rubric:
      - {id: questions, description: "10 ta savol (5 mezon × 2), har biri mezonga mos va ochiq: 'oxirgi marta ... qachon bo'lgan, nima qildingiz' yoki liniya vaziyati", weight: 2}
      - {id: anchors, description: "Har mezon uchun 1/3/5 tavsifi kuzatiladigan xulqda (masalan, K2: 5 — LOTO'ni o'zi aytadi va misol; 1 — SHHVni keraksiz deydi)", weight: 2}
      - {id: rules, description: "Hisob qoidalari kiritilgan: ikki baholovchi o'rtachasi, og'irliklar 30/25/20/15/10, o'tish ≥ 3.5, mezon < 2.5 yo'q, K2 < 3.0 — stop", weight: 1.5}
      - {id: forbidden, description: "Taqiqlangan savollar (homiladorlik/farzand rejasi, yosh, oilaviy holat, sog'liq, harbiy xizmat, propiska) va qonuniy muqobili: grafik va ish talablari bilan tanishganmi", weight: 1.5}
      - {id: timing, description: "45 daqiqa taqsimoti yig'indisi 45 ga teng: tanishuv, 10 savol, nomzod savollari, keyingi qadamlar"}
    hints:
      - "Yaxshi savol nomzodning o'tmishdagi aniq xatti-harakatini so'raydi, 'nima qilardingiz' emas."
      - "Har mezon uchun avval '5 ball' javobni tasavvur qiling, keyin '1 ball' — o'rtasi '3'."
      - "Siyosatning 2-bandida sog'liq o'rniga nima so'rash mumkinligi yozilgan."
    reference_answer: |
      K1: "Oxirgi format almashtirishni bosqichma-bosqich aytib bering"; "Gofrolist qatlamlarga ajralsa nimani tekshirasiz?" 5 — ketma-ketlik va sabab-oqibat, 3 — umumiy, usta yordamida; 1 — bilmaydi.
      K2: "Uskunada tiqilish bo'lsa, qo'l bilan olishdan oldin nima qilasiz?"; "Hamkasbingiz SHHVsiz ishlasa nima qilgansiz?" 5 — LOTO, to'xtatish, xabar; 3 — to'xtatadi, LOTO'ni bilmaydi; 1 — "tez olaman".
      K3: "Brakni qanday aniqlagansiz, misol"; "Namunani qanchada bir tekshirgansiz?" 5 — chastota va o'lchov; 1 — "ko'z bilan".
      K4: "Smenani qanday topshirasiz?"; "Hamkasb bilan kelishmovchilik misoli". K5: "Oxirgi yil grafik buzilgan holat"; "Kechiksangiz kimga va qachon xabar berasiz?"
      Hisob: ikki baholovchi o'rtachasi, Σ (30/25/20/15/10%), o'tish ≥ 3.5, hech bir mezon < 2.5, K2 < 3.0 — rad. Har baho dalil bilan.
      Tartib: 5 tanishuv va ish sharoiti, 30 savollar (10 × 3), 7 nomzod savollari, 3 keyingi qadamlar = 45.
      Taqiqlanadi: homiladorlik/farzand rejasi, yosh, oilaviy holat, sog'liq/kasallik, harbiy xizmat, propiska. O'rniga: "2/2, 12 soatlik
      tungi smena va 20 kg yuk talablari bilan tanishdingizmi, bu grafik sizga mos keladimi?" — sog'liq qabulda tibbiy ko'rik bilan.

  - id: interview_bias
    type: decision
