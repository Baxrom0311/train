      - {id: buddies, description: "Murabbiylar lavozim bo'yicha: 12 operatorga 12 / 3 = 4 (mos 5: Ilhom, Dilshod, Oybek, Nigora, Jasur — bittasi zaxira), 4 qadoqlovchiga 4 / 3 → 2 (Lola, Mohinur); jami 6; Akmal (smena ustasi) va Sherali (8 oy) mos emas", weight: 2}
      - {id: checklist, description: "Ishga qo'yish varaqasi (yo'riqnoma, SHHV, murabbiy) — uchalasisiz jadvalga kiritilmaydi; SHHV 16 kishiga 06.11 gacha", weight: 1.5}
      - {id: retention, description: "Nazorat suhbatlari: 1-kun, 13.11, 30-kun (~09.12), sinov tugashidan oldin (08.01 gacha); realistik ish sharoiti va erta ketish xavfiga chora"}
    hints:
      - "Avval qat'iy sanali modullarni joylashtiring (11.11, 12–13.11), keyin qolganini 09–10.11 ga."
      - "Murabbiylik shartlarini har nomzodga qo'ying: lavozim, staj, rol."
      - "Auditdagi uchta muammo onboarding rejasining qaysi qismida yopiladi?"
    reference_answer: |
      09.11 (du): 08–10 A guruh (8) kirish yo'riqnomasi, B — SHHV va sex bilan tanishuv; 10–12 almashadi; 13–17 mehnat muhofazasi (zal, 4 soat).
