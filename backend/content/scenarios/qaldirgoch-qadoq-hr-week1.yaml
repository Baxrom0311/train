  - id: incident_staffing_gap
    type: incident
    day: 4
    at: "10:00"
    when: {any: [{missed: hiring_plan}, {score_lt: {node: hiring_plan, value: 60}}]}
    from: rustam
    brief: |
      SHOSHILINCH! 3 kunda bor-yo'g'i 23 ta operator arizasi. Shu ketishda 16-noyabrda tungi smena bo'sh qoladi!
      Direktor 45 daqiqada tezkor reja so'rayapti. Men GL-2 yigitlarini ketma-ket ikki smena qoldirishni taklif qildim.
      Yozing: 1) prognoz bo'yicha nechta operator ishga chiqadi va qancha yetmaydi; 2) qolgan byudjetga qaysi
      choralar; 3) intervyu sig'imi; 4) mening taklifim va agentlik bo'yicha javob; 5) direktorga 3–4 qatorlik xulosa.
    attachments: [doc_funnel_status, doc_funnel_history, doc_gl3_project]
    answer_types: [text]
    due_in_minutes: 45
    weight: 2
    competencies: [stress_handling, technical, prioritization]
    rubric:
      - {id: forecast, description: "98 ariza → 49 → 39.2 → 15.7 → 11.8 → ≈ 10.6, ya'ni ~10 operator; 12 dan 2 tasi yetmaydi (smenada 6 talik minimal ekipaj buziladi); 120 gacha 22 ariza kam", weight: 2}
      - {id: recovery, description: "1 400 000 ichida: TOP'ga o'tkazish + Telegram 3-post = 1 250 000, +30 → 128 ≥ 120 (yoki Telegram + CV bazasi = 120 aynan); banner + TOP 119 — yetmaydi", weight: 2}
      - {id: capacity, description: "Intervyular ~58 > 48 slot: ikkinchi panelni darhol so'rash (+20)", weight: 1}
      - {id: refuse_unsafe, description: "Ketma-ket 2 smena (24 soat) — ichki qoidaga zid, rad; agentlik — byudjetdan tashqari, faqat direktor yozma ruxsati bilan zaxira variant", weight: 1.5}
      - {id: exec_summary, description: "Direktorga qisqa: muammo raqamda, chora va narx, keyingi tekshiruv sanasi (28.10)"}
    hints:
      - "Prognozdagi 98 arizani tarixiy konversiyalar bo'yicha oldinga yuring: oxirida nechta odam chiqadi?"
      - "Qolgan byudjetga sig'adigan har juft chorani sanab, qaysi biri 120 ga yetkazishini toping."
      - "Rustam akaning taklifini ichki qoidadagi smena va dam olish chegarasi bilan solishtiring."
    reference_answer: |
      Prognoz: 98 ariza × 0.5 = 49 × 0.8 = 39.2 × 0.4 = 15.7 × 0.75 = 11.8 × 0.9 ≈ 10.6 → ~10 operator, 12 dan 2 kam — tungi smena 6 o'rniga 4 kishi.
      120 uchun 22 ariza yetmaydi. Chora (1 400 000 ichida): Ishbozor TOP'ga o'tkazish (900 000, +16) + "Vodiy Ish" 3-post (350 000, +14) =
      1 250 000 so'm, +30 → 128 ariza; 150 000 qoladi. Tavsiya dasturi zaxira. Intervyu: 58 > 48 — ikkinchi panel 29.10–04.11 (+20).
      Rustam aka taklifi: 24 soatlik ketma-ket smena — qoida (≤ 12 soat, ≥ 12 soat dam) va xavfsizlikka zid, rad. Agentlik (1 600 000/kishi) —
      byudjetdan tashqari, 28.10 da prognoz yetmasa direktorga yozma so'rov bilan.
      Direktorga: "Joriy sur'atda 16.11 ga 10/12 operator. Bugun TOP + 3-post (1.25 mln, byudjet ichida) → 128 ariza, ikkinchi panel. 28.10 da qayta tekshiruv,
      yetmasa — agentlik bo'yicha so'rov."

  - id: incident_safety_induction
    type: incident
    day: 4
    at: "10:00"
    when: {score_gte: {node: hiring_plan, value: 60}}
    from: anvar
    brief: |
      SHOSHILINCH: GL-2 dagi yangi mavsumiy qadoqlovchi Sevara Ismoilova qo'lini kesib oldi. Tekshirsam,
      jurnalda unda kirish yo'riqnomasi yo'q, qo'lqop ham berilmagan. 5 kishining hammasini tekshirdim — ilovada.
      HR sifatida 45 daqiqada yozing: 1) hozir nima qilinadi (kim, qachon); 2) audit raqamlari; 3) sabab;
      4) bu GL-3 ning 16 yangi xodimida takrorlanmasligi uchun nima o'zgaradi.
    attachments: [doc_safety_case, doc_safety_policy]
    answer_types: [text]
    due_in_minutes: 45
    weight: 2
    competencies: [stress_handling, communication, initiative]
    rubric:
      - {id: immediate, description: "Darhol: Muxlisa qo'lqop berilguncha liniyadan olinadi; Sevara qaytguncha va qaytganda yo'riqnoma o'tkaziladi; HB-1 dalolatnomasi 24 soat ichida, sex boshlig'iga xabar; Sevara holatini so'rash", weight: 2}
      - {id: audit_numbers, description: "Audit: yo'riqnoma 3/5 (60%), qo'lqop 3/5 (60%), to'liq qoidaga mos faqat 2/5 (Nodirbek, Kamola); 1 ketgan — erta ketish 20%", weight: 1.5}
      - {id: root_cause, description: "Sabab — jarayon: muhandis yo'qligida yo'riqnoma ko'chirilmagan, ishga qo'yish varaqasi tekshirilmagan, SHHV zaxirasi rejalanmagan; aybdor qidirilmaydi", weight: 1.5}
      - {id: prevention, description: "GL-3 uchun: uchala belgisiz smena jadvaliga kiritmaslik, 16 kishilik SHHV 06.11 gacha omborda, zaxira muhandis; Diyorning so'zi bo'yicha e'lon va intervyuda ish sharoitini oldindan aytish", weight: 1.5}
    hints:
      - "Tartibning 3- va 5-bandi: hozir ham ishlayotganlar orasida kim qoidaga to'liq mos emas?"
      - "Jadvalni ikki ustun bo'yicha sanang va ikkalasi ham bor xodimlarni alohida toping."
      - "Diyorning ketishdagi gapi GL-3 onboardingi uchun nimani o'rgatadi?"
    reference_answer: |
      Darhol: Muxlisa qo'lqop berilguncha liniyadan olinadi (omborga 2 juft so'rov bugun); Sevara holatini so'raymiz, qaytganda ishdan oldin kirish yo'riqnomasi;
      Anvar aka bilan HB-1 dalolatnomasi 23.10 09:40 gacha, Rustam akaga xabar; 3 ish kunida sabab tahlili.
      Audit: yo'riqnoma 3/5 = 60%, qo'lqop 3/5 = 60%, ikkalasi ham — faqat Nodirbek va Kamola (2/5 = 40%). Diyor ketdi — 1/5 = 20% birinchi haftada.
