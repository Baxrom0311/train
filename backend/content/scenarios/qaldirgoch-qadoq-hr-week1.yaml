    brief: |
      09–13 noyabr GL-3 ning 16 yangi xodimi uchun onboarding rejasini tuzing: kunlar bo'yicha dastur (modullar,
      soatlar, guruhlar), murabbiylar ro'yxati (kim mos, kim mos emas — nega), ishga qo'yish varaqasi va nazorat
      suhbatlari. Bu haftadagi mavsumiy qadoqlovchilar auditidan xulosani ham kiriting.
    attachments: [doc_training_reqs, doc_safety_policy, doc_safety_case, doc_gl3_project]
