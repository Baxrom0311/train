  - id: hr_metrics
    type: task
    day: 5
    at: "14:00"
    from: dilnoza
    brief: |
      Direktor uchun 2-sex HR metrikalari: qo'nimsizlik (chorak va yillik hisobda), o'z xohishi bilan ketganlar
      ichida erta ketish ulushi, 90 kunlik saqlanish, erta to'lqin taklif qabuli, mavsumiy qadoqlovchilarda
      yo'riqnoma qamrovi va birinchi hafta ketish. Har birini maqsad bilan solishtiring va 3 ta tavsiya bering.
    attachments: [doc_hr_metrics, doc_safety_case]
    answer_types: [text, file]
    due_in_minutes: 120
    weight: 1.5
    competencies: [technical, communication]
    rubric:
      - {id: turnover, description: "O'rtacha shtat (118 + 124) / 2 = 121; qo'nimsizlik 9 / 121 ≈ 7.4% chorakda, yillik ≈ 29.8% > 20% (9 / 124 = 7.3% — formulaga zid)", weight: 2}
      - {id: retention, description: "90 kunlik saqlanish 14 / 20 = 70% < 85%; o'z xohishi bilan ketganlarning 4 / 7 ≈ 57% i 90 kun ichida (barcha ketganlarning 4 / 9 ≈ 44%)", weight: 1.5}
      - {id: offers_safety, description: "Taklif qabuli 2 / 3 ≈ 66.7% < 80% (sabab — og'zaki va'da); yo'riqnoma qamrovi 3 / 5 = 60% < 100%; birinchi haftada ketish 1 / 5 = 20%", weight: 1.5}
      - {id: recommendations, description: "3 tavsiya raqamlarga bog'langan: onboarding va nazorat suhbatlari (erta ketish), faqat yozma taklif (qabul ulushi), ishga qo'yish varaqasi (100% qamrov)", weight: 1.5}
    hints:
      - "Qo'nimsizlik maxrajini formuladan oling, oxirgi kundagi shtatdan emas. Chorakni yilga qanday o'tkazasiz?"
      - "Har metrikani alohida qatorda: qiymat — maqsad — farq."
    reference_answer: |
      Qo'nimsizlik: 9 / ((118 + 124) / 2 = 121) = 7.4% chorakda, × 4 ≈ 29.8% yillik — maqsad ≤ 20%, oshgan.
      Erta ketish: o'z xohishi bilan 7 tadan 4 tasi 90 kun ichida (≈ 57%; barcha ketganlarning 44%). 90 kunlik saqlanish: 14 / 20 = 70% (maqsad 85%).
      Taklif qabuli: 2 / 3 = 66.7% (maqsad 80%) — Zarina telefondagi og'zaki summa sababli rad etdi.
      Mavsumiy qadoqlovchilar: yo'riqnoma 3 / 5 = 60% (maqsad 100%), birinchi hafta ketish 1 / 5 = 20%.
      Tavsiyalar: 1) GL-3 onboardingi va 1-kun/1-hafta/30-kun suhbatlari — 90 kunlik saqlanishni 85% ga; 2) shartlar faqat yozma taklifda, rahbarlarga qisqa
      yo'riqnoma — qabul ulushi; 3) ishga qo'yish varaqasi va SHHV zaxirasi — yo'riqnoma qamrovi 100%.

