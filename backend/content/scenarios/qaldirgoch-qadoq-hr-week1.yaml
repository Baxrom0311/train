    at: "11:30"
    from: rustam
    brief: |
      Intervyu savollariga ikkita narsa qo'shing: ayollardan yaqin 2 yilda farzand rejasi bormi deb so'raymiz,
      40 dan oshganlardan surunkali kasalligi bormi deb so'raymiz. Liniya ishga tushganda dekret va kasal varaqasi
      menga kerak emas. "Ixtiyoriy savol" deb yozsak, hech kim e'tiroz qilmaydi.
    competencies: [communication, stress_handling]
    options:
