      shubha belgilari, kerak bo'lsa ISOX — 11:30 gacha. Menejer: kontrakt va invoysni solishtirish, mijoz bilan uchrashuv savollari.
      Bog'liqlik: tahlilchi tozalangan tushum uchun Compliance'dan aylanib qaytgan summani oladi; mijozga xatni menejer yozadi,
      Compliance tipping-off yo'qligini tekshiradi. To'siq: taqiq reestri ko'chirmasi hali kelmagan.

  - id: mentor_intro
