      Qiyin bo'lsa "hint" so'rang — har hint task balini biroz kamaytiradi.

  - id: credit_numbers
    type: task
    role: analyst
    day: 1
    at: "09:30"
    from: gulnora
    brief: |
      Arizani siyosat bo'yicha hisoblang: 1) kredit / kontrakt ulushi va maksimal summa; 2) tozalangan tushum
      (6 oylik ko'chirmadan, yillikka) va ariza bilan farq; 3) oylik EBITDA va ICR — so'ralgan va maksimal summa uchun;
      4) ta'minot koeffitsienti; 5) xaridor talabi. Xulosa: qanday summada va qanday shartlar bilan ko'rib chiqish
      mumkin, nima hal bo'lmaguncha qaror yo'q. Aylanib qaytgan tushumni Compliance jamoadoshingiz bilan tekshiring.
    attachments: [doc_export_policy, doc_application, doc_collateral, doc_statement]
    answer_types: [text, file]
    due_in_minutes: 120
    weight: 2
    competencies: [technical]
    rubric:
      - {id: contract_share, description: "Kontrakt 240 000 × 12 500 = 3 000 mln; 2 400 / 3 000 = 80% > 70% — maksimal 2 100 mln", weight: 2}
      - {id: clean_revenue, description: "Tozalangan tushum: 4 860 − 1 800 (Sarvqad, shu kuni YBI'ga qaytgan) = 3 060 mln / 6 oy → ≈ 6 120 mln/yil; ariza 7 200 dan 15% past (> 10%)", weight: 2}
      - {id: icr, description: "Oylik EBITDA 6 120 × 14% / 12 ≈ 71.4 mln; foiz 2 400 → 44.0, ICR ≈ 1.62; 2 100 → 38.5, ICR ≈ 1.85 — bajariladi", weight: 1.5}
      - {id: collateral, description: "Ta'minot: 2 600 × 0.7 + 900 × 0.5 = 2 270; 2 400 uchun 0.95 < 1.0, 2 100 uchun 1.08 — reestr ko'chirmasi kelguncha shartli", weight: 1.5}
      - {id: buyer_conclusion, description: "Xaridor 5 oylik, akkreditiv/sug'urta yo'q — 5-band bajarilmaydi; xulosa: Compliance tekshiruvi va kafolat bo'lmaguncha qaror yo'q, eng yaxshi holatda 2 100 mln", weight: 2}
    hints:
      - "Avval kontraktni so'mga o'giring va 70% chegarani hisoblang."
      - "Ko'chirmada bir xil kontragentdan kelib, shu kuni bog'liq firmaga ketgan summalarni toping — siyosatning 3-bandi ular haqida nima deydi?"
      - "Ta'minotni ikki summa uchun hisoblang. Qaysi hujjat hali kelmagan va u natijani o'zgartirishi mumkinmi?"
    reference_answer: |
      Kontrakt: 240 000 × 12 500 = 3 000 mln. 2 400 / 3 000 = 80% > 70% — maksimal 2 100 mln.
      Tozalangan tushum: 6 oy kirim 4 860, shundan «Sarvqad Savdo» 1 800 (6 × 300) shu kuni yoki ertasiga «Yangi Bo'ston Invest»ga
      qaytgan (1 750) — chiqariladi: 3 060 mln / 6 oy → 6 120 mln/yil; ariza 7 200 dan 15% past — tozalangan raqam ishlatiladi.
      Oylik EBITDA: 6 120 × 14% / 12 ≈ 71.4 mln. Foiz: 2 400 × 22% / 12 = 44.0 → ICR ≈ 1.62; 2 100 → 38.5 → ICR ≈ 1.85. Bajariladi.
      Ta'minot: ombor 2 600 × 0.7 = 1 820 + zaxira 900 × 0.5 = 450 = 2 270; 2 400 uchun 0.95 < 1.0, 2 100 uchun 1.08. Taqiq reestri kelmagan.
      Xaridor: 11.05.2026 da ro'yxatdan o'tgan (5 oy), akkreditiv/sug'urta yo'q — 5-band bajarilmaydi.
      Xulosa: so'ralgan shartlarda — yo'q. Eng ko'pi 2 100 mln, shartlar: akkreditiv yoki eksport sug'urtasi, toza reestr, Compliance EDD
      natijasi ijobiy. Compliance tekshiruvi tugaguncha qo'mitaga chiqarilmaydi.

