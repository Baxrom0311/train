      - "Ko'chirmada bir xil sanadagi kirim va chiqimlarni juftlang. Naqd yechishlarni chegara bilan solishtiring."
    reference_answer: |
      Sxema: Oltinsoy (Farrux 51%, Laylo 49%) → «Yangi Bo'ston Invest» (Bobur Qosimov, Laylo'ning akasi) → «Sarvqad Savdo» (YBI 100%,
      direktor Bobur) → Oltinsoy. Bog'liq tomonlar doirasi yopiq.
