      yuk hujjati yo'q — aylanmani sun'iy oshirish ehtimoli (ariza tushumi shu hisobiga katta ko'rinadi).
      2) 12–25.09 olti marta naqd 96–99 mln, jami 588 mln — 100 mln chegarasidan sal kam, strukturalash ehtimoli.
