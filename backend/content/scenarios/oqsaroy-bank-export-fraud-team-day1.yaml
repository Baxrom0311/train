documents:
  - key: doc_team_charter
    title: "Ariza jamoasi: kim nima qiladi (Oltinsoy Agro Eksport)"
    content: |
      Bugun yirik ariza: «Oltinsoy Agro Eksport» MChJ, eksportni oldindan moliyalash, 2 400 mln so'm.
      Jamoa: kredit tahlilchisi (raqamlar va siyosat), Compliance analitik (KYC, AML, hisob harakati),
      filial mijozlar menejeri (hujjatlar, mijoz bilan aloqa). Bo'lim boshlig'i — Gulnora Azimova,
      Compliance boshlig'i — Jasur Ergashev, filial boshqaruvchisi — Kamron Usmonov.

      Kelishuvlar:
      - Ertalabki standup jamoaga bitta: kim nima qiladi, kim kimdan nima kutadi, nima to'sib turibdi.
      - Raqamlar faqat tahlilchidan: mijozga yoki rahbarga raqam yozishdan oldin tahlilchi bilan tekshiriladi.
      - Shubha belgilari faqat Compliance kanalida. Mijozga tekshiruv haqida HECH KIM aytmaydi (tipping-off taqiqlangan).
      - Mijozga ketadigan har qanday matnni menejer yozadi, Compliance matnni "ogohlantirib qo'ymaydimi" deb ko'rib chiqadi.
      - Kredit bo'yicha qaror — kredit qo'mitasida. Hech kim "dastlabki tasdiq" bermaydi.
      - Kun oxirida jamoa bitta umumiy hisobot yozadi.

  - key: doc_export_policy
    title: "Eksportni oldindan moliyalash: kredit siyosati (ichki, o'quv versiyasi)"
    content: |
      1. Kredit summasi ≤ eksport kontrakti qiymatining 70% i. Muddat 12 oygacha. Stavka yillik 22%,
         foiz har oy, asosiy qarz eksport tushumi kelganda (bir yo'la).
      2. Foiz qoplash (ICR) = oylik EBITDA / oylik foiz ≥ 1.5. Oylik foiz = S × 22% / 12.
         EBITDA tozalangan tushumdan hisoblanadi (rentabellik — oxirgi audit hisobotidan).
      3. Tozalangan tushum: bank hisobidagi kirimlardan bog'liq yoki aylanib qaytadigan (shu kuni yoki ertasiga
         bog'liq tomonga qaytgan) tushumlar chiqariladi. Ariza tushumi bilan farq > 10% bo'lsa — tozalangan raqam ishlatiladi.
      4. Ta'minot: tan olinadigan qiymat = bozor bahosi × diskont (ko'chmas mulk 0.7, tovar zaxirasi 0.5);
         tan olinadigan qiymat / kredit ≥ 1.0. Boshqa bankda garovdagi mulk hisobga olinmaydi.
      5. Xaridor: kamida 1 yil faoliyat yoki to'lov akkreditiv/eksport sug'urtasi bilan kafolatlangan.
      6. Bitta kontrakt faqat bitta bankda moliyalanadi (ikki marta moliyalash — rad etish asosi).

  - key: doc_application
    title: "Kredit arizasi: «Oltinsoy Agro Eksport» MChJ"
    content: |
      Faoliyat: quritilgan meva (mayiz, o'rik) qayta ishlash va eksport, 5 yil, 42 xodim. Chilonzor filiali mijozi.
      So'ralgan kredit: 2 400 000 000 so'm, 12 oy. Maqsad: kontrakt bo'yicha xomashyo xaridi.
      Eksport kontrakti: № BO-26/04, xaridor «Baltic Orchard OÜ» (Estoniya), 240 000 USD
      (bank kursi 12 500 so'm — 3 000 mln so'm ekvivalenti). Arizada: "xaridor bilan 3 yillik hamkorlik".
      Tushum (2025, audit): 7 200 mln so'm, EBITDA rentabelligi 14%.
      Taklif qilingan garov: muzlatgichli ombor (Toshkent viloyati), quritilgan meva zaxirasi.
      Mijozning izohi: "Raqobatchi bank 2 kunda beradi, bugun javob kutaman."

  - key: doc_collateral
    title: "Garov ma'lumoti: «Oltinsoy Agro Eksport»"
    content: |
      garov | bozor bahosi, mln | turi | izoh
      Muzlatgichli ombor | 2 600 | ko'chmas mulk | baholash 02.09.2026; taqiq reestri ko'chirmasi so'ralgan, hali kelmagan
      Quritilgan meva zaxirasi (omborda) | 900 | tovar zaxirasi | mijoz deklaratsiyasi, inventarizatsiya 30.09.2026

  - key: doc_statement
    title: "«Oltinsoy Agro Eksport»: Oqsaroy Bank hisob ko'chirmasi (aprel–sentyabr 2026), tanlangan qatorlar"
    content: |
      6 oy jami kirim: 4 860 mln so'm. Jami chiqim: 4 710 mln so'm.
      Tanlangan operatsiyalar (mln so'm):
      sana | turi | summa | kontragent | to'lov maqsadi
