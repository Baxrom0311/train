# CONTRACT.md §29 — Bank sohasining jamoaviy ssenariysi (2–3 talaba). Bank, mijozlar, kontragentlar, odamlar va
# raqamlar o'ylab topilgan. Chegaralar (kontraktga nisbatan kredit ulushi, ICR, ta'minot diskontlari, naqd operatsiya
# chegarasi, AML tartibi) — o'quv maqsadidagi ichki siyosat, real normativ emas.
