      - {id: no_tipoff, description: "Mijozga faqat jarayon: hujjatlar ko'rib chiqilmoqda, qo'shimcha hujjatlar ro'yxati; shubha, Compliance va qaror haqida gap yo'q, va'da yo'q", weight: 2}
