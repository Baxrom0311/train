  - key: doc_kyc
    title: "KYC: «Oltinsoy Agro Eksport» va kontragentlar"
    content: |
      A) «Oltinsoy Agro Eksport» MChJ. Quritilgan meva eksporti, 2021-yildan
        Ta'sischilar: Farrux Nematov (51%), Laylo Nematova (49%, Farruxning turmush o'rtog'i)
        Direktor: Farrux Nematov
      B) «Yangi Bo'ston Invest» MChJ. Investitsiya va maslahat, 2025-yildan
        Ta'sischi va direktor: Bobur Qosimov (Laylo Nematovaning akasi)
        Oltinsoy'ga qarz bergani haqida shartnoma bankka berilmagan
      C) «Sarvqad Savdo» MChJ. Ulgurji savdo, 2025-yildan
        Ta'sischi: «Yangi Bo'ston Invest» MChJ (100%)
        Direktor: Bobur Qosimov
      D) «Baltic Orchard OÜ». Xaridor, Estoniya
        Ro'yxatdan o'tgan: 11.05.2026. Ustav kapitali: 2 500 EUR
        Veb-sayt va moliyaviy hisobot: yo'q. Direktor: Marten Ilves
        Sanksiya ro'yxatlari: mos kelish yo'q

  - key: doc_aml_policy
    title: "AML: shubhali operatsiyalar tartibi (ichki, o'quv versiyasi)"
    content: |
      Ichki chegara: bitta naqd operatsiya 100 mln so'm va undan ko'p bo'lsa avtomatik nazoratga tushadi.
      Shubha belgilari:
      - naqd pulni chegaradan sal kam qismlarga bo'lib yechish yoki kiritish (strukturalash);
      - bog'liq kompaniyalar orqali pulning aylanib qaytishi (aylanmani sun'iy oshirish);
      - real mahsulot harakatini tasdiqlovchi hujjatsiz "avans" va "qarz" o'tkazmalari;
      - yangi, faoliyati tasdiqlanmagan xorijiy kontragent;
      - hujjatlardagi ziddiyatlar (sanalar, miqdor, narx).
      Tartib:
      1. Belgilar bo'lsa — shu ish kuni ichida Compliance'ga ichki shubhali operatsiya xabarnomasi (ISOX):
         mijoz, davr, operatsiyalar, qaysi belgilar, nega shubhali. Fakt va taxmin ("ehtimol") ajratiladi.
      2. Mijozga tekshiruv haqida aytish TAQIQLANADI (tipping-off). Mijozga faqat standart jarayon tili.
      3. Operatsiyani 2 ish kunigacha to'xtatib turish haqida Compliance boshlig'i qaror qiladi, xodim emas.
      4. Kuchaytirilgan tekshiruv (EDD): benefitsiar egalar, kontragent shartnomalari, pul manbai.

  - key: doc_contract_pack
    title: "Mijoz hujjatlari: kontrakt, proforma-invoys va yetkazish rejasi"
    content: |
      A) Eksport kontrakti № BO-26/04. Imzolangan sana: 20.04.2026
        Sotuvchi: «Oltinsoy Agro Eksport» MChJ. Xaridor: «Baltic Orchard OÜ», direktor Marten Ilves
        Mahsulot: mayiz, 120 tonna × 2 000 USD = 240 000 USD
        To'lov: yetkazilgandan keyin 90 kun ichida, 100%. Akkreditiv yoki sug'urta: yo'q
        Yetkazish: 2026-noyabr — 2027-yanvar, uch partiya
      B) Proforma-invoys № PI-0912. Sana: 12.09.2026
        Mahsulot: mayiz, 150 tonna × 1 600 USD = 240 000 USD
        Bank rekvizitlari: Latviyadagi bank, xaridor nomi bilan emas, «BO Trading Ltd» nomida
      C) Yetkazish rejasi (mijoz tayyorlagan). Sana: 05.10.2026
        Mahsulot: 120 tonna, 3 partiya, birinchisi 15.11.2026
        Xomashyo xaridi: 2026-oktyabr, kredit pulidan

  - key: doc_kumush_letter
    title: "Shoshilinch: Kumush Vodiy Bank xati va filialdagi to'lov topshirig'i (15:05–15:20)"
    content: |
      15:05 Kumush Vodiy Bank'dan rasmiy so'rov (banklararo kanal):
      "«Oltinsoy Agro Eksport» MChJga 19.08.2026 da № BO-26/04 eksport kontrakti bo'yicha 2 100 mln so'm kredit
      berganmiz. Garov: muzlatgichli ombor (ipoteka 19.08.2026 da ro'yxatga olingan). Mijoz sizning bankingizga ham
      shu kontrakt bo'yicha murojaat qilganmi? Bizda «Sarvqad Savdo» bo'yicha ham savollar bor."
      15:10 Taqiq reestri ko'chirmasi keldi: ombor — 19.08.2026 dan Kumush Vodiy Bank foydasiga ipotekada.
      15:15 Farrux Nematov Chilonzor filialida: 1 150 mln so'mni «Yangi Bo'ston Invest» MChJga "qarzni qaytarish"
      maqsadida o'tkazish topshirig'ini berdi va "bugun 16:00 gacha o'tishi shart" deyapti.
      Hisob qoldig'i: 1 180 mln so'm.

