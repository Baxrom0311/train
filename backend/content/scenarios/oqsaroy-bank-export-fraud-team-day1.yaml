      - {id: isox_edd, description: "ISOX shu kunning o'zida, fakt va 'ehtimol' ajratilgan, xavf — yuqori; EDD ro'yxati (YBI qarz shartnomasi, Sarvqad yuk hujjatlari, naqd pul maqsadi, xaridor ma'lumotlari); mijozga aytilmaydi", weight: 1.5}
