      - {id: breakeven, description: "Zararsizlik to'g'ri: buyurtmadan foyda 119 200 − 59 600 = 59 600, marja 50%, zararsizlik ROAS 2.0, CAC 59 600; to'liq narxdagi 60% marjani (ROAS ≈ 1.67) ishlatmagan", weight: 2}
      - {id: kpi, description: "KPI maqsadlari brifga mos: CAC ≤ 45 000, ROAS ≥ 2.5, yalpi foyda musbat; sovg'a xarajati (500 × 12 000 = 6 mln) foydada hisobga olinishi aytilgan", weight: 1.5}
      - {id: control, description: "Kunlik nazorat: 10:00/16:00, kanal kunlik limiti, ±30% chetlanish yoki CAC > 59 600 da to'xtatish va rahbarga xabar; optimizatsiya maqsadi — xarid", weight: 1.5}
    hints:
      - "Kampaniya davomida barcha buyurtmalar qaysi narxda bo'ladi? Marjani shu narxdan hisoblang."
      - "Zararsizlik ROAS va zararsizlik CAC aslida bitta narsani ikki xil ko'rsatadi — ikkalasini ham bitta buyurtmadan foydadan chiqaring."
      - "To'xtatish qoidasi raqam bilan bo'lmasa, uni hech kim qo'llamaydi. Qaysi chegarani qo'yasiz?"
    reference_answer: |
      UTM (campaign=qishki_qalqon_launch): shortvideo/cpc/v1_lab; feed/cpc/v1_carousel; messenger/post/kanal_nomi;
      search/cpc/brand_vs_generic; retarget/cpm/v1_price; blogger/influencer/madina_post. Promokod: QALQON20 umumiy, MADINA20 blogger.
      Zararsizlik: 119 200 − 59 600 = 59 600 so'm/buyurtma, marja 50% → ROAS 2.0, CAC 59 600. (To'liq narxda 60% va ROAS 1.67 —
      bu kampaniyaga mos emas.) KPI: CAC ≤ 45 000 (ROAS ≈ 2.65 ga teng), ROAS ≥ 2.5, yalpi foyda = buyurtma × 59 600 − reklama − 6 mln sovg'a > 0.
      Nazorat: kabinetda har kanalga kunlik limit; optimizatsiya — xarid; 10:00 va 16:00 da jadval kanal | xarajat | klik | buyurtma |
      CAC | ROAS; xarajat rejadan ±30% yoki kanal CAC > 59 600 bo'lsa — kanalni to'xtataman va Dilnoza opaga yozaman.

