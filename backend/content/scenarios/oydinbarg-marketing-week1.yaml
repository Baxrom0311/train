    at: "09:30"
    from: dilnoza
    brief: |
      Kampaniyadan oldin kimga va nima deb sotishimizni aniqlaylik. Yozing:
      1) har segment uchun salohiyatli xaridorlar soni va ulushi — qaysi 2 segment ustuvor va nega;
      2) raqobatchilar bilan narxni 1 ml hisobida solishtiring (chegirmali narxni ham);
      3) bitta jumlalik pozitsiya (nima bilan farq qilamiz) va har ustuvor segment uchun kanallar;
      4) raqobat bo'yicha nimani reklamada ishlatmaymiz.
    attachments: [doc_audience, doc_competitors, doc_product_card, doc_brand_guide]
    answer_types: [text, file]
    due_in_minutes: 180
    weight: 1.5
    competencies: [technical, initiative]
    rubric:
      - {id: potential, description: "Salohiyat to'g'ri (±1%): A ≈ 10 080, B 31 460, C 17 280, D 22 500; jami 81 320; ulushlar ≈ 12.4 / 38.7 / 21.2 / 27.7%", weight: 2}
      - {id: priority, description: "Ustuvor B va D; A eng katta segment bo'lsa ham to'lovga tayyorlik (8%) tufayli eng kichik salohiyat ekani aytilgan", weight: 2}
      - {id: price_ml, description: "So'm/ml to'g'ri: Oydinbarg 2 980 (chegirma bilan 2 384), Nafis Teri 2 580, Gulbadan 2 450, Sahro Care 4 200; xulosa — mahalliylardan qimmat, importdan ancha arzon, chegirma bilan eng arzon", weight: 1.5}
      - {id: positioning, description: "Pozitsiya tasdiqlangan faktga tayangan (87% tabiiy kelib chiqish, 40 kishida 21 kunlik sinov) va segment kanallariga bog'langan (B — qisqa video/messenjer, D — qidiruv/do'kon)", weight: 1.5}
      - {id: no_rumor, description: "Raqobatchi haqidagi tekshirilmagan «gormon» gapi va raqobatchi nomini reklamada ishlatmaslik aniq aytilgan"}
    hints:
      - "Segmentning hajmi emas, xaridga tayyor odamlar soni muhim. Uchta ustunni qanday birlashtirish kerak?"
      - "Turli hajmdagi kremlarni solishtirish uchun narxni bitta birlikka keltiring."
      - "Raqobat jadvalidagi qaysi ustunda faqat bizda aniq raqam bor? Pozitsiyani shunga quring."
    reference_answer: |
      1) Salohiyat = soni × muammo × tayyorlik: A 180 000×0.70×0.08 ≈ 10 080 (12.4%); B 31 460 (38.7%); C 17 280 (21.2%);
      D 22 500 (27.7%); jami 81 320. Ustuvor: B va D (birga ≈ 66%). A eng katta, lekin to'lovga tayyorlik 8% — eng kichik salohiyat.
      2) So'm/ml: Oydinbarg 2 980 (QALQON20 bilan 2 384), Nafis Teri 2 580, Gulbadan 2 450, Sahro Care 4 200. Biz mahalliylardan
      ≈ 15–22% qimmat, importdan 29% arzon; ishga tushirish chegirmasi bilan to'plamdagi eng arzon so'm/ml.
      3) Pozitsiya: "Laboratoriyada 40 kishida sinalgan mahalliy qishki krem: 85% da namlik oshdi, 87% tabiiy kelib chiqishli tarkib."
      B — qisqa video va messenjer kanallari, lab faktlari bilan; D — qidiruv va do'kon, "namlik +18%" va atirsiz tarkib.
      4) Ishlatmaymiz: raqobatchi nomi, "gormon" mish-mishi (hujjat yo'q, brendbukka zid), "kimyosiz", "100% tabiiy".

