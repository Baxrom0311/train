    brief: |
      Dizaynerga reklama kreativlari uchun brif kerak (qisqa video va messenjer posti uchun 3 ta kreativ). Yozing:
      kimga (segment), asosiy xabar, isbot (faktlar), taklif va muddat, majburiy elementlar, taqiqlangan narsalar,
      har kreativ qaysi gipotezani tekshiradi.
    attachments: [doc_brand_guide, doc_product_card, doc_audience]
    answer_types: [text, file]
    due_in_minutes: 120
    weight: 1.5
    competencies: [communication, initiative]
    rubric:
      - {id: segment, description: "Kreativlar ustuvor segmentlarga (B va D) bog'langan, har biriga mos xabar", weight: 1.5}
      - {id: facts, description: "Isbot faqat kartadagi faktlar: 87% tabiiy kelib chiqish, 40 kishi/21 kun, 85% da namlik oshgan (+18%), atirsiz; ajin, SPF, 100%, davolash yo'q", weight: 2}
      - {id: offer, description: "Taklif to'g'ri: 149 000 → 119 200 so'm (QALQON20, 14 kun), birinchi 500 buyurtmaga sovg'a — shart va muddat bilan", weight: 1.5}
      - {id: test, description: "3 kreativ bitta o'zgaruvchi bo'yicha farqlanadi (masalan, lab fakti / narx / tarkib), gipoteza va o'lchov (CTR, CR, CAC) aniq"}
      - {id: format, description: "Majburiy elementlar: logotip, narx va muddat, CTA, 15–30 soniya va birinchi 3 soniyada foyda; raqobatchi nomi yo'q"}
    hints:
      - "Kechagi tadqiqotda xaridorlar uchun eng muhim omil nima edi? Kreativ shundan boshlansin."
      - "Uchta kreativ uchta har xil narsani bir vaqtda o'zgartirsa, qaysi biri ishlaganini bilib bo'lmaydi."
    reference_answer: |
      Maqsad: B (23–30) va D (39–45) ayollar, Toshkent. Asosiy xabar: "Qishda quruq teriga — laboratoriyada sinalgan namlik".
      Isbot: 40 kishida 21 kun, 85% da namlik oshgan (o'rtacha +18%); 87% tabiiy kelib chiqishli, atirsiz, parabensiz.
      Taklif: 149 000 → 119 200 so'm QALQON20 bilan, ishga tushirishdan 14 kun; birinchi 500 buyurtmaga lab balzami.
      Kreativlar (faqat birinchi kadr farq qiladi): 1) lab fakti "85% da namlik oshdi"; 2) narx "119 200 so'm, 14 kun";
      3) tarkib "shi yog'i va seramidlar, atirsiz". Gipoteza: B — lab faktiga, D — tarkibga ko'proq bosadi; CTR, CR va CAC bilan solishtiramiz.
      Majburiy: logotip, narx va muddat, CTA "Saytda buyurtma bering", 15–30 s, foyda 3-soniyagacha. Taqiq: ajin, quyoshdan himoya,
      "100%", "davolaydi", raqobatchi nomi.

