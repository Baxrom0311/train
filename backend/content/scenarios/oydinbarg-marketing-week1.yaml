  - id: ab_test
    type: task
    day: 4
    at: "14:00"
    from: dilnoza
    brief: |
      Mahsulot sahifasidagi A/B test natijasini ko'ring. Rustam aka B variantini darhol hammaga qo'yishni so'rayapti.
      Hisoblang: har variant konversiyasi, nisbiy farq, z-statistika; ichki qoida bo'yicha qaror va keyingi qadam;
      B haqiqatan yaxshi bo'lsa kuniga qancha qo'shimcha buyurtma va yalpi foyda beradi.
    attachments: [doc_ab_test, doc_launch_brief]
    answer_types: [text]
    due_in_minutes: 120
    weight: 1.5
    competencies: [technical, communication]
    rubric:
      - {id: conversion, description: "CR: A 126/4 200 = 3.0%, B 164/4 100 = 4.0%; nisbiy farq +33%", weight: 1.5}
      - {id: z_test, description: "Birlashgan p = 290/8 300 ≈ 3.49%; z ≈ 2.48 > 1.96 — 95% darajada ahamiyatli (p ≈ 0.013)", weight: 2}
      - {id: rule, description: "Qoida: sessiya sharti bajarilgan (≥ 3 000), lekin 72 soat emas, 20 soat — g'olib hali e'lon qilinmaydi, test 72 soatgacha 50/50 davom etadi; sababi aytilgan (kun/hafta xulqi, erta to'xtatish xavfi)", weight: 2}
      - {id: impact, description: "Ta'sir: 5 000 sessiya × 1 p.p. ≈ 50 buyurtma/kun, × 59 600 ≈ 2.98 mln so'm yalpi foyda/kun", weight: 1.5}
      - {id: comms, description: "Rustam akaga hurmatli, raqamli tushuntirish: qachon va qanday qaror qilinadi"}
    hints:
      - "Avval ikki konversiyani, keyin ikki variant birlashgan konversiyasini hisoblang — z formulasi hujjatda."
      - "Ahamiyatli natija ham qoidadagi ikkinchi shartni bekor qilmaydi. Qaysi shart bajarilmagan?"
    reference_answer: |
      A: 126 / 4 200 = 3.0%; B: 164 / 4 100 = 4.0%; nisbiy farq +33%.
      p = 290 / 8 300 ≈ 0.0349; SE = √(0.0349 × 0.9651 × (1/4 200 + 1/4 100)) ≈ 0.00403; z ≈ 0.010 / 0.00403 ≈ 2.48 > 1.96 (p ≈ 0.013).
      Qoida: har variantda ≥ 3 000 sessiya — bajarildi; kamida 72 soat — yo'q (20 soat, ishga tushirishning birinchi kechasi,
      virusli/reklama trafigi o'zgaruvchan). Qaror: B ustun ko'rinadi, lekin test 72 soatgacha (6-kun 16:00 atrofi) 50/50 davom etadi.
      Ta'sir: farq saqlansa, 5 000 sessiya × 1 p.p. ≈ 50 buyurtma/kun ≈ 2.98 mln so'm yalpi foyda/kun.
      Rustam akaga: "B 33% yaxshiroq ko'rinyapti va statistik jihatdan ishonchli, lekin hozircha 20 soatlik ma'lumot. Qoidamiz
      bo'yicha 72 soat to'lganda — taxminan 2 kundan keyin — g'olibni hammaga qo'yamiz; shu vaqtgacha ikkala variant ham ishlaydi."

