documents:
  - key: doc_onboarding
    title: "Marketing bo'limi: onboarding va hafta rejasi"
    content: |
      Oydinbarg — Toshkentdagi tabiiy kosmetika brendi: kremlar, sovun, lab balzami. Sotuv: o'z sayti, messenjer-bot
      va 40 ta do'kon. Marketing: Dilnoza (rahbar), Shoxrux (senior performance, mentor), Kamola (SMM), dizayner va siz.
      Sotuv va ombor, mijozlar bazasi (CRM) — Gulnora. Tijorat direktori — Rustam.

      Bu hafta — yangi «Qishki qalqon» yuz kremini ishga tushirish:
      1-kun — auditoriya va raqobat, o'lchash rejasi; 2-kun — media-reja va budjet, dizaynerga brif;
      3-kun — blogger shartlari, kontent; 16:00 da reklama ishga tushadi; 4-kun — birinchi natijalar;
      5-kun — hisobot va retro.

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Har kuni 09:00 da standup (yozma):
      kecha nima qildim / bugun nima qilaman / nima to'sib turibdi. 3–5 qator. 17:30 da kun yakuni hisoboti.
      Qoidalar: har reklama va post brendbukdan o'tadi; budjetni o'zgartirish faqat rahbar tasdig'i bilan;
      hisobot = raqam + formula + xulosa + keyingi qadam. "Yaxshi ishladi" degan baho raqamsiz yozilmaydi.

  - key: doc_brand_guide
    title: "Oydinbarg brendbuki va reklama qoidalari (ichki siyosat)"
    content: |
      Ovoz: samimiy, xotirjam, g'amxo'r. Mijozga "siz" deb murojaat. Ilmiy asosli, ortiqcha va'dasiz.
      Da'volar: faqat mahsulot kartasi va laboratoriya xulosasidagi faktlar. Taqiqlangan: "davolaydi", "shifo",
      "100%", "mo'jiza", "eng zo'r", "kafolatlangan natija", "kimyosiz", kasallik nomlari, sinalmagan ta'sirlar
      (masalan, ajin yoki quyoshdan himoya — agar kartada bo'lmasa), "dermatologlar tavsiya qiladi" kabi
      tasdiqlanmagan ekspert da'volari. Kosmetika dori emas.
      Raqobatchilar: nomi, logotipi yoki mahsulotini reklamada tilga olish va yomonlash taqiqlanadi; mish-mish ishlatilmaydi.
      Hamkorlik (blogger, sovg'a evaziga post): post boshida "Reklama" belgisi majburiy, brend nomi ochiq.
      Sharhlar va reyting: sotib olish, xodim yoki tanishlar nomidan yozish, sharh uchun to'lov yoki chegirma berish
      taqiqlanadi. Ruxsat: haqiqiy xaridorlardan xariddan keyin fikr so'rash; bepul namuna bilan sinov — sharhda
      "namuna bepul berilgan" belgisi bilan.
      Mijoz ma'lumoti: SMS, email va reklama auditoriyalari uchun faqat marketing roziligi bor kontaktlar.
      Salbiy izohlar o'chirilmaydi (faqat haqorat, spam, shaxsiy ma'lumot yashiriladi).
      Format: lenta posti — 120 so'zgacha, 1 aniq CTA, ≤ 2 emoji, ≤ 3 xeshteg, #oydinbarg majburiy; messenjer posti —
      3 xatboshigacha, havola yoki bot buyrug'i bilan tugaydi; qisqa video — 15–30 soniya, birinchi 3 soniyada asosiy foyda.
      Narx va promokod — muddati bilan; aksiya shartlari yashirilmaydi; soxta shoshiltirish ("faqat 5 ta qoldi" — rost bo'lmasa) yo'q.

  - key: doc_product_card
    title: "Mahsulot kartasi: «Qishki qalqon» yuz kremi"
    content: |
      Hajm 50 ml, narx 149 000 so'm. O'zgaruvchan xarajat (tannarx, qadoq, yetkazish): 59 600 so'm/dona.
      Tarkib: shi yog'i, skvalan, seramidlar, jo'xori ekstrakti, pantenol. Atirsiz, parabensiz.
      Laboratoriya xulosasi (mustaqil sertifikatlash laboratoriyasi):
      - ingredientlarning 87% i tabiiy kelib chiqishli;
      - 40 ishtirokchida 21 kun sinov: 34 kishida (85%) teri namligi oshgan, korneometr bo'yicha o'rtacha +18%;
      - sezgir terida qizarish holati qayd etilmagan (40 dan 0).
      Sinov o'tkazilmagan: ajin, pigment dog'lar, quyoshdan himoya (SPF yo'q). Tasnif: kosmetik vosita, dori emas.
      Ishga tushirish taklifi: QALQON20 — 20% chegirma (119 200 so'm), ishga tushirishdan 14 kun.
      Birinchi 500 buyurtmaga «Anor» lab balzami sovg'a (tannarxi 12 000 so'm).

  - key: doc_audience
    title: "Auditoriya tadqiqoti: Toshkent, 18–45 yosh ayollar (so'rovnoma, 1 200 respondent)"
    content: |
      Segment | Toshkentdagi soni | Qishda quruq teri muammosi | 120 000+ so'mlik yuz kremiga tayyor | Asosiy kanallar
      A. Talabalar, 18–22 | 180 000 | 70% | 8% | qisqa video, lenta
      B. Yosh mutaxassislar, 23–30 | 220 000 | 65% | 22% | qisqa video, messenjer kanallari
      C. Yosh onalar, 28–38 | 160 000 | 60% | 18% | messenjer kanallari, bloggerlar
      D. 39–45 yosh | 120 000 | 75% | 25% | qidiruv, do'kon

      Segmentlar qisman kesishadi (B va C), shuning uchun "salohiyat" — taxminiy ko'rsatkich.
      Salohiyatli xaridorlar = soni × muammo ulushi × to'lovga tayyorlik ulushi.
      Xaridda eng muhim omillar (respondentlar ulushi): tarkib va sinov natijasi 58%, narx 47%, do'stlar/blogger tavsiyasi 31%.
      B va D segmentlarining 62% i "laboratoriya sinovi" so'zini ishonch belgisi deb bilgan.

  - key: doc_competitors
    title: "Raqobatchilar: qishki yuz kremlari (narxlar do'kon va saytlardan)"
    content: |
      Brend | Mahsulot | Hajm, ml | Narx, so'm | Tabiiy kelib chiqishli tarkib | Sinov ma'lumoti
      Oydinbarg | «Qishki qalqon» | 50 | 149 000 (QALQON20 bilan 119 200) | 87% | 40 kishi, 21 kun
      Nafis Teri | Barrier krem | 50 | 129 000 | 70% | e'lon qilinmagan
      Gulbadan | Qishki krem | 40 | 98 000 | ko'rsatilmagan | e'lon qilinmagan
      Sahro Care (import) | Intensiv krem | 50 | 210 000 | 60% | 30 kishi, 28 kun

      Sotuv bo'limidan izoh (tekshirilmagan): "Distribyutorlar Gulbadan kremida gormon bor deyishyapti, shuni reklamada aytsak-chi?"
      Hech qanday laboratoriya xulosasi yoki hujjat yo'q.

  - key: doc_launch_brief
    title: "Brif: «Qishki qalqon» ishga tushirish kampaniyasi"
    content: |
      Maqsad: 14 kunda saytda yangi xaridorlar va brendning qishki krem sifatida tanilishi.
      Budjet: 40 000 000 so'm (14 kun, barcha kanallar, blogger ham shu ichida). Ishga tushirish: 3-kun 16:00.
      Narx: 149 000 so'm, QALQON20 bilan 119 200 so'm (kampaniya davomida barcha buyurtmalar shu narxda deb oling).
      O'rtacha buyurtma — 1 dona. Birinchi 500 buyurtmaga lab balzami sovg'a (12 000 so'm/dona).
      KPI: CAC ≤ 45 000 so'm; ROAS (chegirmali narxda) ≥ 2.5; kampaniya yalpi foydasi musbat.
      Formulalar:
      CAC = reklama xarajati / yangi buyurtmalar; ROAS = daromad / reklama xarajati;
      bir buyurtmadan yalpi foyda = sotuv narxi − o'zgaruvchan xarajat; marja = yalpi foyda / sotuv narxi;
      zararsizlik ROAS = 1 / marja; zararsizlik CAC = bir buyurtmadan yalpi foyda;
      kampaniya yalpi foydasi = buyurtmalar × (narx − o'zgaruvchan xarajat) − reklama xarajati − sovg'alar.
      Har kanalda keyingi qo'shilgan so'm ham zararsizlik CAC'dan arzon buyurtma keltirishi kerak (chekli CAC).

  - key: doc_tracking_guide
    title: "O'lchash va hisobot qoidalari"
    content: |
      UTM: utm_source = kanal (shortvideo, feed, messenger, search, retarget, blogger),
      utm_medium = to'lov modeli (cpc, cpm, post, influencer), utm_campaign = kampaniya (lotin, kichik harf, pastki chiziq),
      utm_content = kreativ (masalan, v1_lab, v2_price). Bir kampaniyada nomlar bir xil yoziladi.
      Promokod: umumiy QALQON20; blogger uchun alohida kod (sotuv va to'lov shu kod bo'yicha hisoblanadi).
      Atributsiya: oxirgi klik, 7 kunlik oyna. Organik va to'g'ridan-to'g'ri buyurtmalar reklama CAC'iga kiritilmaydi.
      Kunlik nazorat (10:00 va 16:00): har kanal xarajati rejadan ±30% chetga chiqsa yoki CAC zararsizlik chegarasidan
      oshsa — rahbarga xabar va kanal to'xtatiladi. Kabinetda har kanalga kunlik limit qo'yiladi.
      Reklama kabineti optimizatsiya maqsadi: "xarid" (klik emas). Hisobot: kanal | xarajat | klik | buyurtma | CAC | ROAS | yalpi foyda.

  - key: doc_channel_benchmarks
    title: "Kanallar bo'yicha benchmark (o'tgan kampaniyalar, o'xshash narxdagi mahsulot) va cheklovlar"
    content: |
      Kanal | Narx modeli | CPC, so'm | CR (klik → buyurtma) | Cheklov
      Qisqa video reklama (yangi auditoriya) | klik | 1 400 | 2.5% | 12 mln gacha; undan ortig'ida auditoriya to'yinadi, CPC ≈ 1 820
      Lenta reklama, karusel | klik | 1 600 | 2.0% | —
      Messenjer kanallarida reklama posti | post | ≈ 1 500 (o'rtacha) | 4.0% | mos kanallardagi joylar jami 7.5 mln so'mgacha
      Qidiruv (kontekstli) reklama | klik | 900 | 3.0% | 14 kunda ≈ 9 000 klik (so'rovlar soni cheklangan)
      Retargeting (saytga kirganlar) | ko'rsatish, CPM 25 000 so'm | — | CTR 2.0%, CR 6.0% | auditoriya 25 000 kishi, chastota ≤ 4
      Blogger (Madina) | fiks | — | ≈ 80 buyurtma o'z promokodi bilan | ≈ 4 mln so'm; yakuniy shartlar 3-kun

      Izoh: CPM = 1 000 ko'rsatish narxi. Chastota = ko'rsatishlar / qamrov. Benchmark — taxmin, ishga tushgach
      haqiqiy raqamlar bilan har kuni solishtiriladi.

  - key: doc_influencer_offer
    title: "Madina Qosimova: hamkorlik taklifi va post loyihasi"
    content: |
      Profil: 85 000 obunachi, 72% ayollar, 64% Toshkent; story o'rtacha 18 000 ko'rish, post qamrovi ≈ 30 000.
      Taklif (1 post + 3 story, MADINA20 promokodi — 20% chegirma, QALQON20 bilan bir xil):
      A) fiks 4 000 000 so'm;
      B) 1 500 000 so'm + MADINA20 bilan har buyurtma uchun 25 000 so'm.
      Shartnoma loyihasidagi bandlar: "Post 30 kun saqlanadi"; "Blogger post ostidagi salbiy izohlarni o'chiradi";
      "Brend matnni oldindan ko'radi".
      Benchmark: o'xshash bloggerlarda MADINA20 kabi kod bilan ≈ 80 buyurtma.

      Post loyihasi (Madina yozgan):
      "Qizlar, topdim! 😍😍😍 Oydinbarg'ning yangi «Qishki qalqon» kremi — 100% tabiiy, kimyosiz,
      dermatologlar tavsiya qiladi! Ajinlarni 2 haftada yo'qotadi va quyoshdan ham himoya qiladi ☀️
      Gulbadan kremidan farqli o'laroq terini quritmaydi. Narxi atigi 99 000! MADINA20 kodi bilan yana arzon.
      #krem #qish #go'zallik #teri #tabiiy #oydinbarg"

  - key: doc_crm_data
    title: "CRM: sodiqlik kartasi bazasi"
    content: |
      Do'konlardagi sodiqlik kartasi egalari: 18 000 telefon raqam (anketa: ism, telefon, tug'ilgan kun).
      Anketada "aksiya va yangiliklar haqida SMS olishga roziman" belgisi: 4 200 kishida bor, 13 800 kishida yo'q.
      Karta shartlari: "Ma'lumotlar chegirma va xaridlar tarixini hisoblash uchun ishlatiladi".
      SMS narxi: 150 so'm/xabar. Reklama kabinetiga telefon ro'yxatini yuklab, "o'xshash auditoriya" yasash mumkin.

  - key: doc_incident_burn
    title: "Reklama kabineti: ishga tushirishdan keyingi 17 soat 40 daqiqa (3-kun 16:00 – 4-kun 09:40)"
    content: |
      Kanal | Xarajat, so'm | Klik | Buyurtma
      Qisqa video | 7 800 000 | 9 750 | 39
      Lenta karusel | 1 200 000 | 750 | 6
      Qidiruv | 300 000 | 330 | 10
      Retargeting | 300 000 | 240 | 14
      Messenjer kanallari | 0 (postlar 5-kunga rejalashtirilgan) | — | —

      Sozlamalar: qisqa video va lenta — optimizatsiya maqsadi "klik", auditoriya 16–55 yosh, butun mamlakat,
      kunlik limit yo'q (umumiy limit 40 mln). Tasdiqlangan budjet: 40 mln so'm / 14 kun.
      Qisqa video kliklarining 44% i — 16–21 yosh; 38% i — Toshkentdan tashqari (yetkazish 3–5 kun, CR uch barobar past).
      Barcha buyurtmalar QALQON20 bilan (119 200 so'm). Xarajat hozir ham soatiga ≈ 540 000 so'm.

  - key: doc_incident_gift
    title: "Sotuv va ombor: 4-kun 09:40 holati"
    content: |
      3-kun 21:40 da xaridor Shahnoza R. qisqa video platformasida o'z pulimga olgan kremim deb video joyladi
      (pullik hamkorlik emas) — 4-kun 09:00 ga 1.1 mln ko'rish. Saytga tashrif 6 barobar oshdi.
      Sovg'a sharti: "birinchi 500 buyurtmaga lab balzami". Saytdagi hisoblagich sozlanmagan — sovg'a va'da qilingan
      buyurtmalar 09:40 holatiga: 640 ta va o'sib bormoqda.
      Hozirgi oqim: soatiga 44 buyurtma (organik 30, reklama 14).
      Omborda lab balzami: 560 dona; do'konlarda yana 300 dona. «Qishki qalqon» kremi: 1 900 dona (yetarli).
      Reklamadagi 3 kreativda va sayt bannerida "Birinchi 500 xaridorga sovg'a!" yozuvi; bu kreativlar reklama xarajatining 70% i.
      Lab balzami tannarxi: 12 000 so'm. Ichki qoida: allaqachon berilgan buyurtmalar bo'yicha e'lon qilingan va'da bajariladi.

  - key: doc_ab_test
    title: "Mahsulot sahifasi A/B testi (3-kun 16:00 – 4-kun 12:00, 20 soat)"
    content: |
      A — sahifa boshida narx va chegirma ("149 000 → 119 200 so'm"); B — sahifa boshida laboratoriya faktlari
      ("40 kishi, 21 kun: 85% da namlik oshdi"), narx pastroqda. Trafik barcha manbalardan 50/50 bo'linadi.
      Variant | Sessiya | Buyurtma
      A | 4 200 | 126
      B | 4 100 | 164
      Ichki A/B qoidasi: har variantda ≥ 3 000 sessiya VA kamida 72 soat (hafta ichi va dam olish xulqi farqli);
      ahamiyatlilik — ikki ulush uchun z-test, |z| ≥ 1.96 (95%). Muddatidan oldin g'olib e'lon qilinmaydi.
      z = (p_B − p_A) / √(p × (1 − p) × (1/n_A + 1/n_B)), p — ikki variant birlashgan konversiyasi.
      Kutilayotgan trafik: kuniga ≈ 5 000 sessiya.

  - key: doc_week_results
    title: "Kampaniya natijalari: 4-kun 12:00 – 5-kun 09:00 (21 soat, 4-kundagi tuzatishlardan keyin)"
    content: |
      Tasdiqlangan reja (14 kun): retargeting 2.5 mln, qidiruv 8.1 mln, messenjer 7.5 mln, qisqa video 12.0 mln,
      blogger — B varianti (1.5 mln + 25 000 so'm/buyurtma), zaxira 5.9 mln. Blogger'siz kunlik reja: 2.15 mln so'm.
      Kanal | Xarajat, so'm | Klik | Buyurtma
      Qisqa video | 780 000 | 540 | 12
      Qidiruv | 510 000 | 560 | 18
      Messenjer kanallari (1 post) | 540 000 | 360 | 15
      Retargeting | 160 000 | 130 | 8
      Blogger (MADINA20; post 4-kun 18:00) | fiks 1 500 000 + 25 000 × buyurtma | — | 26
      Organik / to'g'ridan-to'g'ri | 0 | — | 21

      Barcha buyurtmalar 119 200 so'mdan (QALQON20 yoki MADINA20). Sovg'a xarajati bu jadvalga kirmaydi.
      1-sutka natijalari 4-kundagi incident hisobotida alohida.

