  - id: budget_plan
    type: task
    day: 2
    at: "09:30"
    from: dilnoza
    brief: |
      Asosiy ish: 14 kunlik 40 mln so'mni kanallarga taqsimlang. Har kanal uchun: budjet, kutilgan klik va buyurtma,
      CAC, ROAS va yalpi foyda; jami bo'yicha ham. Benchmark cheklovlarini (retargeting chastotasi, qidiruv hajmi,
      qisqa video to'yinishi) hisobga oling. Butun 40 mln ni ishlatish kerakmi — raqam bilan asoslang. Oxirida kunlik
      sarf rejasi va KPI bajariladimi degan xulosa. Jadval (matn yoki fayl) va 5–7 qatorlik izoh.
    attachments: [doc_launch_brief, doc_channel_benchmarks, doc_product_card]
    answer_types: [text, file]
    due_in_minutes: 210
    weight: 3
    competencies: [technical, prioritization, initiative]
    rubric:
      - {id: unit_econ, description: "Hisob chegirmali narxda: 119 200 so'm daromad, 59 600 foyda/buyurtma, zararsizlik CAC 59 600 (ROAS 2.0); 149 000 dan hisoblanmagan", weight: 2}
      - {id: caps, description: "Cheklovlar to'g'ri: retargeting 25 000 × 4 = 100 000 ko'rsatish × 25 000/1000 = 2.5 mln (2 000 klik, 120 buyurtma); qidiruv 9 000 × 900 = 8.1 mln (270); messenjer 7.5 mln (5 000 klik, 200)", weight: 2}
      - {id: channel_cac, description: "Kanal CAC'lari: retargeting ≈ 20 833, qidiruv 30 000, messenjer 37 500, blogger 50 000, qisqa video 56 000 (12 mln gacha), 12 mln dan keyin 72 800, lenta 80 000 — oxirgi ikkisi zararli (> 59 600)", weight: 2}
      - {id: allocation, description: "Taqsimot: retargeting 2.5, qidiruv 8.1, messenjer 7.5, blogger 4.0, qisqa video ≤ 12.0 mln; lenta yo'q yoki ≤ 1 mln kreativ testi; ≈ 5.9 mln zaxira (yoki asosli muqobil)", weight: 2}
      - {id: totals, description: "Jami (±1%): xarajat ≈ 34.1 mln, ≈ 884 buyurtma, daromad ≈ 105.4 mln, CAC ≈ 38 560, ROAS ≈ 3.09, yalpi foyda ≈ 18.6 mln, sovg'adan keyin ≈ 12.6 mln; KPI bajariladi", weight: 2}
      - {id: reserve, description: "40 mln ni to'liq ishlatish tahlili: qolgan 5.9 mln qisqa videoga ketsa ≈ 81 buyurtma, CAC 72 800, foyda ≈ −1.07 mln — umumiy CAC KPI'dan (≈ 41 400) o'tsa ham zarar; zaxira natijaga qarab qayta taqsimlanadi", weight: 1.5}
      - {id: pacing, description: "Kunlik sarf: ≈ 2.44 mln/kun (blogger'siz ≈ 2.15 mln), har kanalga kunlik limit va tekshiruv vaqti"}
    hints:
      - "Avval bitta buyurtma qancha foyda keltirishini toping — keyin har kanal CAC'ini shu chegara bilan solishtiring."
      - "Retargeting uchun budjet chegarasini auditoriya, chastota va CPM'dan, qidiruv uchun esa klik soni va CPC'dan chiqaring."
      - "Kanallarni CAC bo'yicha arzondan qimmatga tartiblab, har biriga cheklovigacha pul bering. Qimmat kanalga ketgan keyingi 1 mln qancha foyda yoki zarar beradi?"
    reference_answer: |
      Birlik: 119 200 − 59 600 = 59 600 so'm foyda/buyurtma, marja 50% → zararsizlik CAC 59 600, ROAS 2.0.
      Kanal | budjet | klik | buyurtma | CAC | ROAS | yalpi foyda
      Retargeting | 2.5 mln (25 000×4=100 000 ko'rsatish × CPM 25 000) | 2 000 | 120 | 20 833 | 5.72 | +4.65 mln
      Qidiruv | 8.1 mln (9 000 klik × 900) | 9 000 | 270 | 30 000 | 3.97 | +7.99 mln
      Messenjer | 7.5 mln | 5 000 | 200 | 37 500 | 3.18 | +4.42 mln
      Blogger | 4.0 mln | — | 80 | 50 000 | 2.38 | +0.77 mln
      Qisqa video | 12.0 mln | 8 571 | 214 | 56 000 | 2.13 | +0.77 mln
      Lenta | 0 (CAC 80 000 > 59 600 — zarar) | Zaxira | 5.9 mln
      Jami: 34.1 mln, ≈ 884 buyurtma, daromad ≈ 105.4 mln, CAC ≈ 38 560, ROAS ≈ 3.09, yalpi foyda ≈ 18.6 mln, sovg'alar 6 mln bilan ≈ 12.6 mln.
      KPI: CAC 38 560 ≤ 45 000, ROAS 3.09 ≥ 2.5 — bajariladi.
      Nega 40 mln emas: qolgan 5.9 mln faqat qisqa videoga sig'adi, u yerda CPC 1 820 → CAC 72 800 > 59 600, ≈ 81 buyurtma va ≈ −1.07 mln.
      Umumiy CAC 41 400 bo'lib KPI "bajariladi", lekin har qo'shimcha so'm zarar. Zaxira birinchi haftadan keyin eng arzon kanalga.
      Kunlik: ≈ 2.44 mln (blogger'siz 2.15 mln); kabinetda har kanalga kunlik limit, optimizatsiya — xarid, geo Toshkent, 23–45 yosh.
      Xavf: benchmark taxmin — 4-kun 10:00 da haqiqiy CAC bilan solishtiraman. Tasdiq — Dilnoza opada.

