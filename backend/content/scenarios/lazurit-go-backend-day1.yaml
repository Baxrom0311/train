      Onboarding hujjatini o'qib chiqing, savollar bo'lsa — menga yoki Nodirga yozing.

  - id: standup
    type: task
    day: 1
    at: "09:00"
    from: sardor
    brief: |
      Standup vaqti. Onboarding'dagi formatda yozing: bugun nimalarni rejalashtiryapsiz va
      nima to'sib turishi mumkin. Birinchi kun bo'lsa ham reja aniq bo'lsin.
    attachments: [doc_onboarding]
    answer_types: [text]
    due_in_minutes: 20
    weight: 0.5
    competencies: [communication, time_management]
    rubric:
