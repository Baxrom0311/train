documents:
  - key: doc_onboarding
    title: "Backend jamoasi: onboarding"
    content: |
      Lazurit Go — Toshkentdagi oziq-ovqat yetkazib berish xizmati. Backend jamoasi 6 kishi:
      Sardor (team lead), Nodir (senior, yangi xodimlar mentori), Malika (QA), uchta dasturchi.
      Mahsulot bo'yicha savollar — Aziza (PM).

      Ish kuni 09:00–18:00, tushlik 13:00–14:00. Standup har kuni 09:00 da, yozma ham bo'ladi.
      Standup formati: kecha nima qildim / bugun nima qilaman / nima to'sib turibdi. 3–5 qator.

      Ustuvorlik tartibi: 1) prod incident, 2) relizni to'sib turgan bug, 3) sprint task'lari,
      4) yangi so'rovlar. Ustuvorlikni team lead belgilaydi; PM yangi so'rov bersa — team lead
      bilan kelishiladi, muddat oshkora aytiladi.

      Git: har task alohida branch (LZ-<raqam>-qisqa-nom), PR'da kamida bitta review.
      "Tayyor" degani: kod + testlar + PR tavsifi (nima, nega, qanday tekshirildi).
      Relizlar: har kuni 15:00 da, staging'dan o'tgan PR'lar chiqadi.

  - key: doc_orders_service
    title: "orders-service: narx hisoblash"
    content: |
      orders-service (Python 3.12, FastAPI) buyurtma yaratadi va to'lov xizmatiga summani yuboradi.
      Summa butun so'mda, manfiy bo'lishi mumkin emas (to'lov xizmati manfiy summani 500 bilan rad etadi).

      pricing.py:

      ```python
      from dataclasses import dataclass

      @dataclass
      class Item:
          price: int   # so'm
          qty: int

      @dataclass
      class Promo:
          code: str
          kind: str          # "percent" yoki "fixed"
          value: int         # foiz (1–100) yoki so'm
          min_subtotal: int  # promo ishlashi uchun minimal mahsulotlar summasi

      def calculate_total(items: list[Item], delivery_fee: int, promo: Promo | None = None) -> int:
          subtotal = sum(i.price * i.qty for i in items)
          total = subtotal + delivery_fee
          if promo:
              if promo.kind == "percent":
                  total = total * (100 - promo.value) / 100
              elif promo.kind == "fixed":
                  total = total - promo.value
          return int(total)
      ```

      Testlar: tests/test_pricing.py (pytest). Hozircha faqat promo'siz holat tekshiriladi.

  - key: doc_promo_rules
    title: "Promo-kod qoidalari (mahsulot talabi)"
    content: |
      1. Promo faqat mahsulotlar summasiga (subtotal) qo'llanadi. Yetkazish narxiga hech qachon.
      2. Foizli promo: chegirma = subtotal × foiz / 100, butun so'mga pastga yaxlitlanadi.
      3. Qat'iy summali promo: chegirma subtotal'dan oshmaydi (mahsulotlar 0 so'mgacha tushishi mumkin,
         yetkazish narxi to'lanadi).
      4. Subtotal min_subtotal'dan kam bo'lsa promo qo'llanmaydi (xato emas, oddiy narx).
      5. Mijozga ko'rsatiladigan va to'lovga yuboriladigan summa bir xil bo'lishi shart.

  - key: doc_ticket_lz214
    title: "LZ-214: Promo-kod bilan noto'g'ri summa"
    content: |
      Ustuvorlik: High (bugungi relizni to'sib turibdi). Topdi: QA (Malika).

      1-holat: savatcha 80 000 so'm, yetkazish 15 000 so'm, SALE20 (20%).
      Kutilgan: 80 000 − 16 000 + 15 000 = 79 000. Haqiqiy: 76 000.

      2-holat: savatcha 30 000 so'm, yetkazish 12 000 so'm, MINUS50K (50 000 so'm, min_subtotal 0).
      Kutilgan: 0 + 12 000 = 12 000. Haqiqiy: to'lov xizmati 500 qaytaradi.

      Mijozlardan 3 ta shikoyat bor. Talab: tuzatish + regress testlar.

  - key: doc_code_review
    title: "Code review qoidalari"
    content: |
      PR tavsifida: muammo, sabab, yechim, qanday tekshirilgan. Har bug fix uchun avval bug'ni
      qayta tiklaydigan test, keyin tuzatish. Chegara holatlari: 0, manfiy, juda katta qiymat,
      yaxlitlash. Pul summalari bilan float ishlatilmaydi — faqat butun son (so'm).

  - key: doc_cancel_spec
    title: "Talab: buyurtmani bekor qilish"
    content: |
      Mijoz ilovada "Bekor qilish" tugmasini bosadi.
      - Buyurtma holati `new` (restoran hali qabul qilmagan) — mijoz o'zi bekor qila oladi, pul to'liq qaytadi.
      - `accepted` yoki `cooking` — mijoz bekor qila olmaydi, "operator bilan bog'laning" deyiladi.
      - `delivering`, `delivered`, `cancelled` — bekor qilib bo'lmaydi.
      - Bekor qilish sababi ixtiyoriy (ro'yxatdan yoki matn, 200 belgigacha).
      - Pul qaytarish to'lov xizmati orqali (refund), mijozga push xabar.
      - Ilova internet uzilib qayta yuborsa — ikki marta refund bo'lmasligi kerak.
      - Faqat buyurtma egasi bekor qila oladi.

  - key: doc_incident_runbook
    title: "Prod incident runbook"
    content: |
      1. #incidents kanalida e'lon qiling: nima buzildi, qachondan, ta'sir (qancha mijoz/foiz), SEV darajasi.
         SEV-1 — asosiy oqim (buyurtma berish/to'lov) to'xtagan yoki xatolar >10%. SEV-2 — qisman.
      2. Muammo relizdan keyin boshlangan bo'lsa — avval ta'sirni to'xtating: yangi funksiyani feature flag
         bilan o'chiring yoki oldingi versiyaga qayting (rollback). Sababni keyin qidiring.
      3. Har 30 daqiqada holat yangilanishi (hatto "hali tekshiryapmiz" bo'lsa ham).
      4. Barqarorlashgandan keyin: sabab, vaqt chizig'i, ta'sir, oldini olish choralari — postmortem 2 ish kuni ichida.
      Taqiqlanadi: prod DB'ga qo'lda o'zgartirish, sababi aniq bo'lmagan "tezkor fix"ni testlarsiz chiqarish.

  - key: doc_incident_logs
    title: "Monitoring: orders-service, bugun 15:00–15:30"
    content: |
      15:10  deploy orders-service v2.14.0 (yangi: courier_location_sync job, flag courier_sync_enabled=true)
      15:14  p95 latency 220ms → 3.8s
      15:18  5xx ulushi 0.3% → 14%
      15:20  ERROR sqlalchemy.exc.TimeoutError: QueuePool limit of size 20 overflow 10 reached, connection timed out
      15:21  WARN courier_location_sync: 412 kuryer uchun sessiya ochildi, tugatilgani: 0
      15:25  Buyurtma berish muvaffaqiyati 97% → 81%
      DB CPU 35% (normal). Tarmoq xatosi yo'q.

nodes:
  - id: welcome
