      - {id: concrete, description: "Reja aniq va tekshirsa bo'ladigan: nima qilinadi, nima natija chiqadi", weight: 2}
      - {id: blockers, description: "To'siq yoki savolni ochiq aytgan (masalan, kirish huquqlari, kod bazasi bilan tanishish)"}
    hints:
      - "Onboarding hujjatidagi uch savolga javob bering. Birinchi kunda 'kecha' o'rniga nima bilan tanishganingizni yozsa bo'ladi."
    reference_answer: |
      Bugun: onboarding va orders-service kodi bilan tanishaman, menga berilgan birinchi ticket'ni olaman.
      Natija: ticket bo'yicha sababni topib, testlar bilan PR ochish.
      To'siq: repo va staging'ga kirish huquqi hali yo'q — Sardordan so'rayman.

  - id: mentor_intro
    type: message
    day: 1
    at: "09:15"
    from: nodir
    brief: |
      Salom! Men Nodir, birinchi haftangizda mentoringizman. Tayyor javob bermayman, lekin to'g'ri
      savol bilan yo'naltiraman. Qiyin bo'lsa "hint" so'rang — faqat har hint task balini biroz kamaytiradi.

  - id: bug_promo
    type: task
    day: 1
    at: "09:30"
    from: sardor
    brief: |
      Birinchi ticket: LZ-214 — promo-kod bilan summa noto'g'ri hisoblanyapti, bugungi 15:00
      relizini to'sib turibdi. Sababini toping, calculate_total'ni tuzating va regress testlar yozing.
      Javobda: kod (funksiya + testlar) va qisqa izoh — sabab nima edi, nimani o'zgartirdingiz.
    attachments: [doc_ticket_lz214, doc_orders_service, doc_promo_rules]
    answer_types: [code, text, link]
    due_in_minutes: 150
    weight: 2
    competencies: [technical]
    rubric:
      - {id: root_cause, description: "Ikkala sababni topgan: chegirma yetkazish narxiga ham qo'llanyapti va qat'iy promo jamini manfiy qiladi", weight: 2}
      - {id: fix_correct, description: "Tuzatish promo qoidalarining barchasiga mos: faqat subtotal, chegirma subtotal'dan oshmaydi, min_subtotal, butun so'm", weight: 2}
      - {id: tests, description: "Ticket'dagi ikkala holat va chegara holatlari uchun testlar (0, min_subtotal, 100%)", weight: 1.5}
      - {id: money_types, description: "Pul uchun float ishlatmagan, yaxlitlash qoidaga mos (pastga)"}
      - {id: explanation, description: "Izoh qisqa va aniq: sabab, yechim, qanday tekshirilgan"}
    hints:
      - "Ticket'dagi 1-holatni qo'lda hisoblang: 76 000 qanday chiqyapti? Chegirma qaysi summadan olinyapti?"
      - "Promo qoidalarining 1 va 3-bandlarini kodda alohida qadam qilib yozing: avval chegirmani hisoblang, keyin uni cheklang."
      - "Testlarni avval yozing: ticket'dagi ikkala holat qizil bo'lishi kerak, tuzatishdan keyin yashil."
    reference_answer: |
      Sabab: chegirma subtotal + delivery_fee jamiga qo'llanyapti (foizli promo yetkazishni ham arzonlashtiradi),
      qat'iy promo esa cheklanmagan, shuning uchun jami manfiy bo'lib, to'lov xizmati 500 qaytaradi. Float bilan bo'lish ham bor.
      def calculate_total(items, delivery_fee, promo=None):
          subtotal = sum(i.price * i.qty for i in items)
          discount = 0
          if promo and subtotal >= promo.min_subtotal:
              if promo.kind == "percent":
                  discount = subtotal * promo.value // 100
              elif promo.kind == "fixed":
                  discount = min(promo.value, subtotal)
          return subtotal - discount + delivery_fee
      Testlar: SALE20 80000+15000 -> 79000; MINUS50K 30000+12000 -> 12000; min_subtotal'dan kam -> promo'siz; 100% -> faqat yetkazish.

  - id: qa_ack
    type: message
    after: {node: bug_promo, event: submitted, minutes: 10}
    from: malika
    brief: "Tuzatishingizni oldim, staging'da ticket'dagi holatlarni tekshirib ko'raman. Rahmat!"

  - id: pm_request
    type: decision
    day: 1
    at: "11:30"
    from: aziza
    brief: |
      Salom! Hamkor restoranlar bugun "buyurtmani bekor qilish" funksiyasini so'rashdi. 15:00 dagi
      relizga ulgurtirsangiz zo'r bo'lardi — promo bug'i kutib tursa ham bo'ladi, shikoyat atigi 3 ta-ku.
      Nima qilasiz?
    competencies: [prioritization, communication]
    options:
      - key: finish_bug
        label: "Avval LZ-214 ni tugataman (u relizni to'sib turibdi), Aziza'ga bekor qilish uchun real muddatni yozaman va Sardorni xabardor qilaman"
        grade: correct
      - key: ask_lead
        label: "Hech narsani o'zgartirmay, Sardordan qaysi biri muhimroq ekanini so'rayman"
        grade: acceptable
      - key: switch_now
        label: "Bug'ni qoldirib, darhol bekor qilish funksiyasini boshlayman"
        grade: wrong
        flag: dropped_bug

  - id: lead_on_priority
    type: message
    day: 1
    at: "12:00"
    when: {flag: dropped_bug}
    from: sardor
    brief: |
      Aziza aytdi, LZ-214 ni qoldirgansiz. Ustuvorlikni men belgilayman: reliz bloklovchi bug
      yangi so'rovdan oldin turadi. Keyingi safar bunday so'rovni avval men bilan kelishing.

  - id: api_design
    type: task
    day: 1
    at: "14:00"
    from: sardor
    brief: |
      Bekor qilish funksiyasini ertaga boshlaymiz. Bugun dizaynini tayyorlang: endpoint (metod, yo'l),
      so'rov va javob tanasi, holat kodlari, qaysi holatda nima bo'ladi, takroriy so'rov (idempotentlik)
      va refund qanday chaqiriladi. Matn yoki hujjat havolasi bilan yuboring.
    attachments: [doc_cancel_spec]
    answer_types: [text, link]
    due_in_minutes: 120
    weight: 1.5
    competencies: [technical, communication]
    rubric:
      - {id: endpoint, description: "REST'ga mos endpoint (masalan POST /orders/{id}/cancel), so'rov/javob tanasi aniq"}
      - {id: states, description: "Barcha holatlar talabga mos qayta ishlangan: new — ruxsat, accepted/cooking — operator, qolganlari — rad; mos HTTP kodlar (409/403/404)", weight: 2}
      - {id: idempotency, description: "Takroriy so'rovda ikki marta refund bo'lmasligi yechilgan (Idempotency-Key yoki holatni atomik tekshirish)", weight: 2}
      - {id: security, description: "Faqat buyurtma egasi bekor qila olishi tekshiriladi"}
      - {id: clarity, description: "Dizayn boshqa dasturchi o'qib, darhol qura oladigan darajada tushunarli"}
    hints:
      - "Talabdagi har bir buyurtma holati uchun jadval tuzing: holat → javob kodi → nima bo'ladi."
      - "Internet uzilib so'rov ikki marta kelsa, ikkinchisi nimani ko'rishi kerak? Buyurtma holati allaqachon cancelled bo'ladi-ku."
    reference_answer: |
      POST /api/v1/orders/{order_id}/cancel, sarlavha Idempotency-Key, tana {reason?: string ≤200}.
      Egasi bo'lmasa 404. Holat new → bir tranzaksiyada SELECT ... FOR UPDATE, holat cancelled, refund so'rovi
      idempotency key bilan, 200 {status: cancelled, refund: pending}. accepted/cooking → 409 {code: contact_operator}.
      delivering/delivered → 409 {code: not_cancellable}. Allaqachon cancelled → 200 oldingi natija (ikkinchi refund yo'q).
      Push xabar refund tasdiqlangach yuboriladi.

  - id: qa_retest_failed
    type: message
    day: 1
    at: "14:15"
    when: {any: [{missed: bug_promo}, {score_lt: {node: bug_promo, value: 60}}]}
    from: malika
    brief: |
      LZ-214 bo'yicha: staging'da MINUS50K holati hali ham xato beryapti, reliz bu bug bilan chiqa olmaydi.
      Imkoningiz bo'lsa, tuzatishni qayta ko'rib chiqing — urinishlar qolgan bo'lsa qayta yuborsangiz bo'ladi.

  - id: incident_orders
    type: incident
    day: 1
    at: "15:30"
    from: sardor
    brief: |
      SHOSHILINCH: 15:10 relizdan keyin orders-service sekinlashdi, buyurtmalarning bir qismi o'tmayapti.
      Men hamkorlar bilan qo'ng'iroqdaman — incident'ni siz boshqaring. Runbook va loglar ilovada.
      Yozing: 1) #incidents uchun e'lon matni, 2) hozir qanday qadam qilasiz va nega, 3) taxminiy sabab.
    attachments: [doc_incident_runbook, doc_incident_logs]
    answer_types: [text]
    due_in_minutes: 45
    weight: 1.5
    competencies: [stress_handling, technical, communication]
    rubric:
      - {id: announce, description: "E'lon runbook'ga mos: nima buzildi, qachondan, ta'sir raqamlarda, to'g'ri SEV (xatolar >10% → SEV-1)", weight: 1.5}
      - {id: mitigate_first, description: "Avval ta'sirni to'xtatadi: courier_sync_enabled flag'ini o'chirish yoki v2.14.0 rollback; sabab qidirishni keyinga qoldiradi", weight: 2}
      - {id: diagnosis, description: "Loglardan sababni to'g'ri taxmin qilgan: yangi job DB ulanishlarini yopmayapti, pool tugagan"}
      - {id: follow_up, description: "Keyingi qadamlar: 30 daqiqalik yangilanish, tuzatish testlar bilan, postmortem"}
    hints:
      - "Runbook'ning 2-bandiga qarang: muammo relizdan keyin boshlangan bo'lsa, birinchi ish nima?"
      - "Loglarda 15:20 va 15:21 qatorlarini solishtiring — qaysi yangi narsa ulanishlarni egallab turibdi?"
    reference_answer: |
      E'lon: SEV-1. 15:14 dan orders-service sekin, 5xx 14%, buyurtma muvaffaqiyati 97% → 81%. v2.14.0 relizi bilan bog'liq.
      Qadam: darhol courier_sync_enabled=false (runbook: avval flag), 5 daqiqada metrikalar tiklanmasa — v2.14.0 rollback.
      Sabab: courier_location_sync har kuryer uchun DB sessiya ochib yopmayapti, QueuePool (20+10) tugagan.
      Keyin: 30 daqiqada yangilanish, sessiyani context manager bilan yopish + test, postmortem 2 kun ichida.

  - id: incident_thanks
    type: message
    after: {node: incident_orders, event: submitted, minutes: 20}
    from: sardor
    brief: "Rahmat, incident'ni ushlab turdingiz. Ertaga postmortem'ni birga yozamiz."

  - id: day1_end
    type: day_end
    day: 1
    at: "17:30"
    brief: |
      Kun yakuni. Sardorga qisqa hisobot yozing: bugun nima qildingiz, nima tugamadi va ertangi reja.
      Bugungi kundan bitta xulosa ham qo'shing.
    competencies: [communication]
    rubric:
      - {id: done, description: "Bugungi natijalar aniq sanalgan (ticket, dizayn, incident)", weight: 1.5}
      - {id: open_items, description: "Tugamagan ishlar va ertangi reja ochiq aytilgan"}
      - {id: reflection, description: "Kundan o'rganilgan aniq xulosa bor"}
